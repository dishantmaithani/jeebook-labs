<style>
/* Layout: one handheld console shell, screen on top, controls below. Single dark look by choice. */
:root{
  --bg:#1a1826; --shell:#4a3f7a; --shell-2:#352c5c; --bezel:#12101c;
  --paper:#f7f1e1; --paper-2:#e8dcc0; --ink:#221f2e; --accent:#f08a3c; --gold:#f2c14b; --muted:#b3a9d6;
  --f-display:"Press Start 2P", ui-monospace, monospace;
  --f-body:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--paper);margin:0}
body{font-family:var(--f-body);font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 28px;-webkit-tap-highlight-color:transparent}
.shell{max-width:760px;margin:0 auto;background:linear-gradient(170deg,var(--shell),var(--shell-2));border-radius:22px 22px 56px 22px;padding:16px 16px 22px;box-shadow:0 10px 0 #231d40, 0 18px 40px rgba(0,0,0,.45)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 12px;flex-wrap:wrap}
.brand h1{font:400 clamp(13px,2.6vw,18px)/1 var(--f-display);margin:0;color:var(--paper);letter-spacing:.06em;text-shadow:2px 2px 0 #231d40}
.brand span{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.screen{position:relative;width:100%;aspect-ratio:240/176;max-width:100%;background:#000;border:6px solid var(--bezel);border-radius:10px;overflow:hidden;outline:none}
.screen:focus-visible{box-shadow:0 0 0 3px var(--gold)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#box{position:absolute;left:2%;right:2%;bottom:2.5%;height:27%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px var(--paper-2);padding:.45em .8em;font:500 clamp(12px,2.75vw,21px)/1.32 var(--f-body);white-space:pre-line;overflow:hidden;cursor:pointer;user-select:none}
#box.withmenu #txt{display:block;padding-right:48%}
#box.tall{height:auto;min-height:27%;max-height:62%}
#arrow{position:absolute;right:.7em;bottom:.3em;color:var(--accent);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#menu{position:absolute;right:2%;bottom:2.5%;min-width:44%;max-width:96%;max-height:95%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:.3em;font:500 clamp(12px,2.6vw,20px)/1.25 var(--f-body);display:flex;flex-direction:column;gap:2px;z-index:2}
#menu.grid{display:grid;grid-template-columns:1fr 1fr}
#menu.wide{left:2%;right:2%}
#menu.top{bottom:auto;top:2.5%;max-height:66%}
#menu button{all:unset;box-sizing:border-box;position:relative;padding:.22em .5em .22em 1.3em;border-radius:4px;cursor:pointer;min-width:0}
#menu button.on{background:var(--paper-2)}
#menu button.on::before{content:"\25B6";position:absolute;left:.3em;top:50%;transform:translateY(-50%);color:var(--accent);font-size:.75em}
#menu button:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-block;font-size:.68em;padding:0 .45em;border-radius:3px;background:var(--c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);vertical-align:.12em;margin-left:.35em}
.row{display:flex;align-items:center;gap:.55em;flex-wrap:wrap}
.row b{font-weight:600}
.row i{font-style:normal;opacity:.7}
.bar{display:inline-block;width:5.5em;height:.45em;background:#3a3a3a;border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%}
.dim{opacity:.5}
.price{float:right;margin-left:1em;opacity:.75;font-variant-numeric:tabular-nums}

.pad{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:22px 6px 0;user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.dpad button,.ab button,.mid button{all:unset;cursor:pointer;touch-action:none}
.dpad button{background:#221c3d;box-shadow:inset 0 -3px 0 #141026;color:var(--muted);display:grid;place-items:center;font-size:14px}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}
.dpad .c{grid-area:2/2;background:#221c3d;box-shadow:none}.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}
.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.dpad button:active,.dpad button.held{background:#332a57}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.mid button{background:#2a2348;color:var(--muted);font:400 9px var(--f-display);padding:8px 14px;border-radius:999px;letter-spacing:.08em;box-shadow:inset 0 -2px 0 #171228}
.ab{display:flex;gap:14px;transform:rotate(-18deg)}
.ab button{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font:400 14px var(--f-display);display:grid;place-items:center;box-shadow:inset 0 -4px 0 #b25f20, 0 3px 0 #231d40}
.ab button.b{background:#d9772f;margin-top:26px}
.ab button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #b25f20}
.dpad button:focus-visible,.ab button:focus-visible,.mid button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{max-width:760px;margin:16px auto 0;color:var(--muted);font-size:14px;line-height:1.5;text-align:center;text-wrap:balance}
kbd{font-family:var(--f-body);background:#2a2348;border-radius:4px;padding:0 .35em;color:var(--paper)}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}.ab button{width:50px;height:50px}.ab{gap:10px}}
@media (prefers-reduced-motion:reduce){#arrow{animation:none}}
</style>

<div class="shell">
  <div class="brand"><h1>ASPIRANT</h1><span id="place">A JEE life story</span></div>
  <div class="screen" id="screen" tabindex="0" aria-label="Game screen">
    <canvas id="cv" width="480" height="352"></canvas>
    <div id="box" hidden><span id="txt"></span><span id="arrow" hidden>&#9660;</span></div>

  </div>
  <div class="pad">
    <div class="dpad" aria-label="Direction pad">
      <button class="u" data-b="up" aria-label="Up">&#9650;</button>
      <button class="l" data-b="left" aria-label="Left">&#9664;</button>

<p class="hint">Move with <kbd>Arrows</kbd> or <kbd>WASD</kbd> · <kbd>Z</kbd>/<kbd>Space</kbd> is A (talk, confirm) · <kbd>X</kbd> is B (back) · <kbd>M</kbd> opens the menu · <kbd>N</kbd> turns sound on or off. Walk through the tall grass to meet wild concepts, catch them in a Notebook, and train for JEE.</p>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), X=cv.getContext('2d');
const SW=240, SH=176, TS=16;
const rnd=Math.random, rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(rnd()*a.length)];
/* ?debug in the URL adds a test console (window.ASP): fast mode skips typing and lets a script answer the menus */
const DBG=/[?&]debug/.test(location.search)?{fast:false,log:[],pick:null}:null;
const wait=ms=>new Promise(r=>setTimeout(r,DBG&&DBG.fast?ms/30:ms));
const now=()=>performance.now();
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');

/* ---------------- sound: tiny chiptune synth ---------------- */
const rep=(s,n)=>Array(n).fill(s).join(' ');
const octs=(notes,n=8)=>notes.map(x=>rep(`${x}2/1 ${x}3/1`,n/2)).join(' ');
const SONGS={
 home:{bpm:132,loop:true,tracks:[
  {w:'square',v:.055,hold:1,n:'E5/2 G5/2 C6/3 B5/1 A5/2 G5/2 E5/4 F5/2 A5/2 G5/2 E5/2 D5/6 -/2 E5/2 G5/2 C6/3 D6/1 E6/2 D6/2 C6/4 A5/2 B5/2 C6/2 G5/2 C6/6 -/2'},
  {w:'triangle',v:.16,hold:1,n:'C3/4 G3/4 C3/4 G3/4 F3/4 C4/4 G3/4 D3/4 C3/4 G3/4 A3/4 E3/4 F3/4 G3/4 C3/8'},
  {w:'drums',n:rep('k/2 h/2 s/2 h/2',8)}]},
 kota:{bpm:112,loop:true,tracks:[
  {w:'square',v:.045,hold:1,n:'A4/2 C5/2 E5/2 A5/2 G5/3 E5/1 D5/4 F5/2 A5/2 G5/2 E5/2 D5/6 -/2 A4/2 C5/2 E5/2 A5/2 B5/3 A5/1 G5/4 E5/2 G5/2 A5/2 E5/2 A5/6 -/2'},
  {w:'triangle',v:.15,hold:1,n:'A2/4 E3/4 A2/4 E3/4 F2/4 C3/4 G2/4 D3/4 A2/4 E3/4 G2/4 D3/4 F2/4 G2/4 A2/8'},
  {w:'drums',n:rep('k/2 h/2 s/2 h/1 k/1',8)}]},
 campus:{bpm:104,loop:true,tracks:[
  {w:'sine',v:.11,n:'C5/3 F5/1 A5/2 G5/2 F5/4 C5/4 D5/3 F5/1 A5/2 C6/2 A5/4 G5/4 Bb4/3 D5/1 F5/2 E5/2 D5/4 C5/4 E5/2 G5/2 Bb5/2 A5/2 F5/8'},
  {w:'square',v:.02,n:rep('F4/1 A4/1 C5/1 A4/1',4)+' '+rep('D4/1 F4/1 A4/1 F4/1',4)+' '+rep('Bb3/1 D4/1 F4/1 D4/1',4)+' '+rep('C4/1 E4/1 G4/1 E4/1',4)},
  {w:'triangle',v:.15,hold:1,n:'F2/6 C3/2 F3/4 C3/4 D3/6 A2/2 D3/4 A2/4 Bb2/6 F3/2 Bb2/4 F3/4 C3/6 G3/2 F2/8'},
  {w:'drums',n:rep('k/4 h/2 h/2 s/4 h/4',4)}]},
 life:{bpm:92,loop:true,tracks:[
  {w:'sine',v:.12,n:'D5/2 F5/2 A5/2 C6/2 B5/4 A5/4 G5/2 B5/2 D6/2 B5/2 A5/8 D5/2 F5/2 A5/2 D6/2 C6/4 A5/4 G5/2 E5/2 F5/2 E5/2 D5/8'},
  {w:'square',v:.018,n:rep('D4/1 A4/1 F5/1 A4/1',16)},
  {w:'triangle',v:.14,hold:1,n:'D3/8 A2/8 G2/8 D3/8 D3/8 F3/8 C3/8 D3/8'}]},
 battle:{bpm:168,loop:true,tracks:[
  {w:'square',v:.05,hold:1,n:'E5/1 E5/1 G5/1 E5/1 B5/2 A5/2 G5/2 F#5/2 E5/2 D5/2 E5/1 E5/1 G5/1 E5/1 C6/2 B5/2 A5/4 B5/4 G5/2 A5/2 B5/2 D6/2 C6/2 B5/2 A5/2 G5/2 F#5/2 G5/2 A5/2 F#5/2 E5/8'},
  {w:'triangle',v:.16,n:octs(['E','C','G','B'],16)},
  {w:'drums',n:rep('k/2 h/1 h/1 s/2 h/1 k/1',8)}]},
 boss:{bpm:176,loop:true,tracks:[
  {w:'square',v:.05,hold:1,n:'D5/2 F5/2 A5/2 D6/2 C#6/4 A5/4 Bb5/2 A5/2 G5/2 F5/2 E5/4 A4/4 D5/2 F5/2 A5/2 D6/2 F6/4 E6/4 D6/2 C#6/2 A5/2 E5/2 D5/8'},
  {w:'square',v:.022,n:rep('D4/1 F4/1 A4/1 F4/1',4)+' '+rep('Bb3/1 D4/1 F4/1 D4/1',4)+' '+rep('D4/1 F4/1 A4/1 F4/1',4)+' '+rep('A3/1 C#4/1 E4/1 C#4/1',4)},
  {w:'triangle',v:.16,n:octs(['D','Bb','F','A'],16).replace(/Bb3/g,'Bb2').replace(/Bb2\/1 Bb2/g,'Bb1/1 Bb2')},
  {w:'drums',n:rep('k/1 k/1 s/2 k/1 h/1 s/2',8)}]},
 victory:{bpm:140,loop:false,tracks:[
  {w:'square',v:.06,hold:1,n:'C5/1 E5/1 G5/1 C6/3 G5/1 C6/1 E6/6 D6/1 E6/1 F6/2 E6/2 D6/2 C6/6'},
  {w:'triangle',v:.16,hold:1,n:'C3/6 G3/2 C3/6 G2/2 F3/6 G3/6 C3/2'}]},
 evolve:{bpm:120,loop:true,tracks:[
  {w:'sine',v:.1,n:rep('C5/1 E5/1 G5/1 C6/1',2)+' '+rep('D5/1 F5/1 A5/1 D6/1',2)+' '+rep('E5/1 G5/1 B5/1 E6/1',2)+' '+rep('F5/1 A5/1 C6/1 F6/1',2)},
  {w:'triangle',v:.14,hold:1,n:'C3/8 D3/8 E3/8 F3/8'}]},
};
SONGS.title=SONGS.home;
const JINGLES={
 heal:{bpm:200,w:'square',n:'C5/1 E5/1 G5/1 C6/1 G5/1 C6/3'},
 levelup:{bpm:220,w:'square',n:'G5/1 A5/1 B5/1 D6/1 G6/4'},
 catch:{bpm:180,w:'square',n:'G4/1 C5/1 E5/1 G5/2 E5/1 G5/1 C6/5'},
 item:{bpm:200,w:'square',n:'E5/1 G5/1 E6/1 C6/1 D6/1 G6/3'},
 evolved:{bpm:160,w:'square',n:'C5/1 G5/1 C6/1 E6/1 G6/2 E6/1 G6/5'},
 result:{bpm:150,w:'square',n:'C5/2 C5/1 C5/1 G5/4 E5/2 G5/2 C6/6'},
 sad:{bpm:110,w:'triangle',n:'E5/2 D5/2 C5/2 B4/2 A4/6'},
};
const SND=(()=>{
  let ctx=null,master,mus,sfxG,noiseBuf,muted=false,want=null,cur=null,timer=null;
  try{muted=localStorage.getItem('aspirant-mute')==='1'}catch(e){}
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const midi=s=>{const m=/^([A-G])(#|b)?(\d)$/.exec(s);return 12*(+m[3]+1)+NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)};
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const parse=s=>s.trim().split(/\s+/).map(t=>{const [n,d]=t.split('/');return [n,+d]});
  for(const s of Object.values(SONGS))for(const tr of s.tracks)tr.ev=tr.ev||parse(tr.n);
  for(const j of Object.values(JINGLES))j.ev=parse(j.n);
  function init(){
    if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC()}catch(e){return false}
    master=ctx.createGain();master.gain.value=muted?0:.8;master.connect(ctx.destination);
    mus=ctx.createGain();mus.gain.value=.5;mus.connect(master);sfxG=ctx.createGain();sfxG.gain.value=.75;sfxG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    timer=setInterval(tick,40);return true;
  }
  function tone(w,f,t,dur,v,dest,{slide=0,hold=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=w;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);
    if(hold){g.gain.setValueAtTime(v*.8,t+dur*.75);g.gain.linearRampToValueAtTime(0,t+dur*.98)}else g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);
  }
  function noise(t,dur,v,hp,dest){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+.02);
  }
  function drum(k,t,dest){if(k==='k')tone('sine',150,t,.14,.5,dest,{slide:.3});else if(k==='s')noise(t,.13,.22,1500,dest);else if(k==='h')noise(t,.035,.07,7000,dest)}
  function startSong(name){
    const s=SONGS[name];
    if(cur){const old=cur.gain;old.gain.setTargetAtTime(0,ctx.currentTime,.08);setTimeout(()=>old.disconnect(),600);cur=null}
    if(!s)return;
    const g=ctx.createGain();g.gain.value=1;g.connect(mus);const t0=ctx.currentTime+.08;
    cur={name,s,gain:g,step:60/s.bpm/2,tr:s.tracks.map(tr=>({tr,i:0,t:t0,done:false}))};
  }
  function tick(){
    if(!ctx)return;
    if(want!==(cur?cur.name:null)&&ctx.state==='running')startSong(want);
    if(!cur)return;const ahead=ctx.currentTime+.25;
    for(const st of cur.tr){
      while(!st.done&&st.t<ahead){
        const [n,d]=st.tr.ev[st.i],dur=d*cur.step;
        if(n!=='-'){if(st.tr.w==='drums')drum(n,st.t,cur.gain);else tone(st.tr.w,hz(midi(n)),st.t,dur,st.tr.v,cur.gain,{hold:st.tr.hold})}
        st.t+=dur;st.i++;
        if(st.i>=st.tr.ev.length){if(cur.s.loop)st.i=0;else st.done=true}
      }
    }
  }
  function sfx(name){
    if(!ctx||muted)return;const t=ctx.currentTime+.01,o=sfxG;
    switch(name){
      case 'blip':tone('square',1320,t,.04,.05,o);break;
      case 'move':tone('square',880,t,.03,.04,o);break;
      case 'select':tone('square',988,t,.05,.06,o);tone('square',1319,t+.05,.07,.06,o);break;
      case 'back':tone('square',660,t,.05,.05,o);tone('square',440,t+.05,.07,.05,o);break;
      case 'bump':tone('triangle',110,t,.08,.25,o,{slide:.7});break;
      case 'door':noise(t,.25,.12,400,o);tone('triangle',330,t,.2,.12,o,{slide:.5});break;
      case 'encounter':for(let i=0;i<6;i++)tone('square',660+i*110,t+i*.06,.06,.05,o);break;
      case 'hit':noise(t,.12,.3,800,o);tone('square',220,t,.1,.08,o,{slide:.5});break;
      case 'super':noise(t,.18,.35,500,o);tone('square',440,t,.16,.09,o,{slide:.3});tone('square',660,t+.05,.12,.06,o,{slide:.4});break;
      case 'weak':noise(t,.08,.15,2000,o);tone('triangle',180,t,.08,.15,o);break;
      case 'miss':tone('sine',600,t,.15,.08,o,{slide:.5});break;
      case 'statup':for(let i=0;i<4;i++)tone('square',523*Math.pow(1.19,i),t+i*.05,.06,.05,o);break;
      case 'statdown':for(let i=0;i<4;i++)tone('square',784/Math.pow(1.19,i),t+i*.05,.06,.05,o);break;
      case 'faint':tone('square',600,t,.5,.08,o,{slide:.15});break;
      case 'throw':tone('sine',300,t,.35,.12,o,{slide:3});break;
      case 'shake':tone('triangle',200,t,.06,.2,o);tone('triangle',170,t+.12,.06,.2,o);break;
      case 'break':noise(t,.15,.2,1500,o);tone('square',500,t,.15,.07,o,{slide:.5});break;
      case 'run':for(let i=0;i<3;i++)tone('triangle',300+i*80,t+i*.07,.06,.15,o);break;
      case 'heal':for(let i=0;i<5;i++)tone('sine',660+i*120,t+i*.05,.08,.08,o);break;
      case 'coin':tone('square',988,t,.06,.05,o);tone('square',1319,t+.06,.18,.05,o);break;
      case 'bell':tone('sine',1568,t,.5,.12,o);tone('sine',1175,t+.25,.6,.1,o);break;
    }
  }
  function jingle(name){
    const j=JINGLES[name];if(!ctx||muted||!j)return 0;const step=60/j.bpm/2;let t=ctx.currentTime+.02,len=0;
    for(const [n,d] of j.ev){const dur=d*step;if(n!=='-')tone(j.w,hz(midi(n)),t,dur,.07,sfxG,{hold:1});t+=dur;len+=dur}
    mus.gain.setTargetAtTime(.08,ctx.currentTime,.03);mus.gain.setTargetAtTime(.5,ctx.currentTime+len+.1,.15);
    return len*1000;
  }
  return{
    unlock(){if(init()&&ctx.state==='suspended')ctx.resume()},
    music(name){want=name},
    sfx,jingle,
    get muted(){return muted},
    toggle(){muted=!muted;try{localStorage.setItem('aspirant-mute',muted?'1':'0')}catch(e){}
      if(init()){master.gain.setTargetAtTime(muted?0:.8,ctx.currentTime,.05);if(ctx.state==='suspended')ctx.resume()}return muted},
  };
})();

}

function paginate(text){

  const parts=String(text).split(/(\s+)/),out=[];let cur='';
  for(const w of parts){txt.textContent=cur+w;
    if(box.scrollHeight>box.clientHeight+1&&cur.trim()){out.push(cur.trim());cur=w.trim()?w:''}else cur+=w}
  if(cur.trim())out.push(cur.trim());txt.textContent='';return out.length?out:[''];
}
function say1(text){
  if(DBG&&DBG.fast){DBG.log.push(text);if(DBG.log.length>6000)DBG.log.splice(0,2000);txt.textContent=text;return Promise.resolve()}
  return new Promise(res=>{
    menu.hidden=true;box.classList.remove('withmenu');box.hidden=false;arrow.hidden=true;
    let i=0,done=false;txt.textContent='';
    const tm=setInterval(()=>{i+=2;txt.textContent=text.slice(0,i);if(i>=text.length){clearInterval(tm);done=true;arrow.hidden=false}},16);
    const go=()=>{if(!done){clearInterval(tm);txt.textContent=text;done=true;arrow.hidden=false;return}handler=null;box.onclick=null;arrow.hidden=true;SND.sfx('blip');res()};
    handler=b=>{if(b==='A'||b==='B')go()};box.onclick=go;
  });
}

    const i=DBG.pick(plain,prompt||'',cancel);DBG.log.push(`[${prompt||''}] > ${i<0?'(back)':plain[i]}`);return Promise.resolve(i)}

    if(prompt!==null){box.hidden=false;arrow.hidden=true;txt.textContent=prompt;box.onclick=null;box.classList.toggle('withmenu',!wide&&!top)}else box.hidden=true;

async function travel(id,x,y,dir){SND.sfx('door');await fade(()=>{SCENE=null;mode='world';enterMap(id,x,y,dir)});AREA={name:CUR.name,t0:now()}}
function pickWeighted(list){let t=list.reduce((s,x)=>s+x[1],0),r=rnd()*t;for(const [k,w] of list){if((r-=w)<0)return k}return list[0][0]}
async function transition(){SND.sfx('encounter');TRANS=now();await wait(700);TRANS=0}
const teachersBeaten=()=>['tPhy','tChem','tMath'].filter(k=>G.flags[k]).length;
function zoneLv(z){const Z=ZONES[z];const boost=G.ch===2?teachersBeaten()*3+(G.drops?2:0):0;return rint(Z.lv[0]+boost,Z.lv[1]+boost)}
async function wildEncounter(z){
  const m=makeMon(pickWeighted(ZONES[z].mons),zoneLv(z));
  await transition();
  const r=await battle({wild:true,foes:[m]});
  if(r==='lose')await blackout();
  else if(r!=='run')await passDays(1); /* in Kota every battle is a day of practice */
}
async function blackout(){
  await say('All your concepts are worn out. Your head is spinning...');
  healAll();
  if(G.ch===1){enterMap('home',4,16,'up');await say('Mom found you dozing in the park and walked you home. A glass of haldi doodh later, everyone feels fine.')}
  else if(G.ch===2){enterMap('kota',4,19,'up');mood(-6);await say('You dragged yourself back to the PG and slept off a fever. Three days gone.');await passDays(3)}
  else{enterMap('campus',4,12,'up');if(G.col)G.col.health=clamp(G.col.health-6,0,100);await say('You crashed in your hostel room and woke up at noon. Your wingmates covered your attendance.')}
}
function interact(){
  const [dx,dy]=DIRS[P.dir];const n=npcAt(P.x+dx,P.y+dy);
  if(n){run(async()=>{if(!n.sign&&!n.item)n.dir={up:'down',down:'up',left:'right',right:'left'}[P.dir];
    if(n.sign)await say(typeof n.text==='function'?n.text():n.text);else if(n.item)await pickUp(n);
    else if(n.act)await n.act(n);else if(n.team)await trainer(n);
    else await sayAll(typeof n.lines==='function'?n.lines():n.lines,n.name)});return}
  const t=tile(P.x+dx,P.y+dy);
  if(t==='~')run(()=>say('The water is still. A good place to sit and think.'));
  else if(CUR.bld[t])run(()=>say(`${CUR.bld[t].label}. Someone is standing outside. Talk to them.`));
}
async function pickUp(n){
  G.bag[n.item]=(G.bag[n.item]||0)+n.n;G.flags[n.id]=true;
  SND.jingle('item');await say(`You found ${n.n>1?n.n+' ':'a '}${n.item}${n.n>1&&!/s$/.test(n.item)?'s':''}!`);
}
async function shop(keys,hello,bye){
  await say(hello);let last=0;
  for(;;){
    const c=await choose(keys.map(k=>`${k}<span class="price">${inr(ITEMS[k].price)}</span>`).concat(['Done']),{prompt:`You have ${inr(G.money)}.\n`,cancel:true,start:last});
    if(c<0||c===keys.length)break;last=c;const k=keys[c],it=ITEMS[k];
    if(G.money<it.price){await say('You don\'t have enough pocket money for that.');continue}
    G.money-=it.price;G.bag[k]=(G.bag[k]||0)+1;SND.sfx('coin');await say(`You bought ${k}. ${it.desc} You now have ${G.bag[k]}.`);
  }
  await say(bye);
}
async function trainer(n){
  if(G.flags[n.id]){await say(`${n.name}: ${n.post}`);return}
  await sayAll(n.pre,n.name);
  await transition();
  const up=G.ch===2?G.drops*4:0; /* drop years: a tougher batch */
  const team=(typeof n.team==='function'?n.team():n.team).map(([s,l])=>makeMon(s,l+up));
  const r=await battle({wild:false,trainer:n,foes:team});
  if(r==='win'){G.flags[n.id]=true;await say(`${n.name}: ${n.lose}`);if(n.reward){G.money+=n.reward;await say(`You got ${inr(n.reward)} for winning.`)}if(n.onWin)await n.onWin();await passDays(1)}
  else if(r==='lose')await blackout();
}
function statusText(){
  const top=`${G.name}, age ${G.age}  ·  ${inr(G.money)}`;
  if(G.ch===1)return `${top}\nSchool kid in Chhota Nagar. Mood ${G.mood}/100\nDex: ${G.caught.length} of ${DEX.length} concepts`;
  if(G.ch===2)return `${top}\nJEE aspirant in Kota${G.drops?` (drop year ${G.drops})`:''}. Mood ${G.mood}/100\nJEE in ${Math.max(0,G.daysLeft)} days  ·  Teachers beaten: ${teachersBeaten()}/3`;
  const c=G.col;return `${top}\n${G.branch} at ${G.college.n}, semester ${Math.min(8,c.sem)}/8\nCGPA ${c.cgpa.toFixed(1)}  Skill ${c.skill}  Friends ${c.social}  Health ${c.health}`;
}
async function pauseMenu(){
  let last=0;
  for(;;){
    const c=await choose(['Concepts','Bag','Dex','Save','Close'],{prompt:statusText(),cancel:true,start:last});
    last=c;
    if(c===0)await teamMenu(false);
    else if(c===1)await bagMenu(false);
    else if(c===2)await dexMenu();
    else if(c===3){await say(saveGame()?'Game saved.':'Saving isn\'t available in this browser.')}
    else return;
  }
}
async function dexMenu(){
  let last=0;
  for(;;){
    const rows=DEX.map((s,i)=>{const n=String(i+1).padStart(2,'0'),c=G.caught.includes(s),sn=G.seen.includes(s);
      return `<span class="row ${c?'':'dim'}"><i>#${n}</i><b>${sn?s:'?????'}</b>${sn?SP[s].t.map(chip).join(''):''}${c?'<i>learned</i>':''}</span>`});
    const c=await choose(rows,{wide:true,cancel:true,start:last});
    if(c<0)return;last=c;const s=DEX[c];
    if(G.caught.includes(s))await say(`${s} (${SP[s].t.join('/')})\n${SP[s].dex}`);
    else if(G.seen.includes(s))await say(SP[s].cr?`${s}: seen, but not in your notebook yet.`:`${s}\n${SP[s].dex}\n(Life's distractions can't be caught, only beaten.)`);
    else await say('You haven\'t met this one yet.');
  }
}
/* team / bag shared by world + battle */
async function teamMenu(inBattle,forced=false){
  let last=0;
  for(;;){
    if(!G.party.length){await say('You have no concepts yet.');return null}
    const c=await choose(G.party.map(m=>monRow(m,inBattle&&B&&m===B.me)),{wide:true,cancel:!forced,start:last});
    if(c<0)return null;last=c;const m=G.party[c];
    if(inBattle){
      const s=await choose(['Switch in','Info','Back'],{prompt:`${m.sp} - what to do?`,cancel:true});
      if(s===0){if(m.hp<=0){await say(`${m.sp} has no energy left.`);continue}
        if(m===B.me){await say(`${m.sp} is already out!`);continue}
        return {type:'switch',mon:m}}
      if(s===1)await say(info(m));
    }else{
      const s=await choose(['Info','Make lead','Back'],{prompt:`${m.sp} - what to do?`,cancel:true});
      if(s===0){await say(info(m));await say(SP[m.sp].dex)}
      if(s===1){G.party.splice(c,1);G.party.unshift(m);await say(`${m.sp} will go out first now.`);last=0}
    }
  }
}
async function bagMenu(inBattle){
  for(;;){
    const keys=Object.keys(G.bag).filter(k=>G.bag[k]>0);
    if(!keys.length){await say('Your bag is empty.');return null}
    const c=await choose(keys.map(k=>`${k}<span class="price">x${G.bag[k]}</span>`),{prompt:'Use which item?',cancel:true});
    if(c<0)return null;const k=keys[c],it=ITEMS[k];
    if(it.orb){
      if(!inBattle){await say('Notebooks are for writing down a wild concept during battle.');continue}
      if(!B.wild){await say(B.exam?'No notebooks allowed in the exam hall!':'You can\'t take notes from someone else\'s concept!');continue}
      return {type:'orb',item:k};
    }
    if(inBattle&&B.exam){await say('The invigilator glares at you. No snacks in the exam hall!');continue}
    if(!G.party.length){await say('Nobody to give it to.');continue}
    const t=await choose(G.party.map(m=>monRow(m)),{wide:true,cancel:true});
    if(t<0)continue;const m=G.party[t],mx=maxhp(m);
    if(m.hp<=0||m.hp>=mx){await say('It won\'t have any effect.');continue}
    const h=Math.min(it.heal,mx-m.hp);m.hp+=h;G.bag[k]--;SND.sfx('heal');if(B&&m===B.me)B.dhp.me=m.hp;
    await say(`${m.sp} recovered ${h} HP.`);
    if(inBattle)return {type:'used'};
  }
}

/* ---------------- battle ---------------- */
const stg=()=>({atk:0,def:0,spd:0});
const mul=s=>s>=0?(2+s)/2:2/(2-s);
const other=s=>s==='me'?'foe':'me';
const monOf=s=>s==='me'?B.me:B.foe;
const lbl=s=>s==='me'?B.me.sp:(B.exam?`The ${B.foe.sp} problem`:B.wild?`The wild ${B.foe.sp}`:`Foe ${B.foe.sp}`);
function tween(ms,f){if(DBG&&DBG.fast){f(1);return Promise.resolve()}return new Promise(res=>{const t0=now();const step=()=>{const k=Math.min(1,(now()-t0)/ms);f(k);k<1?requestAnimationFrame(step):res()};step()})}
async function waitHp(){if(DBG&&DBG.fast){B.dhp.me=B.me.hp;B.dhp.foe=B.foe.hp;return}while(Math.abs(B.dhp.me-B.me.hp)>.01||Math.abs(B.dhp.foe-B.foe.hp)>.01)await wait(30)}

/* o = {wild, trainer, foes, exam:{name,turns,per,neg}, bg}. Exams are timed: every round costs one turn on the clock. */
async function battle(o){
  B={wild:!!o.wild,trainer:o.trainer,exam:o.exam||null,foes:o.foes,fi:0,foe:o.foes[0],me:G.party.find(m=>m.hp>0),
     music:(o.exam||(o.trainer&&o.trainer.boss))?'boss':'battle',st:{me:stg(),foe:stg()},dhp:{},show:{me:false,foe:true},flash:{me:0,foe:0},shake:{me:0,foe:0},
     orb:null,runs:0,part:new Set(),enter:now(),bg:o.bg||CUR.bg,marks:0,left:o.exam?o.exam.turns:0};
  if(!B.me){B=null;return o.exam?{r:'blank',marks:0}:'lose'}
  B.dhp.foe=B.foe.hp;B.dhp.me=B.me.hp;mode='battle';markSeen(B.foe.sp);
  if(B.exam){await say(`${B.exam.name}. ${B.foes.length} questions, ${B.left} turns on the clock.`);await say(`Question 1: a ${B.foe.sp} problem!`)}
  else if(B.wild)await say(`A wild ${B.foe.sp} appeared!`);
  else{await say(`${B.trainer.name} ${B.trainer.verb||'wants to battle'}!`);await say(`${B.trainer.name} sent out ${B.foe.sp}!`)}
  B.show.me=true;B.part.add(B.me);await say(`Go, ${B.me.sp}!`);
  for(;;){
    const act=await playerAction();let myMove=null;
    if(act.type==='run'){
      if(B.exam){await say('You can\'t walk out of the exam hall!');continue}
      if(!B.wild){await say('You can\'t walk away from this one!');continue}
      B.runs++;const ms=stats(B.me).spd,fs=stats(B.foe).spd;
      if(ms>=fs||rnd()<.4+B.runs*.2){SND.sfx('run');await say('Got away safely!');return endBattle('run')}
      await say('Couldn\'t get away!');
    }else if(act.type==='orb'){
      if(!SP[B.foe.sp].cr){await say(`You can't write ${B.foe.sp} down in a notebook. Distractions can only be beaten!`);continue}
      G.bag[act.item]--;if(await throwOrb(act.item))return endBattle('caught')}
    else if(act.type==='switch'){await say(`Come back, ${B.me.sp}!`);B.show.me=false;await wait(200);
      B.me=act.mon;B.st.me=stg();B.dhp.me=B.me.hp;B.part.add(B.me);B.show.me=true;await say(`Go, ${B.me.sp}!`)}
    else if(act.type==='move')myMove=act.m;
    await doTurn(myMove);
    const r=await resolveFaints();if(r)return endBattle(r);
    if(B.exam){B.left--;if(B.left<=0){SND.sfx('bell');await say('The bell rings. "Pens down, everyone!"');return endBattle('time')}
      if(B.left===3)await say('Invigilator: "Last few minutes!"')}
  }
}
async function playerAction(){
  for(;;){
    const c=await choose(['Fight','Bag','Team','Run'],{grid:true,prompt:`What will ${B.me.sp} do?`});
    if(c===0){const mv=await choose(B.me.moves.map(n=>`${n}${chip(MV[n].t)}`),{grid:true,wide:true,cancel:true});if(mv<0)continue;return{type:'move',m:B.me.moves[mv]}}
    if(c===1){const r=await bagMenu(true);if(r)return r;continue}
    if(c===2){const r=await teamMenu(true);if(r)return r;continue}
    if(c===3)return{type:'run'};
  }
}
function foeMove(){
  const f=B.foe,m=B.me;
  const scored=f.moves.map(n=>{const mv=MV[n];let s;
    if(mv.heal)s=f.hp<maxhp(f)*.45?40:2;
    else if(!mv.p){const [who,k,d]=mv.fx;const cur=B.st[who==='self'?'foe':'me'][k];s=(Math.abs(cur+d)>3)?1:18}
    else s=mv.p*eff(mv.t,SP[m.sp].t)*(SP[f.sp].t.includes(mv.t)?1.25:1)*(mv.a||100)/100;
    return [n,s]});
  scored.sort((a,b)=>b[1]-a[1]);
  return rnd()<.7?scored[0][0]:scored[rint(0,scored.length-1)][0];
}
async function doTurn(myMove){
  const fm=foeMove();
  if(!myMove){await useMove('foe',fm);return}
  const pa=MV[myMove].pri||0,pb=MV[fm].pri||0;
  const sa=stats(B.me).spd*mul(B.st.me.spd),sb=stats(B.foe).spd*mul(B.st.foe.spd);
  const meFirst=pa!==pb?pa>pb:(sa!==sb?sa>sb:rnd()<.5);
  const order=meFirst?[['me',myMove],['foe',fm]]:[['foe',fm],['me',myMove]];
  for(const [s,m] of order){if(B.me.hp<=0||B.foe.hp<=0)break;await useMove(s,m)}
}
async function useMove(side,name){
  const a=monOf(side),d=monOf(other(side)),mv=MV[name],ts=other(side);
  await say(`${lbl(side)} used ${name}!`);
  if(mv.a&&rnd()*100>=mv.a){SND.sfx('miss');await say('But it missed!');return}
  if(mv.heal){const h=Math.min(Math.floor(maxhp(a)*mv.heal),maxhp(a)-a.hp);
    if(h<=0)await say('But its energy is already full.');else{a.hp+=h;SND.sfx('heal');await waitHp();await say(`${lbl(side)} calmed down and recovered ${h} HP.`)}return}
  if(mv.p){
    const sa=stats(a),sd=stats(d);
    const A=sa.atk*mul(B.st[side].atk),D=sd.def*mul(B.st[ts].def);
    const e=eff(mv.t,SP[d.sp].t),stab=SP[a.sp].t.includes(mv.t)?1.25:1,crit=rnd()<1/16?1.5:1;
    const base=Math.floor(Math.floor(Math.floor(2*a.lvl/5+2)*mv.p*A/D)/50)+2;
    const dmg=Math.max(1,Math.floor(base*stab*e*crit*(.85+rnd()*.15)));
    B.flash[ts]=now();B.shake[ts]=now();SND.sfx(e>1?'super':e<1?'weak':'hit');await wait(380);
    d.hp=Math.max(0,d.hp-dmg);await waitHp();
    if(crit>1)await say('A brilliant insight! Critical hit!');
    if(e>1)await say(mv.t==='Mind'?'A calm mind cuts right through it!':'Right concept for the problem! It\'s super effective!');
    else if(e<1)await say(mv.t==='Life'?'A steady mind barely notices...':'Wrong subject for this one... not very effective.');
  }
  if(mv.fx&&d.hp>0){
    const [who,k,dl]=mv.fx;const s=who==='self'?side:ts;const tgt=who==='self'?lbl(side):lbl(ts);
    const nm={atk:'Attack',def:'Defense',spd:'Speed'}[k];const cur=B.st[s][k];
    if(Math.abs(cur+dl)>6)await say(`${tgt}'s ${nm} won't go any ${dl>0?'higher':'lower'}!`);
    else{B.st[s][k]=cur+dl;SND.sfx(dl>0?'statup':'statdown');await say(`${tgt}'s ${nm} ${dl>0?'rose':'fell'}!`)}
  }
}
async function resolveFaints(){
  if(B.foe.hp<=0){
    SND.sfx('faint');await tween(350,k=>B.drop={side:'foe',k});B.show.foe=false;B.drop=null;
    const last=B.wild||B.fi>=B.foes.length-1;
    if(B.exam){B.marks+=B.exam.per;B.solved=(B.solved||0)+1;await say(`Solved it! +${B.exam.per} marks.`)}
    else{await say(`${lbl('foe')} ${B.wild?'gave up':'is out'}!`);if(last)B.music='victory';await giveExp()}
    if(!last){
      B.fi++;B.foe=B.foes[B.fi];B.st.foe=stg();B.dhp.foe=B.foe.hp;
      B.part=new Set([B.me].filter(m=>m.hp>0));
      markSeen(B.foe.sp);await say(B.exam?`Question ${B.fi+1}: a ${B.foe.sp} problem!`:`${B.trainer.name} sent out ${B.foe.sp}!`);B.show.foe=true;
    }else{if(B.exam){await say('You finished the whole paper with time to spare!');return 'done'}
      if(!B.wild)await say(`You beat ${B.trainer.name}!`);return 'win'}
  }
  if(B.me.hp<=0){
    SND.sfx('faint');await tween(350,k=>B.drop={side:'me',k});B.show.me=false;B.drop=null;
    if(B.exam){B.marks-=B.exam.neg;await say(`${B.me.sp} blanked out. A silly mistake! -${B.exam.neg} marks.`)}
    else await say(`${B.me.sp} is exhausted!`);
    if(!G.party.some(m=>m.hp>0)){if(B.exam){await say('Your mind has gone completely blank. You stare at the paper until the bell.');return 'blank'}return 'lose'}
    await say('Choose your next concept.');
    let r=null;while(!r)r=await teamMenu(true,true);
    B.me=r.mon;B.st.me=stg();B.dhp.me=B.me.hp;B.part.add(B.me);B.show.me=true;await say(`Go, ${B.me.sp}!`);
  }
  return null;
}
async function giveExp(){
  const ps=[...B.part].filter(m=>m.hp>0&&G.party.includes(m));if(!ps.length)return;
  const total=Math.floor(SP[B.foe.sp].xp*B.foe.lvl/7*(B.wild?1:1.5)*XPMUL);
  const each=Math.max(1,Math.floor(total/ps.length));
  for(const m of ps){await say(`${m.sp} gained ${each} XP!`);await addExp(m,each)}
  const rest=G.party.filter(m=>!ps.includes(m)&&m.hp>0);
  if(rest.length){const sh=Math.max(1,Math.floor(each*SHARE));for(const m of rest)await addExp(m,sh)}
}
async function addExp(m,g){
  m.exp+=g;
  while(m.lvl<MAXLV&&m.exp>=(m.lvl+1)**3){
    const old=maxhp(m);m.lvl++;m.hp+=maxhp(m)-old;if(B&&m===B.me)B.dhp.me=m.hp;
    SND.jingle('levelup');await say(`${m.sp} grew to level ${m.lvl}!`);
    for(const [l,mv] of SP[m.sp].learn)if(l===m.lvl)await learnMove(m,mv);
  }
}
async function learnMove(m,mv){
  if(m.moves.includes(mv))return;
  if(m.moves.length<4){m.moves.push(mv);await say(`${m.sp} learned ${mv}!`);return}
  await say(`${m.sp} wants to learn ${mv}, but it already knows four moves.`);
  const c=await choose(m.moves.map(n=>`${n}${chip(MV[n].t)}`).concat([`Skip ${mv}`]),{prompt:`Forget which move for ${mv}?`});
  if(c>=0&&c<4){const old=m.moves[c];m.moves[c]=mv;await say(`${m.sp} forgot ${old} and learned ${mv}!`)}
  else await say(`${m.sp} did not learn ${mv}.`);
}
async function throwOrb(item){
  const it=ITEMS[item],f=B.foe;
  sayNow(`You opened your ${item}!`);
  B.orb={x:40,y:120,rot:0,item};SND.sfx('throw');
  await tween(520,k=>{B.orb.x=40+(172-40)*k;B.orb.y=120+(50-120)*k-Math.sin(k*Math.PI)*50});
  B.absorb=now();await wait(300);B.show.foe=false;B.absorb=0;
  await tween(250,k=>{B.orb.y=50+(66-50)*k});
  const mx=maxhp(f);const p=Math.min(.98,((3*mx-2*f.hp)/(3*mx))*SP[f.sp].cr*it.orb*1.35);
  const ok=rnd()<p;const shakes=ok?3:(rnd()<p*1.4?2:rnd()<.6?1:0);
  for(let i=0;i<shakes;i++){await wait(250);SND.sfx('shake');await tween(420,k=>B.orb.rot=Math.sin(k*Math.PI*2)*.55);B.orb.rot=0}
  await wait(300);
  if(ok){
    B.orb.caught=true;B.music=null;await wait(SND.jingle('catch'));const isNew=!G.caught.includes(f.sp);markCaught(f.sp);await say(`Got it! You understood ${f.sp}!`);if(isNew)await say(`${f.sp} was added to your Dex.`);
    if(G.party.length<6){G.party.push(f);await say(`${f.sp} joined your team.`)}
    else{G.box.push(f);await say(`Your head is full, so ${f.sp} was filed away in your old notes.`)}
    return true;
  }
  B.orb=null;B.show.foe=true;SND.sfx('break');
  await say(['It slipped right out of your head!','Argh! You almost had it!','So close. It just needs one more revision!'][Math.min(shakes,2)]);
  return false;
}
async function endBattle(r){
  const ex=B.exam;let out=r;
  if(ex){
    if((r==='time'||r==='blank')&&B.foe.hp>0)B.marks+=Math.floor(ex.per*(1-B.foe.hp/maxhp(B.foe))*.5);
    out={r,marks:clamp(B.marks,0,ex.per*B.foes.length),solved:B.solved||0};
  }else if(r!=='lose')for(const m of G.party){const e=SP[m.sp].evo;if(e&&m.lvl>=e[1]&&m.hp>0)await evolve(m,e[0])}
  B=null;mode=SCENE?'scene':'world';hideUI();held=[];return out;
}
async function evolve(m,to){
  const from=m.sp;mode='evolve';EVO={from,to,t0:now(),done:false};
  await say(`What? ${from} is having a breakthrough!`);
  EVO.t0=now();await wait(2600);
  const old=maxhp(m);m.sp=to;m.hp+=maxhp(m)-old;EVO.done=true;SND.music(null);SND.jingle('evolved');markCaught(to);
  await say(`It clicked! ${from} evolved into ${to}!`);
  for(const [l,mv] of SP[to].learn)if(l===m.lvl)await learnMove(m,mv);
  EVO=null;mode=B?'battle':'world';
}

const PAPER_POOL={Physics:['Vectoid','Voltick','Opticat','Newtonaut'],Chemistry:['Bondbug','Acidrop','Benzring','Molemage'],Maths:['Trigon','Probbit','Matrixel','Calculord']};
const rk=n=>n.toLocaleString('en-IN');
async function paper(exam,subj,cfg,hard){
  const pool=PAPER_POOL[subj],base=pool.slice(0,3).sort(()=>rnd()-.5);
  const sps=hard?[base[0],base[1],pool[3]]:base;
  return battle({exam:{name:`${exam}: ${subj}`,turns:cfg.turns,per:cfg.per,neg:cfg.neg},foes:sps.map((s,i)=>makeMon(s,cfg.lv[i])),bg:'exam'});
}
async function sitting(exam,cfg,hard,outOf){
  let sum=0;
  for(let i=0;i<3;i++){
    if(i){G.party.forEach(m=>{m.hp=Math.min(maxhp(m),m.hp+Math.ceil(maxhp(m)*JEE.rest))});await say('You sip some water, roll your shoulders and turn to the next section.')}
    const r=await paper(exam,CORE[i],cfg,hard);sum+=r.marks;
    await say(`${CORE[i]}: ${r.solved} of 3 questions solved.`);
  }
  return clamp(Math.round(sum/(cfg.per*9)*outOf*(.92+G.mood/600)),0,outOf);
}

function seatsFor(kind){
  const out=[];
  for(const c of COLLEGES){
    const iit=c.kind==='IIT';if((kind==='IIT')!==iit)continue;if(kind==='NIT'&&c.tier>4)continue;if(kind==='Other'&&c.tier<5)continue;
    const r=iit?(G.jee.adv&&G.jee.adv.rank)||0:G.jee.main.rank;if(!r)continue;
    const brs=Object.keys(c.br).filter(b=>c.br[b]>=r);if(brs.length)out.push({c,brs});
  }
  return out;
}
async function counselling(){
  setScene('result','Seat counselling');
  await say('JoSAA counselling. One form, hundreds of choices. Better college or better branch? Everyone has an opinion. The choice is yours.');
  for(;;){
    const iit=seatsFor('IIT'),nit=seatsFor('NIT'),oth=seatsFor('Other');
    const opts=[],act=[];
    if(iit.length){opts.push(`IIT seats ${tag(iit.length+' colleges','#d8574a')}`);act.push(iit)}
    if(nit.length){opts.push(`NIT / IIIT seats ${tag(nit.length+' colleges','#4f7fd0')}`);act.push(nit)}
    opts.push('State / private colleges');act.push(oth);
    if(G.drops<2){opts.push('Drop a year and try again');act.push('drop')}
    opts.push('Walk away from engineering');act.push('quit');
    const ar=G.jee.adv&&G.jee.adv.rank;
    const c=await ask(`Main rank ${rk(G.jee.main.rank)}${ar?`  ·  Advanced rank ${rk(ar)}`:''}\nWhat will you do?`,opts);
    const a=act[c];
    if(a==='drop'){
      await sayAll(['A drop year. Twelve more months in Kota while your friends leave for college.','It works for some. It breaks others. Nobody can promise which.']);
      if(await yes('Drop a year and write JEE again?')){await dropYear();return}
      continue;
    }
    if(a==='quit'){
      await say('No engineering seat at all. Relatives will talk. But it is your life, not theirs.');
      if(await yes('Walk away from engineering for good?')){G.college=null;G.branch=null;G.col=null;await lifeAfter('nocollege');return}
      continue;
    }
    if(!a.length){await say('No seats open for your rank here.');continue}
    const ci=await ask('Which college?',a.map(s=>`${s.c.n} ${tag(s.brs.length+(s.brs.length>1?' branches':' branch'))}`).concat(['Back']));
    if(ci>=a.length)continue;const s=a[ci];
    const bi=await ask(`${s.c.n}. Which branch?`,s.brs.map(b=>`${BRANCHES[b].n}${s.c.br[b]<9e8?`<span class="price">closes at ${rk(s.c.br[b])}</span>`:''}`).concat(['Back']));
    if(bi>=s.brs.length)continue;const b=s.brs[bi];
    if(s.c.tier===6)await say('A private college. The fee is heavy. Dad says nothing, and quietly signs an education loan.');
    if(!(await yes(`Lock ${BRANCHES[b].n} at ${s.c.n}?`)))continue;
    G.college={n:s.c.n,kind:s.c.kind,tier:s.c.tier};G.branch=b;
    SND.jingle('item');await say(`Seat allotted: ${BRANCHES[b].n}, ${s.c.n}.`);
    await startCollege();return;
  }
}
async function dropYear(){
  G.drops++;G.age++;G.daysLeft=45;mood(-8);
  for(const k of ['jeeDone','warn15','breakTaken','k1','k2','k3','k4','k5','rival2'])delete G.flags[k];
  healAll();G.heal={map:'kota',x:4,y:19};
  await travel('kota',4,19,'up');
  await sayAll([`Drop year ${G.drops}. The same PG room, a new batch of faces, and you know every wall of this city.`,'JEE is in 45 days. The other aspirants are tougher this year. So are you.']);
  saveGame();
}

    drawMon(X,B.foe.sp,148+shk('foe')+(1-ent)*90,22+dk*56,56,false,B.absorb?.4+.6*Math.abs(Math.sin(t/60)):1);X.restore()}
  if(B.show.me&&!blink('me')){const dk=drop('me');X.save();X.beginPath();X.rect(0,0,SW,124);X.clip();
    drawMon(X,B.me.sp,28+shk('me')-(1-ent)*90,58+dk*70,70,true);X.restore()}
  if(B.orb){const o=B.orb;X.save();X.translate(o.x,o.y);X.rotate(o.rot);
    X.fillStyle=INK;X.fillRect(-6,-5,12,10);X.fillStyle=o.item==='Smart Notes'?'#4f7fd0':'#f08a3c';X.fillRect(-5,-4,10,8);X.fillStyle='#f7f1e1';X.fillRect(-2,-2,6,1);X.fillRect(-2,0,5,1);X.fillStyle=INK;X.fillRect(-5,-4,1,8);
    if(o.caught){X.fillStyle='#f2c14b';for(let i=0;i<3;i++)X.fillRect(-8+i*7,-11-Math.sin(t/120+i)*2,2,2)}X.restore()}
  for(const s of ['me','foe']){const m=monOf(s),d=B.dhp[s],step=Math.max(.25,maxhp(m)/60);B.dhp[s]=Math.abs(d-m.hp)<=step?m.hp:d+Math.sign(m.hp-d)*step}
  if(B.show.foe||B.drop){const f=B.foe;rr(8,10,104,26,4,'#f7f1e1','#22202a');T(f.sp,14,21,9,'#22202a');T('Lv'+f.lvl,106,21,8,'#22202a','right');
    T('HP',14,31,6,'#f08a3c');hpBar(26,27,80,f,B.dhp.foe);
    if(!B.wild){for(let i=0;i<B.foes.length;i++){X.fillStyle=B.foes[i].hp>0?'#f08a3c':'#9b9b9b';X.beginPath();X.arc(16+i*7,42,2.4,0,7);X.fill()}}}
  if(B.show.me||B.drop){const m=B.me;rr(128,84,104,36,4,'#f7f1e1','#22202a');T(m.sp,134,95,9,'#22202a');T('Lv'+m.lvl,226,95,8,'#22202a','right');
    T('HP',134,105,6,'#f08a3c');hpBar(146,101,80,m,B.dhp.me);T(`${Math.round(B.dhp.me)}/${maxhp(m)}`,226,114,8,'#22202a','right');
    const lo=m.lvl**3,hi=(m.lvl+1)**3,er=clamp((m.exp-lo)/(hi-lo),0,1);X.fillStyle='#2b2b33';X.fillRect(134,116,52,2);X.fillStyle='#4f86e0';X.fillRect(134,116,52*er,2)}
  if(B.exam)pill(`Q${B.fi+1}/${B.foes.length}  ·  ${B.left} turns left  ·  ${Math.max(0,B.marks)} marks`,SW-4,3,true);
}
function scenery(){
  const g=X.createLinearGradient(0,0,0,SH);g.addColorStop(0,'#f6b26b');g.addColorStop(.45,'#f9dca0');g.addColorStop(1,'#f2c88a');X.fillStyle=g;X.fillRect(0,0,SW,SH);
  X.fillStyle='#fff3c4';X.beginPath();X.arc(190,58,16,0,7);X.fill();
  X.fillStyle='#8a6fb8';X.beginPath();X.moveTo(0,112);X.quadraticCurveTo(60,84,130,108);X.quadraticCurveTo(190,90,240,104);X.lineTo(240,176);X.lineTo(0,176);X.fill();
  X.fillStyle='#5b4a8a';X.fillRect(96,70,48,40);X.beginPath();X.moveTo(92,70);X.lineTo(120,52);X.lineTo(148,70);X.fill();X.fillRect(116,40,8,14);
  X.fillStyle='#f9dca0';for(let i=0;i<4;i++){X.fillRect(102+i*11,78,5,7);X.fillRect(102+i*11,92,5,7)}
  X.fillStyle='#4a8a56';X.beginPath();X.moveTo(0,134);X.quadraticCurveTo(90,110,170,132);X.quadraticCurveTo(210,124,240,130);X.lineTo(240,176);X.lineTo(0,176);X.fill();
}
function renderTitle(){
  scenery();const t=now()/500;
  X.font='18px "Press Start 2P", monospace';X.textAlign='center';X.fillStyle='#22202a';X.fillText('ASPIRANT',121,27);X.fillStyle='#f7f1e1';X.fillText('ASPIRANT',120,26);
  T('one exam. a thousand lives.',120,39,8,'#22202a','center');
  STARTERS.forEach((s,i)=>drawMon(X,s,36+i*62,86+Math.sin(t+i*1.3)*2,40,i===0));
}
function renderPick(){
  scenery();X.fillStyle='rgba(34,32,46,.35)';X.fillRect(0,0,SW,SH);T('Pick your starter concept',120,22,10,'#f7f1e1','center');
  STARTERS.forEach((s,i)=>{const on=i===PICK.hi,x=14+i*74;
    rr(x,32,64,76,6,on?'#f7f1e1':'rgba(247,241,225,.6)',on?'#f08a3c':'#22202a');
    drawMon(X,s,x+8,38+(on?Math.sin(now()/180)*2:0),48,false);T(s,x+32,96,9,'#22202a','center');
    rr(x+12,99,40,8,2,TYPES[SP[s].t[0]]);T(SP[s].t[0],x+32,105.5,6,'#fff','center')});
}
function renderEvolve(){
  X.fillStyle='#1d1a2e';X.fillRect(0,0,SW,SH);const t=now()-EVO.t0;
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2+t/900;X.fillStyle=i%2?'#f2c14b':'#a884ea';X.fillRect(120+Math.cos(a)*(50+Math.sin(t/300+i)*8),62+Math.sin(a)*40,2,2)}
  const show=EVO.done?EVO.to:(t<2600&&Math.floor(t/Math.max(60,260-t/12))%2?EVO.to:EVO.from);
  drawMon(X,show,84,24,72,false,EVO.done?1:.92);
}
function renderScene(){
  const f=(typeof SCENES!=='undefined'&&SCENES[SCENE.kind]);
  if(f){X.save();try{f(X,now()-SCENE.t0,SCENE)}catch(e){if(!SCENE.err){SCENE.err=1;console.error(e)}}X.restore();X.globalAlpha=1}else scenery();
  if(SCENE.cap)pill(SCENE.cap,6,6);
}
let last=now();
function frame(){
  const t=now(),dt=Math.min(.05,(t-last)/1000);last=t;
  X.setTransform(2,0,0,2,0,0);X.imageSmoothingEnabled=false;X.globalAlpha=1;
  SND.music(mode==='title'||mode==='pick'?'home':mode==='evolve'?(EVO&&EVO.done?null:'evolve'):mode==='battle'&&B?B.music:mode==='scene'?(SCENE&&SCENE.kind==='exam'?'kota':'life'):CUR.song);
  if(mode==='world'&&G){updateWorld(dt);renderWorld()}
  else if(mode==='battle'&&B)renderBattle();
  else if(mode==='evolve'&&EVO)renderEvolve();
  else if(mode==='pick')renderPick();
  else if(mode==='scene'&&SCENE)renderScene();
  else renderTitle();
  drawConfetti();
  if(FADE){const k=Math.min(1,(t-FADE.t0)/250);X.fillStyle=`rgba(18,16,28,${FADE.out?k:1-k})`;X.fillRect(0,0,SW,SH)}
  if(TRANS){const k=Math.min(1,(t-TRANS)/650);X.fillStyle='#12101c';for(let i=0;i<11;i++){const w=SW*Math.min(1,k*1.4-(i%3)*.12);i%2?X.fillRect(SW-w,i*16,w,16):X.fillRect(0,i*16,w,16)}}
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
const HEROES=[['Arjun',false],['Kabir',false],['Ananya',true],['Meera',true]];
async function titleFlow(){
  mode='title';busy=true;SCENE=null;B=null;hideUI();
  for(;;){
    const sv=readSave(),ends=Object.keys(readEnds()).length;
    const opts=[];if(sv)opts.push('Continue');opts.push('New Game');if(ends)opts.push(`Endings <span class="price">${ends} found</span>`);
    const c=await choose(opts,{prompt:sv?`Saved: ${sv.name}, age ${sv.age}, ${sv.ch===1?'Chhota Nagar':sv.ch===2?'Kota':(sv.college&&sv.college.n)||'college'}.`:'Press A to begin your story.'});
    if(sv&&c===0){load(sv);mode='world';hideUI();busy=false;AREA={name:CUR.name,t0:now()};await run(()=>say(`Welcome back, ${G.name}. You are in ${CUR.name}.`));return}
    if(opts[c].startsWith('Endings')){await endingsGallery();continue}
    if(sv&&!(await yes('Start a new life? Your saved game will be replaced.')))continue;
    break;
  }
  newGame();
  await say('Chhota Nagar. One school, one park, one bus stand, and more dreams than people.');
  const h=await ask('Who are you?',HEROES.map(x=>x[0]));G.name=HEROES[h][0];G.girl=HEROES[h][1];
  await sayAll([`You are ${G.name}, 11 years old. You take radios apart to see where the voices live.`,
    'Papa says engineers build the world. Mummy says finish your milk first.','This is the story of one exam, and of everything that comes after it.']);
  mode='world';P.dir='up';AREA={name:CUR.name,t0:now()};
  await say('Talk to Mom with A. Then head to the school with the blue roof, north of home.');
  hideUI();busy=false;
}
function boot(data){
  if(data&&data.save){try{load(JSON.parse(data.save));mode='world';busy=false;hideUI();return}catch(e){}}
  titleFlow();
}
if(DBG)window.ASP={dbg:DBG,get G(){return G},say,ask,battle,run,jeeFlow,counselling,travel,setScene,ev:s=>eval(s),
  team(l,sps=['Newtonaut','Voltick','Molemage','Benzring','Calculord','Matrixel']){G.party=sps.map(s=>makeMon(s,l));G.starter=G.starter||'Newtlet';sps.forEach(markCaught)},
  kota(){G.flags.boards=true;G.ch=2;G.age=16;enterMap('kota',16,11,'up');mode='world'},
  college(n='IIT Bombay',b='CSE'){const c=COLLEGES.find(x=>x.n===n);G.jee=G.jee||{main:{marks:250,rank:120},adv:{marks:250,rank:60}};G.college={n:c.n,kind:c.kind,tier:c.tier};G.branch=b;return run(startCollege)},
  life(start='grad'){return run(()=>lifeAfter(start))}};
window.claude?.hot?.snapshot?.(()=>({save:G&&mode==='world'&&!busy?JSON.stringify(serialize()):null}));
requestAnimationFrame(frame);
const start=d=>boot(d||{});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{})});
})();
</script>
