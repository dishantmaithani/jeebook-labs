<title>Wildbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: one handheld console shell, screen on top, controls below. Single dark look by choice. */
:root{
  --bg:#18202c; --shell:#3b5570; --shell-2:#2c4258; --bezel:#121822;
  --paper:#f6f2e4; --paper-2:#e6dec6; --ink:#1f2430; --accent:#e8664f; --gold:#f2b84b; --muted:#9fb2c6;
  --f-display:"Press Start 2P", ui-monospace, monospace;
  --f-body:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--paper)}
body{font-family:var(--f-body);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 28px;-webkit-tap-highlight-color:transparent}
.shell{max-width:760px;margin:0 auto;background:linear-gradient(170deg,var(--shell),var(--shell-2));border-radius:22px 22px 56px 22px;padding:16px 16px 22px;box-shadow:0 10px 0 #1d2b3a, 0 18px 40px rgba(0,0,0,.45)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 12px;flex-wrap:wrap}
.brand h1{font:400 clamp(13px,2.6vw,18px)/1 var(--f-display);margin:0;color:var(--paper);letter-spacing:.06em;text-shadow:2px 2px 0 #1d2b3a}
.brand span{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.screen{position:relative;width:100%;aspect-ratio:240/176;max-width:100%;background:#000;border:6px solid var(--bezel);border-radius:10px;overflow:hidden;outline:none}
.screen:focus-visible{box-shadow:0 0 0 3px var(--gold)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#box{position:absolute;left:2%;right:2%;bottom:2.5%;height:27%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px var(--paper-2);padding:.45em .8em;font:500 clamp(12px,2.75vw,21px)/1.32 var(--f-body);white-space:pre-line;overflow:hidden;cursor:pointer;user-select:none}
#box.withmenu #txt{display:block;padding-right:48%}
#arrow{position:absolute;right:.7em;bottom:.3em;color:var(--accent);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#menu{position:absolute;right:2%;bottom:2.5%;min-width:44%;max-width:96%;max-height:95%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:.3em;font:500 clamp(12px,2.6vw,20px)/1.25 var(--f-body);display:flex;flex-direction:column;gap:2px;z-index:2}
#menu.grid{display:grid;grid-template-columns:1fr 1fr}
#menu.wide{left:2%;right:2%}
#menu button{all:unset;box-sizing:border-box;position:relative;padding:.22em .5em .22em 1.3em;border-radius:4px;cursor:pointer;min-width:0}
#menu button.on{background:var(--paper-2)}
#menu button.on::before{content:"\25B6";position:absolute;left:.3em;top:50%;transform:translateY(-50%);color:var(--accent);font-size:.75em}
#menu button:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-block;font-size:.68em;padding:0 .45em;border-radius:3px;background:var(--c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);vertical-align:.12em;margin-left:.35em}
.row{display:flex;align-items:center;gap:.55em;flex-wrap:wrap}
.row b{font-weight:600}
.row i{font-style:normal;opacity:.7}
.bar{display:inline-block;width:5.5em;height:.45em;background:#3a3a3a;border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%}
.dim{opacity:.5}
.price{float:right;margin-left:1em;opacity:.75;font-variant-numeric:tabular-nums}

.pad{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:22px 6px 0;user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.dpad button,.ab button,.mid button{all:unset;cursor:pointer;touch-action:none}
.dpad button{background:#1f2a36;box-shadow:inset 0 -3px 0 #121922;color:var(--muted);display:grid;place-items:center;font-size:14px}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}
.dpad .c{grid-area:2/2;background:#1f2a36;box-shadow:none}.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}
.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.dpad button:active,.dpad button.held{background:#2b3a4b}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.mid button{background:#24323f;color:var(--muted);font:400 9px var(--f-display);padding:8px 14px;border-radius:999px;letter-spacing:.08em;box-shadow:inset 0 -2px 0 #141c25}
.ab{display:flex;gap:14px;transform:rotate(-18deg)}
.ab button{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font:400 14px var(--f-display);display:grid;place-items:center;box-shadow:inset 0 -4px 0 #a9402f, 0 3px 0 #1d2b3a}
.ab button.b{background:#c9584a;margin-top:26px}
.ab button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #a9402f}
.dpad button:focus-visible,.ab button:focus-visible,.mid button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{max-width:760px;margin:16px auto 0;color:var(--muted);font-size:14px;line-height:1.5;text-align:center;text-wrap:balance}
kbd{font-family:var(--f-body);background:#243140;border-radius:4px;padding:0 .35em;color:var(--paper)}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}.ab button{width:50px;height:50px}.ab{gap:10px}}
@media (prefers-reduced-motion:reduce){#arrow{animation:none}}
</style>

<div class="shell">
  <div class="brand"><h1>WILDBOUND</h1><span>Fernvale Valley</span></div>
  <div class="screen" id="screen" tabindex="0" aria-label="Game screen">
    <canvas id="cv" width="480" height="352"></canvas>
    <div id="box" hidden><span id="txt"></span><span id="arrow" hidden>&#9660;</span></div>
    <div id="menu" hidden></div>
  </div>
  <div class="pad">
    <div class="dpad" aria-label="Direction pad">
      <button class="u" data-b="up" aria-label="Up">&#9650;</button>
      <button class="l" data-b="left" aria-label="Left">&#9664;</button>
      <span class="c"></span>
      <button class="r" data-b="right" aria-label="Right">&#9654;</button>
      <button class="d" data-b="down" aria-label="Down">&#9660;</button>
    </div>
    <div class="mid"><button data-b="S">MENU</button><button id="snd" type="button" aria-pressed="true">SOUND ON</button></div>
    <div class="ab"><button class="b" data-b="B" aria-label="B button">B</button><button data-b="A" aria-label="A button">A</button></div>
  </div>
</div>
<p class="hint">Move with <kbd>Arrows</kbd> or <kbd>WASD</kbd> · <kbd>Z</kbd>/<kbd>Space</kbd> is A (talk, confirm) · <kbd>X</kbd> is B (back) · <kbd>M</kbd> opens the menu · <kbd>N</kbd> turns sound on or off. Walk through tall grass to meet wild monsters.</p>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), X=cv.getContext('2d');
const SW=240, SH=176, TS=16;
const rnd=Math.random, rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const now=()=>performance.now();

/* ---------------- sound: tiny chiptune synth ---------------- */
const rep=(s,n)=>Array(n).fill(s).join(' ');
const octs=(notes,n=8)=>notes.map(x=>rep(`${x}2/1 ${x}3/1`,n/2)).join(' ');
const SONGS={
 valley:{bpm:132,loop:true,tracks:[
  {w:'square',v:.055,hold:1,n:'E5/2 G5/2 C6/3 B5/1 A5/2 G5/2 E5/4 F5/2 A5/2 G5/2 E5/2 D5/6 -/2 E5/2 G5/2 C6/3 D6/1 E6/2 D6/2 C6/4 A5/2 B5/2 C6/2 G5/2 C6/6 -/2'},
  {w:'triangle',v:.16,hold:1,n:'C3/4 G3/4 C3/4 G3/4 F3/4 C4/4 G3/4 D3/4 C3/4 G3/4 A3/4 E3/4 F3/4 G3/4 C3/8'},
  {w:'drums',n:rep('k/2 h/2 s/2 h/2',8)}]},
 coast:{bpm:104,loop:true,tracks:[
  {w:'sine',v:.11,n:'C5/3 F5/1 A5/2 G5/2 F5/4 C5/4 D5/3 F5/1 A5/2 C6/2 A5/4 G5/4 Bb4/3 D5/1 F5/2 E5/2 D5/4 C5/4 E5/2 G5/2 Bb5/2 A5/2 F5/8'},
  {w:'square',v:.02,n:rep('F4/1 A4/1 C5/1 A4/1',4)+' '+rep('D4/1 F4/1 A4/1 F4/1',4)+' '+rep('Bb3/1 D4/1 F4/1 D4/1',4)+' '+rep('C4/1 E4/1 G4/1 E4/1',4)},
  {w:'triangle',v:.15,hold:1,n:'F2/6 C3/2 F3/4 C3/4 D3/6 A2/2 D3/4 A2/4 Bb2/6 F3/2 Bb2/4 F3/4 C3/6 G3/2 F2/8'},
  {w:'drums',n:rep('k/4 h/2 h/2 s/4 h/4',4)}]},
 cave:{bpm:76,loop:true,tracks:[
  {w:'triangle',v:.13,hold:1,n:'A4/4 -/2 C5/2 B4/4 -/4 E4/4 -/2 G4/2 F4/6 -/2 A4/4 -/2 E5/2 D5/4 C5/4 B4/6 G#4/2 A4/8'},
  {w:'sine',v:.13,hold:1,n:'A2/16 F2/16 D2/16 E2/16'},
  {w:'drums',n:rep('-/6 h/2 -/8',4)}]},
 peak:{bpm:92,loop:true,tracks:[
  {w:'sine',v:.12,n:'D5/2 F5/2 A5/2 C6/2 B5/4 A5/4 G5/2 B5/2 D6/2 B5/2 A5/8 D5/2 F5/2 A5/2 D6/2 C6/4 A5/4 G5/2 E5/2 F5/2 E5/2 D5/8'},
  {w:'square',v:.018,n:rep('D4/1 A4/1 F5/1 A4/1',16)},
  {w:'triangle',v:.14,hold:1,n:'D3/8 A2/8 G2/8 D3/8 D3/8 F3/8 C3/8 D3/8'}]},
 battle:{bpm:168,loop:true,tracks:[
  {w:'square',v:.05,hold:1,n:'E5/1 E5/1 G5/1 E5/1 B5/2 A5/2 G5/2 F#5/2 E5/2 D5/2 E5/1 E5/1 G5/1 E5/1 C6/2 B5/2 A5/4 B5/4 G5/2 A5/2 B5/2 D6/2 C6/2 B5/2 A5/2 G5/2 F#5/2 G5/2 A5/2 F#5/2 E5/8'},
  {w:'triangle',v:.16,n:octs(['E','C','G','B'],16)},
  {w:'drums',n:rep('k/2 h/1 h/1 s/2 h/1 k/1',8)}]},
 boss:{bpm:176,loop:true,tracks:[
  {w:'square',v:.05,hold:1,n:'D5/2 F5/2 A5/2 D6/2 C#6/4 A5/4 Bb5/2 A5/2 G5/2 F5/2 E5/4 A4/4 D5/2 F5/2 A5/2 D6/2 F6/4 E6/4 D6/2 C#6/2 A5/2 E5/2 D5/8'},
  {w:'square',v:.022,n:rep('D4/1 F4/1 A4/1 F4/1',4)+' '+rep('Bb3/1 D4/1 F4/1 D4/1',4)+' '+rep('D4/1 F4/1 A4/1 F4/1',4)+' '+rep('A3/1 C#4/1 E4/1 C#4/1',4)},
  {w:'triangle',v:.16,n:octs(['D','Bb','F','A'],16).replace(/Bb3/g,'Bb2').replace(/Bb2\/1 Bb2/g,'Bb1/1 Bb2')},
  {w:'drums',n:rep('k/1 k/1 s/2 k/1 h/1 s/2',8)}]},
 victory:{bpm:140,loop:false,tracks:[
  {w:'square',v:.06,hold:1,n:'C5/1 E5/1 G5/1 C6/3 G5/1 C6/1 E6/6 D6/1 E6/1 F6/2 E6/2 D6/2 C6/6'},
  {w:'triangle',v:.16,hold:1,n:'C3/6 G3/2 C3/6 G2/2 F3/6 G3/6 C3/2'}]},
 evolve:{bpm:120,loop:true,tracks:[
  {w:'sine',v:.1,n:rep('C5/1 E5/1 G5/1 C6/1',2)+' '+rep('D5/1 F5/1 A5/1 D6/1',2)+' '+rep('E5/1 G5/1 B5/1 E6/1',2)+' '+rep('F5/1 A5/1 C6/1 F6/1',2)},
  {w:'triangle',v:.14,hold:1,n:'C3/8 D3/8 E3/8 F3/8'}]},
};
SONGS.title=SONGS.valley;
const JINGLES={
 heal:{bpm:200,w:'square',n:'C5/1 E5/1 G5/1 C6/1 G5/1 C6/3'},
 levelup:{bpm:220,w:'square',n:'G5/1 A5/1 B5/1 D6/1 G6/4'},
 catch:{bpm:180,w:'square',n:'G4/1 C5/1 E5/1 G5/2 E5/1 G5/1 C6/5'},
 item:{bpm:200,w:'square',n:'E5/1 G5/1 E6/1 C6/1 D6/1 G6/3'},
 evolved:{bpm:160,w:'square',n:'C5/1 G5/1 C6/1 E6/1 G6/2 E6/1 G6/5'},
};
const SND=(()=>{
  let ctx=null,master,mus,sfxG,noiseBuf,muted=false,want=null,cur=null,timer=null;
  try{muted=localStorage.getItem('wildbound-mute')==='1'}catch(e){}
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const midi=s=>{const m=/^([A-G])(#|b)?(\d)$/.exec(s);return 12*(+m[3]+1)+NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)};
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const parse=s=>s.trim().split(/\s+/).map(t=>{const [n,d]=t.split('/');return [n,+d]});
  for(const s of Object.values(SONGS))for(const tr of s.tracks)tr.ev=tr.ev||parse(tr.n);
  for(const j of Object.values(JINGLES))j.ev=parse(j.n);
  function init(){
    if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC()}catch(e){return false}
    master=ctx.createGain();master.gain.value=muted?0:.8;master.connect(ctx.destination);
    mus=ctx.createGain();mus.gain.value=.5;mus.connect(master);sfxG=ctx.createGain();sfxG.gain.value=.75;sfxG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    timer=setInterval(tick,40);return true;
  }
  function tone(w,f,t,dur,v,dest,{slide=0,hold=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=w;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);
    if(hold){g.gain.setValueAtTime(v*.8,t+dur*.75);g.gain.linearRampToValueAtTime(0,t+dur*.98)}else g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);
  }
  function noise(t,dur,v,hp,dest){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+.02);
  }
  function drum(k,t,dest){if(k==='k')tone('sine',150,t,.14,.5,dest,{slide:.3});else if(k==='s')noise(t,.13,.22,1500,dest);else if(k==='h')noise(t,.035,.07,7000,dest)}
  function startSong(name){
    const s=SONGS[name];
    if(cur){const old=cur.gain;old.gain.setTargetAtTime(0,ctx.currentTime,.08);setTimeout(()=>old.disconnect(),600);cur=null}
    if(!s)return;
    const g=ctx.createGain();g.gain.value=1;g.connect(mus);const t0=ctx.currentTime+.08;
    cur={name,s,gain:g,step:60/s.bpm/2,tr:s.tracks.map(tr=>({tr,i:0,t:t0,done:false}))};
  }
  function tick(){
    if(!ctx)return;
    if(want!==(cur?cur.name:null)&&ctx.state==='running')startSong(want);
    if(!cur)return;const ahead=ctx.currentTime+.25;
    for(const st of cur.tr){
      while(!st.done&&st.t<ahead){
        const [n,d]=st.tr.ev[st.i],dur=d*cur.step;
        if(n!=='-'){if(st.tr.w==='drums')drum(n,st.t,cur.gain);else tone(st.tr.w,hz(midi(n)),st.t,dur,st.tr.v,cur.gain,{hold:st.tr.hold})}
        st.t+=dur;st.i++;
        if(st.i>=st.tr.ev.length){if(cur.s.loop)st.i=0;else st.done=true}
      }
    }
  }
  function sfx(name){
    if(!ctx||muted)return;const t=ctx.currentTime+.01,o=sfxG;
    switch(name){
      case 'blip':tone('square',1320,t,.04,.05,o);break;
      case 'move':tone('square',880,t,.03,.04,o);break;
      case 'select':tone('square',988,t,.05,.06,o);tone('square',1319,t+.05,.07,.06,o);break;
      case 'back':tone('square',660,t,.05,.05,o);tone('square',440,t+.05,.07,.05,o);break;
      case 'bump':tone('triangle',110,t,.08,.25,o,{slide:.7});break;
      case 'door':noise(t,.25,.12,400,o);tone('triangle',330,t,.2,.12,o,{slide:.5});break;
      case 'encounter':for(let i=0;i<6;i++)tone('square',660+i*110,t+i*.06,.06,.05,o);break;
      case 'hit':noise(t,.12,.3,800,o);tone('square',220,t,.1,.08,o,{slide:.5});break;
      case 'super':noise(t,.18,.35,500,o);tone('square',440,t,.16,.09,o,{slide:.3});tone('square',660,t+.05,.12,.06,o,{slide:.4});break;
      case 'weak':noise(t,.08,.15,2000,o);tone('triangle',180,t,.08,.15,o);break;
      case 'miss':tone('sine',600,t,.15,.08,o,{slide:.5});break;
      case 'statup':for(let i=0;i<4;i++)tone('square',523*Math.pow(1.19,i),t+i*.05,.06,.05,o);break;
      case 'statdown':for(let i=0;i<4;i++)tone('square',784/Math.pow(1.19,i),t+i*.05,.06,.05,o);break;
      case 'faint':tone('square',600,t,.5,.08,o,{slide:.15});break;
      case 'throw':tone('sine',300,t,.35,.12,o,{slide:3});break;
      case 'shake':tone('triangle',200,t,.06,.2,o);tone('triangle',170,t+.12,.06,.2,o);break;
      case 'break':noise(t,.15,.2,1500,o);tone('square',500,t,.15,.07,o,{slide:.5});break;
      case 'run':for(let i=0;i<3;i++)tone('triangle',300+i*80,t+i*.07,.06,.15,o);break;
      case 'heal':for(let i=0;i<5;i++)tone('sine',660+i*120,t+i*.05,.08,.08,o);break;
      case 'coin':tone('square',988,t,.06,.05,o);tone('square',1319,t+.06,.18,.05,o);break;
      case 'bite':tone('square',1200,t,.05,.06,o);tone('square',1200,t+.09,.05,.06,o);break;
    }
  }
  function jingle(name){
    const j=JINGLES[name];if(!ctx||muted||!j)return 0;const step=60/j.bpm/2;let t=ctx.currentTime+.02,len=0;
    for(const [n,d] of j.ev){const dur=d*step;if(n!=='-')tone(j.w,hz(midi(n)),t,dur,.07,sfxG,{hold:1});t+=dur;len+=dur}
    mus.gain.setTargetAtTime(.08,ctx.currentTime,.03);mus.gain.setTargetAtTime(.5,ctx.currentTime+len+.1,.15);
    return len*1000;
  }
  return{
    unlock(){if(init()&&ctx.state==='suspended')ctx.resume()},
    music(name){want=name},
    sfx,jingle,
    get muted(){return muted},
    toggle(){muted=!muted;try{localStorage.setItem('wildbound-mute',muted?'1':'0')}catch(e){}
      if(init()){master.gain.setTargetAtTime(muted?0:.8,ctx.currentTime,.05);if(ctx.state==='suspended')ctx.resume()}return muted},
  };
})();

/* ---------------- data ---------------- */
const TYPES={Normal:'#a8a07a',Flame:'#e9742f',Tide:'#4f86e0',Leaf:'#4fae3c',Volt:'#d9a800',Stone:'#9a7e4c',Wind:'#6f9fd8',Frost:'#3fb0c4',Shade:'#6a4f8a'};
const SE={Flame:['Leaf','Frost','Shade'],Tide:['Flame','Stone'],Leaf:['Tide','Stone'],Volt:['Tide','Wind'],Stone:['Flame','Volt','Wind','Frost'],Wind:['Leaf'],Frost:['Leaf','Wind'],Shade:['Shade','Volt'],Normal:[]};
const NVE={Flame:['Tide','Stone','Flame'],Tide:['Leaf','Tide'],Leaf:['Flame','Wind','Leaf'],Volt:['Stone','Leaf','Volt'],Stone:['Leaf','Tide'],Wind:['Stone','Volt','Frost'],Frost:['Flame','Tide','Frost'],Shade:['Flame','Stone'],Normal:['Stone','Shade']};
const eff=(mt,dts)=>dts.reduce((m,t)=>m*(SE[mt].includes(t)?2:NVE[mt].includes(t)?.5:1),1);

const MV={

/* ---------------- UI: dialog + menus ---------------- */
const box=$('box'),txt=$('txt'),arrow=$('arrow'),menu=$('menu');
let handler=null;
function hideUI(){box.hidden=true;menu.hidden=true;box.classList.remove('withmenu');handler=null}
function say(text){
  return new Promise(res=>{
    menu.hidden=true;box.classList.remove('withmenu');box.hidden=false;arrow.hidden=true;
    let i=0,done=false;txt.textContent='';
    const tm=setInterval(()=>{i+=2;txt.textContent=text.slice(0,i);if(i>=text.length){clearInterval(tm);done=true;arrow.hidden=false}},18);
    const go=()=>{if(!done){clearInterval(tm);txt.textContent=text;done=true;arrow.hidden=false;return}handler=null;box.onclick=null;arrow.hidden=true;SND.sfx('blip');res()};
    handler=b=>{if(b==='A'||b==='B')go()};box.onclick=go;
  });
}
function sayNow(text){menu.hidden=true;box.classList.remove('withmenu');box.hidden=false;arrow.hidden=true;txt.textContent=text;box.onclick=null;handler=()=>{}}
function choose(opts,{prompt=null,cancel=false,grid=false,wide=false,start=0,onMove=null}={}){
  return new Promise(res=>{
    if(prompt!==null){box.hidden=false;arrow.hidden=true;txt.textContent=prompt;box.onclick=null;box.classList.toggle('withmenu',!wide)}else box.hidden=true;
    menu.className=(grid?'grid ':'')+(wide?'wide':'');menu.innerHTML='';
    let idx=Math.min(start,opts.length-1);
    const btns=opts.map((o,i)=>{const b=document.createElement('button');b.innerHTML=o;b.type='button';
      b.addEventListener('pointerenter',()=>{idx=i;paint()});b.addEventListener('click',e=>{e.stopPropagation();finish(i)});menu.appendChild(b);return b});
    function paint(){btns.forEach((b,i)=>b.classList.toggle('on',i===idx));btns[idx]&&btns[idx].scrollIntoView({block:'nearest'});onMove&&onMove(idx)}
    function finish(i){SND.sfx(i<0?'back':'select');handler=null;menu.hidden=true;box.classList.remove('withmenu');res(i)}
    menu.hidden=false;paint();
    handler=b=>{const n=opts.length;
      if(b==='up')idx=grid?(idx-2+n)%n:(idx-1+n)%n;else if(b==='down')idx=grid?(idx+2)%n:(idx+1)%n;
      else if(b==='left'&&grid)idx=(idx-1+n)%n;else if(b==='right'&&grid)idx=(idx+1)%n;
      else if(b==='A')return finish(idx);else if(b==='B'&&cancel)return finish(-1);else return;SND.sfx('move');paint()};
  });
}

const hpCol=r=>r>.5?'#4fbf5a':r>.2?'#e8b33c':'#e0503c';
function monRow(m,active){const mx=maxhp(m),r=m.hp/mx;return `<span class="row ${m.hp<=0?'dim':''}"><b>${m.sp}</b><i>Lv${m.lvl}</i><span class="bar"><span style="width:${r*100}%;background:${hpCol(r)}"></span></span><span>${m.hp}/${mx}</span>${active?'<i>(out)</i>':''}</span>`}
function info(m){const s=stats(m);return `${m.sp}  Lv${m.lvl}  ${SP[m.sp].t.join('/')} type\nHP ${m.hp}/${s.hp}  ATK ${s.atk}  DEF ${s.def}  SPD ${s.spd}\nMoves: ${m.moves.join(', ')}`}

/* ---------------- input ---------------- */
const KEYS={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',z:'A',' ':'A',Enter:'A',x:'B',Escape:'B',Backspace:'B',m:'S'};
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let held=[];
function press(b,repeat){
  if(handler){if(repeat&&!DIRS[b])return;handler(b);return}
  if(repeat)return;
  if(mode==='world'&&!busy&&!P.moving){if(b==='A')interact();else if(b==='S')run(pauseMenu);else if(DIRS[b])tryMove(b)}
}
function tryMove(d){
  P.dir=d;const [dx,dy]=DIRS[d];
  if(!blocked(P.x+dx,P.y+dy)){P.moving=true;P.tx=P.x+dx;P.ty=P.y+dy;P.step^=1}
  else if(now()-lastBump>280){lastBump=now();SND.sfx('bump')}
}
let lastBump=0;
function hold(b,on){held=held.filter(x=>x!==b);if(on)held.push(b)}
addEventListener('keydown',e=>{SND.unlock();if(e.key==='n'||e.key==='N'){if(!e.repeat)toggleSound();return}const b=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(!b)return;e.preventDefault();if(DIRS[b])hold(b,true);press(b,e.repeat)});
addEventListener('keyup',e=>{const b=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(b&&DIRS[b])hold(b,false)});
addEventListener('blur',()=>held=[]);
document.querySelectorAll('[data-b]').forEach(el=>{const b=el.dataset.b;
  el.addEventListener('pointerdown',e=>{e.preventDefault();$('screen').focus({preventScroll:true});if(DIRS[b]){hold(b,true);el.classList.add('held')}press(b,false)});
  const up=()=>{if(DIRS[b]){hold(b,false);el.classList.remove('held')}};
  el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up);
});
$('screen').addEventListener('pointerdown',()=>$('screen').focus({preventScroll:true}));
addEventListener('pointerdown',()=>SND.unlock(),true);
function toggleSound(){const m=SND.toggle();$('snd').textContent=m?'SOUND OFF':'SOUND ON';$('snd').setAttribute('aria-pressed',String(!m))}
$('snd').addEventListener('click',e=>{e.preventDefault();toggleSound()});
$('snd').textContent=SND.muted?'SOUND OFF':'SOUND ON';$('snd').setAttribute('aria-pressed',String(!SND.muted));

/* ---------------- world logic ---------------- */
async function run(fn){if(busy)return;busy=true;try{await fn()}finally{hideUI();busy=false}}
function updateWorld(dt){
  if(P.moving){P.t+=dt*7.5;if(P.t>=1){P.moving=false;P.x=P.tx;P.y=P.ty;P.t=0;onStep()}return}
  if(busy||handler)return;
  const d=held[held.length-1];if(d)tryMove(d);
}
function onStep(){
  const w=CUR.warps.find(v=>v.x===P.x&&v.y===P.y);
  if(w){run(()=>warpTo(w));return}
  const z=CUR.enc(tile(P.x,P.y),P.x,P.y);
  if(z&&rnd()<.11)run(()=>wildEncounter(z));
}
async function fade(fn){
  FADE={t0:now(),out:true};await wait(260);fn();FADE={t0:now(),out:false};await wait(260);FADE=null;
}
async function warpTo(w){
  SND.sfx('door');
  await fade(()=>enterMap(w.to,w.tx,w.ty,w.dir));
  AREA={name:CUR.name,t0:now()};
}
function pickWeighted(list){let t=list.reduce((s,x)=>s+x[1],0),r=rnd()*t;for(const [k,w] of list){if((r-=w)<0)return k}return list[0][0]}
async function transition(){SND.sfx('encounter');TRANS=now();await wait(700);TRANS=0}
async function wildEncounter(z){
  const Z=ZONES[z];const m=makeMon(pickWeighted(Z.mons),rint(Z.lv[0],Z.lv[1]));
  await transition();
  const r=await battle({wild:true,foes:[m]});
  if(r==='lose')await blackout();
}
async function blackout(){
  await say('Your whole team is worn out...');
  G.money=Math.floor(G.money/2);healAll();enterMap(G.heal.map,G.heal.x,G.heal.y,'up');
  await say('You hurried back to the Rest House. Your team was healed, but you dropped half your coins.');
}
function interact(){
  const [dx,dy]=DIRS[P.dir];const n=npcAt(P.x+dx,P.y+dy);
  if(n){run(async()=>{if(!n.sign&&!n.item&&!n.wild)n.dir={up:'down',down:'up',left:'right',right:'left'}[P.dir];
    if(n.sign)await say(n.text);else if(n.item)await pickUp(n);else if(n.wild)await staticMon(n);
    else if(n.act)await n.act(n);else if(n.team)await trainer(n);else for(const l of n.lines)await say(l)});return}
  const t=tile(P.x+dx,P.y+dy);
  if(t==='~'&&CUR.fish&&G.flags.rod)run(fish);
  else if(t==='~')run(()=>say(CUR.id==='peak'?'The lake is frozen solid.':'The water is deep and cold. Something swims far below.'));
  else if(t==='H'||t==='M')run(()=>say(t==='H'?'The Rest House. The nurse is waiting outside.':'The Trading Post. The clerk is standing outside.'));
}
async function pickUp(n){
  G.bag[n.item]=(G.bag[n.item]||0)+n.n;G.flags[n.id]=true;
  SND.jingle('item');await say(`You found ${n.n>1?n.n+' ':'a '}${n.item}${n.n>1?'s':''}!`);
}
async function staticMon(n){
  const [sp,l]=n.wild;
  await say('The air glitters with cold light...');
  await say(`A ${sp} is watching you closely!`);
  await transition();
  const r=await battle({wild:true,foes:[makeMon(sp,l)]});
  if(r==='caught'||r==='win'){G.flags[n.id]=true;if(r==='win')await say(`${sp} faded into the falling snow.`)}
  else if(r==='lose')await blackout();
}
async function fisherman(){
  if(G.flags.rod){await say('Old Oto: Any bites? Try both the coast and the valley ponds. Different monsters live in each.');return}
  await say('Old Oto: Forty years I\'ve fished this dock. The sea gives you whatever it pleases.');
  await say('Old Oto: You look patient. Here, take my spare rod.');
  G.flags.rod=true;SND.jingle('item');
  await say('You got a Fishing Rod! Face the water and press A to fish.');
}
async function fish(){
  sayNow('You cast your line...');
  await wait(900+rnd()*900);
  if(rnd()<.35){await say('Not even a nibble.');return}
  SND.sfx('bite');await say('Oh! Something bit!');
  await wildEncounter(CUR.fish);
}
async function nurse(n){
  const c=await choose(['Yes, please','No thanks'],{prompt:'Welcome to the Rest House! Shall I restore your team?'});
  if(c!==0){await say('Come back anytime.');return}
  healAll();G.heal={map:CUR.id,x:n.heal[0],y:n.heal[1]};const ok=saveGame();await wait(SND.jingle('heal'));
  await say('There you go! Your team is back to full strength.'+(ok?'\n(Your progress was saved.)':''));
}
async function shop(){
  await say('Welcome to the Trading Post!');
  const keys=Object.keys(ITEMS);let last=0;
  for(;;){
    const c=await choose(keys.map(k=>`${k}<span class="price">${ITEMS[k].price}c</span>`).concat(['Done']),{prompt:`You have ${G.money} coins.\n`,cancel:true,start:last});
    if(c<0||c===keys.length)break;last=c;const k=keys[c],it=ITEMS[k];
    if(G.money<it.price){await say('You don\'t have enough coins for that.');continue}
    G.money-=it.price;G.bag[k]=(G.bag[k]||0)+1;SND.sfx('coin');await say(`You bought a ${k}. ${it.desc} You now have ${G.bag[k]}.`);
  }
  await say('Come again!');
}
async function trainer(n){
  if(G.flags[n.id]){await say(`${n.name}: ${n.post}`);return}
  for(const l of n.pre)await say(`${n.name}: ${l}`);
  await transition();
  const team=(typeof n.team==='function'?n.team():n.team).map(([s,l])=>makeMon(s,l));
  const r=await battle({wild:false,trainer:n,foes:team});
  if(r==='win'){G.flags[n.id]=true;await say(`${n.name}: ${n.lose}`);G.money+=n.reward;await say(`You got ${n.reward} coins for winning.`);if(n.onWin)await n.onWin()}
  else if(r==='lose')await blackout();
}
async function pauseMenu(){
  let last=0;
  for(;;){
    const c=await choose(['Team','Bag','Dex','Save','Close'],{prompt:`${CUR.name}\nCoins: ${G.money}\nDex: ${G.caught.length} of ${DEX.length} caught`,cancel:true,start:last});
    last=c;
    if(c===0)await teamMenu(false);
    else if(c===1)await bagMenu(false);
    else if(c===2)await dexMenu();
    else if(c===3){await say(saveGame()?'Game saved.':'Saving isn\'t available in this browser.')}
    else return;
  }
}
async function dexMenu(){
  let last=0;
  for(;;){
    const rows=DEX.map((s,i)=>{const n=String(i+1).padStart(2,'0'),c=G.caught.includes(s),sn=G.seen.includes(s);
      return `<span class="row ${c?'':'dim'}"><i>#${n}</i><b>${sn?s:'?????'}</b>${sn?SP[s].t.map(chip).join(''):''}${c?'<i>caught</i>':''}</span>`});
    const c=await choose(rows,{wide:true,cancel:true,start:last});
    if(c<0)return;last=c;const s=DEX[c];
    if(G.caught.includes(s))await say(`${s} (${SP[s].t.join('/')})\n${SP[s].dex}`);
    else if(G.seen.includes(s))await say(`${s}: seen in the wild, but not caught yet.`);
    else await say('You haven\'t met this monster yet.');
  }
}

/* team / bag shared by world + battle */
async function teamMenu(inBattle,forced=false){
  let last=0;
  for(;;){
    const c=await choose(G.party.map(m=>monRow(m,inBattle&&B&&m===B.me)),{wide:true,cancel:!forced,start:last});
    if(c<0)return null;last=c;const m=G.party[c];
    if(inBattle){
      const s=await choose(['Switch in','Info','Back'],{prompt:`${m.sp} - what to do?`,cancel:true});
      if(s===0){if(m.hp<=0){await say(`${m.sp} has no energy left to battle.`);continue}
        if(m===B.me){await say(`${m.sp} is already out!`);continue}
        return {type:'switch',mon:m}}
      if(s===1)await say(info(m));
    }else{
      const s=await choose(['Info','Make lead','Back'],{prompt:`${m.sp} - what to do?`,cancel:true});
      if(s===0){await say(info(m));await say(SP[m.sp].dex)}
      if(s===1){G.party.splice(c,1);G.party.unshift(m);await say(`${m.sp} will go out first now.`);last=0}
    }
  }
}
async function bagMenu(inBattle){
  for(;;){
    const keys=Object.keys(G.bag).filter(k=>G.bag[k]>0);
    if(!keys.length){await say('Your bag is empty.');return null}
    const c=await choose(keys.map(k=>`${k}<span class="price">x${G.bag[k]}</span>`),{prompt:'Use which item?',cancel:true});
    if(c<0)return null;const k=keys[c],it=ITEMS[k];
    if(it.orb){
      if(!inBattle){await say('Orbs are thrown at wild monsters during battle.');continue}
      if(!B.wild){await say('You can\'t catch another trainer\'s monster!');continue}
      return {type:'orb',item:k};
    }
    const t=await choose(G.party.map(m=>monRow(m)),{wide:true,cancel:true});
    if(t<0)continue;const m=G.party[t],mx=maxhp(m);
    if(m.hp<=0||m.hp>=mx){await say('It won\'t have any effect.');continue}
    const h=Math.min(it.heal,mx-m.hp);m.hp+=h;G.bag[k]--;SND.sfx('heal');
    await say(`${m.sp} recovered ${h} HP.`);
    if(inBattle)return {type:'used'};
  }
}

/* ---------------- battle ---------------- */
const stg=()=>({atk:0,def:0,spd:0});
const mul=s=>s>=0?(2+s)/2:2/(2-s);
const other=s=>s==='me'?'foe':'me';
const monOf=s=>s==='me'?B.me:B.foe;
const lbl=s=>s==='me'?B.me.sp:(B.wild?`The wild ${B.foe.sp}`:`Foe ${B.foe.sp}`);
function tween(ms,f){return new Promise(res=>{const t0=now();const step=()=>{const k=Math.min(1,(now()-t0)/ms);f(k);k<1?requestAnimationFrame(step):res()};step()})}
async function waitHp(){while(Math.abs(B.dhp.me-B.me.hp)>.01||Math.abs(B.dhp.foe-B.foe.hp)>.01)await wait(30)}

async function battle(o){
  B={wild:o.wild,trainer:o.trainer,foes:o.foes,fi:0,foe:o.foes[0],me:G.party.find(m=>m.hp>0),
     music:(o.trainer&&o.trainer.reward>=1500)||(o.wild&&o.foes[0].sp==='Aurorax')?'boss':'battle',st:{me:stg(),foe:stg()},dhp:{},show:{me:false,foe:true},flash:{me:0,foe:0},shake:{me:0,foe:0},orb:null,runs:0,part:new Set(),enter:now()};
  B.dhp.foe=B.foe.hp;B.dhp.me=B.me.hp;mode='battle';markSeen(B.foe.sp);
  if(B.wild)await say(`A wild ${B.foe.sp} appeared!`);
  else{await say(`${B.trainer.name} wants to battle!`);await say(`${B.trainer.name} sent out ${B.foe.sp}!`)}
  B.show.me=true;B.part.add(B.me);await say(`Go, ${B.me.sp}!`);
  for(;;){
    const act=await playerAction();let myMove=null;
    if(act.type==='run'){
      if(!B.wild){await say('You can\'t run from a trainer battle!');continue}
      B.runs++;const ms=stats(B.me).spd,fs=stats(B.foe).spd;
      if(ms>=fs||rnd()<.4+B.runs*.2){SND.sfx('run');await say('Got away safely!');return endBattle('run')}
      await say('Couldn\'t get away!');
    }else if(act.type==='orb'){G.bag[act.item]--;if(await throwOrb(act.item))return endBattle('caught')}
    else if(act.type==='switch'){await say(`Come back, ${B.me.sp}!`);B.show.me=false;await wait(200);
      B.me=act.mon;B.st.me=stg();B.dhp.me=B.me.hp;B.part.add(B.me);B.show.me=true;await say(`Go, ${B.me.sp}!`)}
    else if(act.type==='move')myMove=act.m;
    await doTurn(myMove);
    const r=await resolveFaints();if(r)return endBattle(r);
  }
}
async function playerAction(){
  for(;;){
    const c=await choose(['Fight','Bag','Team','Run'],{grid:true,prompt:`What will ${B.me.sp} do?`});
    if(c===0){const mv=await choose(B.me.moves.map(n=>`${n}${chip(MV[n].t)}`),{grid:true,wide:true,cancel:true});if(mv<0)continue;return{type:'move',m:B.me.moves[mv]}}
    if(c===1){const r=await bagMenu(true);if(r)return r;continue}
    if(c===2){const r=await teamMenu(true);if(r)return r;continue}
    if(c===3)return{type:'run'};
  }
}
function foeMove(){
  const f=B.foe,m=B.me;
  const scored=f.moves.map(n=>{const mv=MV[n];let s;
    if(!mv.p){const [who,k,d]=mv.fx;const cur=B.st[who==='self'?'foe':'me'][k];s=(Math.abs(cur+d)>3)?1:18}
    else s=mv.p*eff(mv.t,SP[m.sp].t)*(SP[f.sp].t.includes(mv.t)?1.5:1)*(mv.a||100)/100;
    return [n,s]});
  scored.sort((a,b)=>b[1]-a[1]);
  return rnd()<.7?scored[0][0]:scored[rint(0,scored.length-1)][0];
}
async function doTurn(myMove){
  const fm=foeMove();
  if(!myMove){await useMove('foe',fm);return}
  const pa=MV[myMove].pri||0,pb=MV[fm].pri||0;
  const sa=stats(B.me).spd*mul(B.st.me.spd),sb=stats(B.foe).spd*mul(B.st.foe.spd);
  const meFirst=pa!==pb?pa>pb:(sa!==sb?sa>sb:rnd()<.5);
  const order=meFirst?[['me',myMove],['foe',fm]]:[['foe',fm],['me',myMove]];
  for(const [s,m] of order){if(B.me.hp<=0||B.foe.hp<=0)break;await useMove(s,m)}
}
async function useMove(side,name){
  const a=monOf(side),d=monOf(other(side)),mv=MV[name],ts=other(side);
  await say(`${lbl(side)} used ${name}!`);
  if(mv.a&&rnd()*100>=mv.a*1){SND.sfx('miss');await say('But it missed!');return}
  if(mv.p){
    const sa=stats(a),sd=stats(d);
    const A=sa.atk*mul(B.st[side].atk),D=sd.def*mul(B.st[ts].def);
    const e=eff(mv.t,SP[d.sp].t),stab=SP[a.sp].t.includes(mv.t)?1.5:1,crit=rnd()<1/16?1.5:1;
    const base=Math.floor(Math.floor(Math.floor(2*a.lvl/5+2)*mv.p*A/D)/50)+2;
    const dmg=Math.max(1,Math.floor(base*stab*e*crit*(.85+rnd()*.15)));
    B.flash[ts]=now();B.shake[ts]=now();SND.sfx(e>1?'super':e<1?'weak':'hit');await wait(380);
    d.hp=Math.max(0,d.hp-dmg);await waitHp();
    if(crit>1)await say('A critical hit!');
    if(e>1)await say('It\'s super effective!');else if(e<1)await say('It\'s not very effective...');
    if(mv.drain&&a.hp>0){const h=Math.min(Math.max(1,Math.floor(dmg/2)),maxhp(a)-a.hp);if(h>0){a.hp+=h;await waitHp();await say(`${lbl(ts)} had its energy drained!`)}}
  }
  if(mv.fx&&d.hp>0){
    const [who,k,dl]=mv.fx;const s=who==='self'?side:ts;const tgt=who==='self'?lbl(side):lbl(ts);
    const nm={atk:'Attack',def:'Defense',spd:'Speed'}[k];const cur=B.st[s][k];
    if(Math.abs(cur+dl)>6)await say(`${tgt}'s ${nm} won't go any ${dl>0?'higher':'lower'}!`);
    else{B.st[s][k]=cur+dl;SND.sfx(dl>0?'statup':'statdown');await say(`${tgt}'s ${nm} ${dl>0?'rose':'fell'}!`)}
  }
}
async function resolveFaints(){
  if(B.foe.hp<=0){
    SND.sfx('faint');await tween(350,k=>B.drop={side:'foe',k});B.show.foe=false;B.drop=null;
    await say(`${lbl('foe')} fainted!`);
    if(B.wild||B.fi>=B.foes.length-1)B.music='victory';
    await giveExp();
    if(!B.wild&&B.fi<B.foes.length-1){
      B.fi++;B.foe=B.foes[B.fi];B.st.foe=stg();B.dhp.foe=B.foe.hp;
      B.part=new Set([B.me].filter(m=>m.hp>0));
      markSeen(B.foe.sp);await say(`${B.trainer.name} sent out ${B.foe.sp}!`);B.show.foe=true;
    }else{if(!B.wild)await say(`You defeated ${B.trainer.name}!`);return 'win'}
  }
  if(B.me.hp<=0){
    SND.sfx('faint');await tween(350,k=>B.drop={side:'me',k});B.show.me=false;B.drop=null;
    await say(`${B.me.sp} fainted!`);
    if(!G.party.some(m=>m.hp>0))return 'lose';
    await say('Choose your next monster.');
    let r=null;while(!r)r=await teamMenu(true,true);
    B.me=r.mon;B.st.me=stg();B.dhp.me=B.me.hp;B.part.add(B.me);B.show.me=true;await say(`Go, ${B.me.sp}!`);
  }
  return null;
}
async function giveExp(){
  const ps=[...B.part].filter(m=>m.hp>0&&G.party.includes(m));if(!ps.length)return;
  const total=Math.floor(SP[B.foe.sp].xp*B.foe.lvl/7*(B.wild?1:1.5));
  const each=Math.max(1,Math.floor(total/ps.length));
  for(const m of ps){await say(`${m.sp} gained ${each} XP!`);await addExp(m,each)}
}
async function addExp(m,g){
  m.exp+=g;
  while(m.lvl<50&&m.exp>=(m.lvl+1)**3){
    const old=maxhp(m);m.lvl++;m.hp+=maxhp(m)-old;if(B&&m===B.me)B.dhp.me=m.hp;
    SND.jingle('levelup');await say(`${m.sp} grew to level ${m.lvl}!`);
    for(const [l,mv] of SP[m.sp].learn)if(l===m.lvl)await learnMove(m,mv);
  }
}
async function learnMove(m,mv){
  if(m.moves.includes(mv))return;
  if(m.moves.length<4){m.moves.push(mv);await say(`${m.sp} learned ${mv}!`);return}
  await say(`${m.sp} wants to learn ${mv}, but it already knows four moves.`);
  const c=await choose(m.moves.map(n=>`${n}${chip(MV[n].t)}`).concat([`Skip ${mv}`]),{prompt:`Forget which move for ${mv}${chip(MV[mv].t)}?`.replace(/<[^>]+>/g,'')});
  if(c>=0&&c<4){const old=m.moves[c];m.moves[c]=mv;await say(`${m.sp} forgot ${old} and learned ${mv}!`)}
  else await say(`${m.sp} did not learn ${mv}.`);
}
async function throwOrb(item){
  const it=ITEMS[item],f=B.foe;
  sayNow(`You threw ${item==='Orb'?'an':'a'} ${item}!`);
  B.orb={x:40,y:120,rot:0,item};SND.sfx('throw');
  await tween(520,k=>{B.orb.x=40+(172-40)*k;B.orb.y=120+(50-120)*k-Math.sin(k*Math.PI)*50});
  B.absorb=now();await wait(300);B.show.foe=false;B.absorb=0;
  await tween(250,k=>{B.orb.y=50+(66-50)*k});
  const mx=maxhp(f);const p=Math.min(.98,((3*mx-2*f.hp)/(3*mx))*SP[f.sp].cr*it.orb*1.35);
  const ok=rnd()<p;const shakes=ok?3:(rnd()<p*1.4?2:rnd()<.6?1:0);
  for(let i=0;i<shakes;i++){await wait(250);SND.sfx('shake');await tween(420,k=>B.orb.rot=Math.sin(k*Math.PI*2)*.55);B.orb.rot=0}
  await wait(300);
  if(ok){
    B.orb.caught=true;B.music=null;await wait(SND.jingle('catch'));const isNew=!G.caught.includes(f.sp);markCaught(f.sp);await say(`Gotcha! ${f.sp} was caught!`);if(isNew)await say(`${f.sp}'s data was added to your Dex.`);
    if(G.party.length<6){G.party.push(f);await say(`${f.sp} joined your team.`)}
    else{G.box.push(f);await say(`Your team is full, so ${f.sp} was sent to storage.`)}
    return true;
  }
  B.orb=null;B.show.foe=true;SND.sfx('break');
  await say(['Oh no! It broke free!','Argh! Almost had it!','It shook itself loose!'][Math.min(shakes,2)]);
  return false;
}
async function endBattle(r){
  if(r!=='lose')for(const m of G.party){const e=SP[m.sp].evo;if(e&&m.lvl>=e[1]&&m.hp>0)await evolve(m,e[0])}
  B=null;mode='world';hideUI();held=[];return r;
}
async function evolve(m,to){
  const from=m.sp;mode='evolve';EVO={from,to,t0:now(),done:false};
  await say(`What? ${from} is evolving!`);
  EVO.t0=now();await wait(2600);
  const old=maxhp(m);m.sp=to;m.hp+=maxhp(m)-old;EVO.done=true;SND.music(null);SND.jingle('evolved');markCaught(to);
  await say(`Congratulations! ${from} evolved into ${to}!`);
  for(const [l,mv] of SP[to].learn)if(l===m.lvl)await learnMove(m,mv);
  EVO=null;mode=B?'battle':'world';
}

const BGS={
 valley:{sky:['#bfe3ef','#eef0d6'],ground:['#a9d38a','#86c06a'],pf:['#7db35f','#93c774','#6ea654','#86bd68'],clouds:'rgba(255,255,255,.7)'},

function renderWorld(){
  const ppx=(P.moving?P.x+(P.tx-P.x)*P.t:P.x)*TS, ppy=(P.moving?P.y+(P.ty-P.y)*P.t:P.y)*TS;

  if(CUR.dark){const lx=ppx-cx+8,ly=ppy-cy+6;const g=X.createRadialGradient(lx,ly,18,lx,ly,78);g.addColorStop(0,'rgba(8,6,16,0)');g.addColorStop(1,'rgba(8,6,16,.9)');X.fillStyle=g;X.fillRect(0,0,SW,SH)}
  if(CUR.snow){const tt=now()/1000;X.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<45;i++){const sx=((i*53.7+Math.sin(tt+i)*8+tt*10)%SW+SW)%SW,sy=((i*37.3+tt*(18+i%5*4))%SH);X.fillRect(sx,sy,i%3?1:2,i%3?1:2)}}
  if(champFx&&now()-champFx<4000){const k=(now()-champFx)/4000;for(let i=0;i<30;i++){const a=i*2.4+k*6;X.fillStyle=['#f2b84b','#e8664f','#8fb7e8','#f6f2e4'][i%4];X.fillRect(120+Math.cos(a)*k*140,88+Math.sin(a)*k*110-k*20,2,2)}}
  if(AREA){const a=(now()-AREA.t0);if(a>2200)AREA=null;else{const o=a<200?a/200:a>1900?(2200-a)/300:1;X.globalAlpha=o;rr(6,6,Math.max(70,AREA.name.length*5.4+16),16,3,'#f6f2e4','#22202a');T(AREA.name,14,17.5,9,'#22202a');X.globalAlpha=1}}

function drawItemBall(x,y){X.fillStyle='rgba(0,0,0,.2)';X.beginPath();X.ellipse(x+8,y+13,4,1.4,0,0,7);X.fill();
  X.fillStyle=INK;X.beginPath();X.arc(x+8,y+9,4.5,0,7);X.fill();X.fillStyle='#e8664f';X.beginPath();X.arc(x+8,y+9,3.6,Math.PI,0);X.fill();

function hpBar(x,y,w,m,disp){const r=Math.max(0,disp/maxhp(m));X.fillStyle='#2b2b33';X.fillRect(x,y,w,4);X.fillStyle='#e9e4d4';X.fillRect(x+1,y+1,w-2,2);X.fillStyle=hpCol(r);X.fillRect(x+1,y+1,Math.round((w-2)*r),2)}
function renderBattle(){
  const bg=BGS[CUR.bg]||BGS.valley;
  const g=X.createLinearGradient(0,0,0,SH);g.addColorStop(0,bg.sky[0]);g.addColorStop(.55,bg.sky[1]);g.addColorStop(.56,bg.ground[0]);g.addColorStop(1,bg.ground[1]);
  X.fillStyle=g;X.fillRect(0,0,SW,SH);
  if(CUR.bg==='cave'){X.fillStyle='#9fe3f0';for(let i=0;i<14;i++){X.globalAlpha=.25+.25*Math.sin(now()/400+i);X.fillRect((i*37)%SW,(i*23)%90,2,2)}X.globalAlpha=1}
  if(bg.clouds){X.fillStyle=bg.clouds;[[30,20,18],[60,14,12],[200,28,14]].forEach(([x,y,r])=>{X.beginPath();X.ellipse(x,y,r,r*.45,0,0,7);X.fill()})}
  X.fillStyle=bg.pf[0];X.beginPath();X.ellipse(176,74,42,9,0,0,7);X.fill();X.fillStyle=bg.pf[1];X.beginPath();X.ellipse(176,72,38,7,0,0,7);X.fill();
  X.fillStyle=bg.pf[2];X.beginPath();X.ellipse(64,124,52,11,0,0,7);X.fill();X.fillStyle=bg.pf[3];X.beginPath();X.ellipse(64,122,48,9,0,0,7);X.fill();
  const t=now(),ent=Math.min(1,(t-B.enter)/450);

  const shk=s=>B.shake[s]&&t-B.shake[s]<300?Math.sin((t-B.shake[s])/22)*3:0;
  const drop=s=>B.drop&&B.drop.side===s?B.drop.k:0;

    drawMon(X,B.foe.sp,148+shk('foe')+(1-ent)*90,22+dk*56,56,false,B.absorb?.4+.6*Math.abs(Math.sin(t/60)):1);X.restore()}
  if(B.show.me&&!blink('me')){const dk=drop('me');X.save();X.beginPath();X.rect(0,0,SW,124);X.clip();
    drawMon(X,B.me.sp,28+shk('me')-(1-ent)*90,58+dk*70,70,true);X.restore()}
  if(B.orb){const o=B.orb;X.save();X.translate(o.x,o.y);X.rotate(o.rot);
    X.fillStyle=INK;X.beginPath();X.arc(0,0,5.5,0,7);X.fill();X.fillStyle=o.item==='Great Orb'?'#4f7fd0':'#e8664f';X.beginPath();X.arc(0,0,4.5,Math.PI,0);X.fill();
    X.fillStyle='#f6f2e4';X.beginPath();X.arc(0,0,4.5,0,Math.PI);X.fill();X.fillStyle=INK;X.fillRect(-4.5,-.5,9,1);X.beginPath();X.arc(0,0,1.6,0,7);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(0,0,.9,0,7);X.fill();
    if(o.caught){X.fillStyle='#f2b84b';for(let i=0;i<3;i++)X.fillRect(-8+i*7,-10-Math.sin(t/120+i)*2,2,2)}X.restore()}
  // approach displayed hp

  if(B.show.foe||B.drop){const f=B.foe;rr(8,10,104,26,4,'#f6f2e4','#22202a');T(f.sp,14,21,9,'#22202a');T('Lv'+f.lvl,106,21,8,'#22202a','right');
    T('HP',14,31,6,'#e8664f');hpBar(26,27,80,f,B.dhp.foe);
    if(!B.wild){for(let i=0;i<B.foes.length;i++){X.fillStyle=B.foes[i].hp>0?'#e8664f':'#9b9b9b';X.beginPath();X.arc(16+i*7,42,2.4,0,7);X.fill()}}}
  if(B.show.me||B.drop){const m=B.me;rr(128,84,104,36,4,'#f6f2e4','#22202a');T(m.sp,134,95,9,'#22202a');T('Lv'+m.lvl,226,95,8,'#22202a','right');
    T('HP',134,105,6,'#e8664f');hpBar(146,101,80,m,B.dhp.me);T(`${Math.round(B.dhp.me)}/${maxhp(m)}`,226,114,8,'#22202a','right');
    const lo=m.lvl**3,hi=(m.lvl+1)**3,er=Math.max(0,Math.min(1,(m.exp-lo)/(hi-lo)));X.fillStyle='#2b2b33';X.fillRect(134,116,52,2);X.fillStyle='#4f86e0';X.fillRect(134,116,52*er,2)}
}
function scenery(){
  const g=X.createLinearGradient(0,0,0,SH);g.addColorStop(0,'#7fb8e0');g.addColorStop(.6,'#f2dfb0');g.addColorStop(1,'#f2c88a');X.fillStyle=g;X.fillRect(0,0,SW,SH);
  X.fillStyle='#6aa86a';X.beginPath();X.moveTo(0,120);X.quadraticCurveTo(60,86,130,112);X.quadraticCurveTo(190,92,240,108);X.lineTo(240,176);X.lineTo(0,176);X.fill();

let last=now();
function frame(){
  const t=now(),dt=Math.min(.05,(t-last)/1000);last=t;
  X.setTransform(2,0,0,2,0,0);X.imageSmoothingEnabled=false;
  SND.music(mode==='title'||mode==='pick'?'valley':mode==='evolve'?(EVO&&EVO.done?null:'evolve'):mode==='battle'&&B?B.music:CUR.id);

  else if(mode==='battle'&&B)renderBattle();

/* ---------------- boot ---------------- */
async function titleFlow(){
  mode='title';busy=true;
  const sv=readSave();
  const opts=sv?['Continue','New Game']:['New Game'];
  const c=await choose(opts,{prompt:sv?`Saved game found: ${sv.party.length} on your team, ${sv.money} coins.`:'Press A to start your adventure.'});
  if(sv&&c===0){load(sv);mode='world';hideUI();busy=false;AREA={name:CUR.name,t0:now()};await run(()=>say(`Welcome back! You are in ${CUR.name}.`));return}
  newGame();
  for(const l of ['Hello there! I\'m Professor Wren, and this is Fernvale Valley.',
    'Wild monsters live in the tall grass here. People team up with them, train together, and battle for fun.',
    'At the top of the ridge to the north lives the Warden, the strongest trainer in the valley.',
    'Every journey starts with a partner. Pick one!'])await say(l);
  mode='pick';
  for(;;){
    const i=await choose(STARTERS.map(s=>`${s}${chip(SP[s].t[0])}`),{prompt:'Who will be your partner?',onMove:k=>PICK.hi=k,start:PICK.hi});
    const s=STARTERS[i];await say(SP[s].dex);
    const y=await choose(['Yes','No'],{prompt:`Choose ${s}, the ${SP[s].t[0]} type?`});
    if(y===0){G.starter=s;G.party.push(makeMon(s,5));markCaught(s);break}
  }
  await say(`${G.starter} is your partner now! Take these 5 Orbs and 2 Potions as well.`);
  mode='world';P.dir='up';
  await say('The Rest House with the red roof heals your team. The Trading Post with the blue roof sells supplies.');
  await say('Head north through the tall grass, or west to the Saltmarsh Coast. Good luck!');
  AREA={name:CUR.name,t0:now()};
  hideUI();busy=false;
}
function boot(data){
  if(data&&data.save){try{load(JSON.parse(data.save));mode='world';busy=false;hideUI();return}catch(e){}}
  titleFlow();
}
window.claude?.hot?.snapshot?.(()=>({save:G&&mode==='world'&&!busy?JSON.stringify(serialize()):null}));
requestAnimationFrame(frame);
const start=d=>boot(d||{});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{})});
})();
</script>
