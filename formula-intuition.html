<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Intuition Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root {
  --bg: #f6f3ec;
  --paper: #fffdf8;
  --ink: #1d2330;
  --muted: #5d6474;
  --line: #e2dccd;
  --grid: #ece6d8;
  --accent: #2f5bea;
  --accent-2: #e2742b;
  --accent-3: #1a9a6c;
  --accent-4: #b0399a;
  --chip: #ece7db;
  --good: #1a9a6c;
  --bad: #c8412f;
  --f-head: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --paper: #1a1e28; --ink: #e8e9ee; --muted: #9aa1b2; --line: #2b3140;
    --grid: #232836; --accent: #7d9bff; --accent-2: #ff9d5c; --accent-3: #4fd1a1; --accent-4: #e27ad0;
    --chip: #252a37; --good: #4fd1a1; --bad: #ff7a66; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --paper: #1a1e28; --ink: #e8e9ee; --muted: #9aa1b2; --line: #2b3140;
  --grid: #232836; --accent: #7d9bff; --accent-2: #ff9d5c; --accent-3: #4fd1a1; --accent-4: #e27ad0;
  --chip: #252a37; --good: #4fd1a1; --bad: #ff7a66; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.55 var(--f-body); padding: 20px 16px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h1 { font: 800 clamp(26px, 4vw, 38px)/1.05 var(--f-head); margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 60ch; }
.theme-btn { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: 500 13px var(--f-body); cursor: pointer; }

.layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
.side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; display: grid; gap: 10px; align-content: start; padding-right: 4px; }
#search { width: 100%; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: 400 14px var(--f-body); }
.progress { font: 500 12px var(--f-mono); color: var(--muted); padding: 0 4px; }
.progress .bar { height: 5px; background: var(--chip); border-radius: 9px; margin-top: 5px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--good); }
nav { display: grid; gap: 14px; }
.empty { color: var(--muted); font-size: 13px; padding: 4px; }
.group h3 { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 6px 4px; }
.group .list { display: grid; gap: 4px; }
.topic { text-align: left; background: transparent; border: 1px solid transparent; color: var(--ink); border-radius: 10px; padding: 8px 10px; font: 500 14px var(--f-body); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.topic:hover { background: var(--chip); }
.topic[aria-current="true"] { background: var(--paper); border-color: var(--line); box-shadow: 0 1px 0 var(--line); }
.topic .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.topic.done .dot { background: var(--good); }

main { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline; }
.head h2 { font: 800 24px/1.15 var(--f-head); margin: 0; }
.tag { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.formula { font-size: 26px; margin: 14px 0 6px; padding: 14px; border-radius: 12px; background: var(--bg); text-align: center; overflow-x: auto; }
.blurb { color: var(--muted); margin: 0; }

.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 440px; border-radius: 12px; background: var(--bg); overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 20px; margin-top: 14px; }
.ctl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.ctl label b { font: 600 13px var(--f-mono); color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.readout { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { font: 500 13px var(--f-mono); background: var(--chip); border-radius: 8px; padding: 5px 10px; }
.pill i { font-style: normal; color: var(--muted); }

.two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.card h4 { font: 700 16px var(--f-head); margin: 0 0 8px; }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.try { border-left: 3px solid var(--accent-2); padding-left: 12px; margin: 0; }
.quiz .opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: 500 14px var(--f-body); color: var(--ink); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.why { margin-top: 10px; color: var(--muted); }
.navrow { display: flex; justify-content: space-between; gap: 10px; }
.navrow button { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font: 500 14px var(--f-body); cursor: pointer; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; overflow: visible; padding: 0; }
  nav { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .group { display: contents; }
  .group h3 { display: none; }
  .group .list { display: contents; }
  .topic { white-space: nowrap; flex: none; background: var(--chip); }
  .two { grid-template-columns: 1fr; }
  .formula { font-size: 20px; }
  .stage { aspect-ratio: 4 / 3; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Formula <span>Intuition</span> Lab</h1>
      <p class="sub">Don't memorise the formula — move the sliders and watch why it has to be that way.</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">Toggle theme</button>
  </header>
  <div class="layout">
    <aside class="side">
      <input id="search" type="search" placeholder="Search formulas…" aria-label="Search formulas">
      <div id="progress" class="progress"></div>
      <nav id="nav" aria-label="Formulas"></nav>
    </aside>
    <main>
      <section class="card">
        <div class="head"><h2 id="title"></h2><span class="tag" id="subject"></span></div>
        <div class="formula" id="formula"></div>
        <p class="blurb" id="blurb"></p>
      </section>
      <section class="card">
        <div class="stage" id="stage"><canvas id="cv"></canvas></div>
        <div class="controls" id="controls"></div>
        <div class="readout" id="readout"></div>
      </section>
      <div class="two">
        <section class="card"><h4>Why it works</h4><ul id="insights"></ul></section>
        <section class="card"><h4>Try this</h4><p class="try" id="tryit"></p></section>
      </div>
      <section class="card quiz">
        <h4>Quick check</h4>
        <div id="q"></div>
        <div class="opts" id="opts"></div>
        <div class="why" id="why"></div>
      </section>
      <div class="navrow"><button id="prev" type="button">← Previous</button><button id="next" type="button">Next →</button></div>
    </main>
  </div>
</div>

<script>
const R = String.raw;
const DEG = Math.PI / 180;
const fmt = (x, d = 2) => (Math.abs(x) >= 1000 ? x.toFixed(0) : x.toFixed(d));

// ---------- drawing helpers ----------
let C = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);
  for (const k of ['ink','muted','line','grid','accent','accent-2','accent-3','accent-4','paper','bg']) C[k] = s.getPropertyValue('--' + k).trim();
}
function line(c, x1, y1, x2, y2, col, w = 2, dash = null) {
  c.save(); c.strokeStyle = col; c.lineWidth = w; if (dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore();
}
function arrow(c, x1, y1, x2, y2, col, w = 2, dash = null) {
  line(c, x1, y1, x2, y2, col, w, dash);
  const a = Math.atan2(y2 - y1, x2 - x1), L = 9;
  if (Math.hypot(x2 - x1, y2 - y1) < 3) return;
  c.save(); c.fillStyle = col; c.beginPath(); c.moveTo(x2, y2);
  c.lineTo(x2 - L * Math.cos(a - .4), y2 - L * Math.sin(a - .4));
  c.lineTo(x2 - L * Math.cos(a + .4), y2 - L * Math.sin(a + .4)); c.closePath(); c.fill(); c.restore();
}
function dot(c, x, y, r, col) { c.save(); c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.restore(); }
function text(c, s, x, y, col, size = 13, align = 'left', base = 'alphabetic') {
  c.save(); c.fillStyle = col; c.font = `500 ${size}px "IBM Plex Sans", system-ui, sans-serif`; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); c.restore();
}
function gridBg(c, w, h, step = 28) {
  c.save(); c.strokeStyle = C.grid; c.lineWidth = 1; c.beginPath();
  for (let x = step; x < w; x += step) { c.moveTo(x + .5, 0); c.lineTo(x + .5, h); }
  for (let y = step; y < h; y += step) { c.moveTo(0, y + .5); c.lineTo(w, y + .5); }
  c.stroke(); c.restore();
}

function axes(c, b, xr, yr, xl = '', yl = '') {
  const X = v => b.x + (v - xr[0]) / (xr[1] - xr[0]) * b.w, Y = v => b.y + b.h - (v - yr[0]) / (yr[1] - yr[0]) * b.h;
  const y0 = Y(Math.min(Math.max(0, yr[0]), yr[1])), x0 = X(Math.min(Math.max(0, xr[0]), xr[1]));
  line(c, b.x, y0, b.x + b.w, y0, C.ink, 1.5); line(c, x0, b.y, x0, b.y + b.h, C.ink, 1.5);
  if (xl) text(c, xl, b.x + b.w, y0 + 16, C.muted, 12, 'right');
  if (yl) text(c, yl, x0 + 6, b.y + 10, C.muted, 12, 'left');
  return { X, Y };
}
function plot(c, f, x0, x1, X, Y, col, wd = 2.5, dash = null, n = 200) {
  c.save(); c.strokeStyle = col; c.lineWidth = wd; if (dash) c.setLineDash(dash); c.beginPath();
  for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n, y = f(x); i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)); }
  c.stroke(); c.restore();
}
function fillPoly(c, pts, col, alpha = 0.2) {
  c.save(); c.fillStyle = col; c.globalAlpha = alpha; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); c.restore();
}
function circ(c, x, y, r, col, wd = 1.5, dash = null, a0 = 0, a1 = Math.PI * 2) {
  c.save(); c.strokeStyle = col; c.lineWidth = wd; if (dash) c.setLineDash(dash); c.beginPath(); c.arc(x, y, Math.max(0, r), a0, a1); c.stroke(); c.restore();
}
function waveColor(nm) {
  let r = 0, g = 0, b = 0;
  if (nm >= 380 && nm < 440) { r = (440 - nm) / 60; b = 1; } else if (nm >= 440 && nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm >= 490 && nm < 510) { g = 1; b = (510 - nm) / 20; } else if (nm >= 510 && nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm >= 580 && nm < 645) { r = 1; g = (645 - nm) / 65; } else if (nm >= 645 && nm <= 780) { r = 1; } else return null;
  return `rgb(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0})`;
}
const nCr = (n, r) => { let v = 1; for (let i = 1; i <= r; i++) v = v * (n - i + 1) / i; return Math.round(v); };
const sci = x => x === 0 ? '0' : (Math.abs(x) < 1e-3 || Math.abs(x) >= 1e5 ? x.toExponential(2).replace('e', '×10^') : fmt(x, 3));

// ---------- topics ----------
const TOPICS = [
{
  id: 'projectile', subject: 'Physics · Kinematics', title: 'Projectile range',
  tex: R`R = \dfrac{u^{2}\,\sin 2\theta}{g}`,
  blurb: 'How far does something go when you throw it at speed u and angle θ?',
  controls: [
    { k: 'u', label: 'Launch speed u', min: 5, max: 30, step: 0.5, val: 20, unit: ' m/s' },
    { k: 'th', label: 'Angle θ', min: 5, max: 85, step: 1, val: 30, unit: '°' },
    { k: 'g', label: 'Gravity g', min: 1.6, max: 25, step: 0.1, val: 9.8, unit: ' m/s²' },
  ],
  readout: p => { const th = p.th * DEG, R = p.u ** 2 * Math.sin(2 * th) / p.g;
    return [['Range R', fmt(R, 1) + ' m'], ['Max height H', fmt((p.u * Math.sin(th)) ** 2 / (2 * p.g), 1) + ' m'], ['Flight time', fmt(2 * p.u * Math.sin(th) / p.g) + ' s'], ['sin 2θ', fmt(Math.sin(2 * th), 3)]]; },
  draw(c, w, h, p, t) {
    gridBg(c, w, h);
    const u = p.u, g = p.g, pad = 34;
    const Rmax = u * u / g, Hmax = u * u / (2 * g);
    const s = Math.min((w - 2 * pad) / Rmax, (h - 2 * pad) / Hmax);
    const ox = pad, oy = h - pad;
    line(c, 0, oy, w, oy, C.ink, 2);
    const path = (thd, col, dash, wdt) => {
      const th = thd * DEG, T = 2 * u * Math.sin(th) / g;
      c.save(); c.strokeStyle = col; c.lineWidth = wdt; if (dash) c.setLineDash(dash); c.beginPath();
      for (let i = 0; i <= 80; i++) { const tt = T * i / 80; const x = u * Math.cos(th) * tt, y = u * Math.sin(th) * tt - g * tt * tt / 2; i ? c.lineTo(ox + x * s, oy - y * s) : c.moveTo(ox, oy); }
      c.stroke(); c.restore(); return T;
    };
    if (Math.abs(p.th - 45) > 0.5) path(90 - p.th, C.muted, [6, 6], 1.5);
    path(45, C['accent-3'], [2, 5], 1.5);
    const T = path(p.th, C.accent, null, 3);
    const th = p.th * DEG, Rr = u * u * Math.sin(2 * th) / g;
    const frac = Math.min(1, (t % 3.2) / 2.4), tt = frac * T;
    const bx = ox + u * Math.cos(th) * tt * s, by = oy - (u * Math.sin(th) * tt - g * tt * tt / 2) * s;
    dot(c, bx, by, 7, C['accent-2']);
    const vx = u * Math.cos(th), vy = u * Math.sin(th) - g * tt;
    arrow(c, bx, by, bx + vx * 2.2, by, C['accent-3'], 2);
    arrow(c, bx, by, bx, by - vy * 2.2, C['accent-4'], 2);
    line(c, ox + Rr * s, oy - 8, ox + Rr * s, oy + 8, C.ink, 2);
    text(c, `R = ${fmt(Rr, 1)} m`, ox + Rr * s, oy + 22, C.ink, 13, 'center');
    text(c, `— your throw (${p.th}°)`, w - 12, 20, C.accent, 12, 'right');
    text(c, '··· 45° (max range)', w - 12, 38, C['accent-3'], 12, 'right');
    if (Math.abs(p.th - 45) > 0.5) text(c, `- - ${90 - p.th}° (same range!)`, w - 12, 56, C.muted, 12, 'right');
    if (w > 620) text(c, 'horizontal v stays constant · vertical v shrinks, flips', 12, 20, C.muted, 12);
  },
  insights: [
    R`Horizontal speed is $u\cos\theta$ and never changes. Time in air is $2u\sin\theta/g$. Range = speed × time = $2u^2\sin\theta\cos\theta/g$, and $2\sin\theta\cos\theta=\sin 2\theta$.`,
    R`$\sin 2\theta$ peaks at $2\theta=90^\circ$, so $45^\circ$ is the sweet spot: a balance between "going fast sideways" and "staying up long".`,
    R`$\theta$ and $90^\circ-\theta$ give the same $\sin 2\theta$ → same range. One is a low fast skim, the other a high lob.`,
    R`$R\propto u^2$: double the speed → four times the range (you go twice as fast <em>and</em> stay up twice as long).`,
  ],
  tryit: 'Set θ = 30°, note R. Now set θ = 60°. Then halve g (go to the Moon side) — what happens to every number?',
  quiz: { q: 'A ball thrown at 25° lands 40 m away. At what other angle, same speed, does it land at the same spot?', opts: ['50°', '65°', '45°', '75°'], a: 1, why: 'sin 2θ is the same for θ and 90° − θ, so 90° − 25° = 65°.' },
},
{
  id: 'shm', subject: 'Physics · Oscillations', title: 'Simple harmonic motion',
  tex: R`x = A\sin(\omega t + \phi),\quad a = -\omega^{2}x`,
  blurb: 'SHM is just the shadow of a point going round a circle at constant speed.',
  controls: [
    { k: 'A', label: 'Amplitude A', min: 0.2, max: 1, step: 0.05, val: 0.8, unit: '' },
    { k: 'w', label: 'Angular freq ω', min: 0.5, max: 4, step: 0.1, val: 1.5, unit: ' rad/s' },
    { k: 'ph', label: 'Phase φ', min: 0, max: 360, step: 5, val: 0, unit: '°' },
  ],
  readout: (p, t) => { const th = p.w * t + p.ph * DEG, x = p.A * Math.sin(th);
    return [['x', fmt(x)], ['v = Aω cos', fmt(p.A * p.w * Math.cos(th))], ['a = −ω²x', fmt(-p.w * p.w * x)], ['Period T = 2π/ω', fmt(2 * Math.PI / p.w) + ' s']]; },
  live: true,
  draw(c, w, h, p, t) {
    gridBg(c, w, h);
    const r = Math.min(h * 0.38, w * 0.17), cx = r + 30, cy = h / 2;
    const th = p.w * t + p.ph * DEG, A = p.A * r;
    c.save(); c.strokeStyle = C.line; c.lineWidth = 1.5; c.beginPath(); c.arc(cx, cy, A, 0, 7); c.stroke(); c.restore();
    const px = cx + A * Math.cos(th), py = cy - A * Math.sin(th);
    line(c, cx, cy, px, py, C.muted, 1.5);
    const ax = cx + r + 34;
    line(c, ax, cy - r - 10, ax, cy + r + 10, C.ink, 1.5);
    line(c, px, py, ax, py, C.muted, 1, [4, 4]);
    line(c, ax, cy, w - 10, cy, C.line, 1);
    dot(c, px, py, 6, C.accent);
    // trace
    const speed = 70;
    c.save(); c.strokeStyle = C.accent; c.lineWidth = 2.5; c.beginPath();
    for (let x = ax; x < w - 10; x += 2) { const tt = t - (x - ax) / speed; const y = cy - A * Math.sin(p.w * tt + p.ph * DEG); x === ax ? c.moveTo(x, y) : c.lineTo(x, y); }
    c.stroke(); c.restore();
    // mass on axis with velocity & accel arrows
    const vy = A * p.w * Math.cos(th), ay = -p.w * p.w * A * Math.sin(th);
    arrow(c, ax - 16, py, ax - 16, py - vy * 0.5, C['accent-3'], 2.5);
    arrow(c, ax + 16, py, ax + 16, py - ay * 0.25, C['accent-2'], 2.5);
    dot(c, ax, py, 9, C['accent-4']);
    text(c, 'v', ax - 30, py - vy * 0.25, C['accent-3'], 13, 'center', 'middle');
    text(c, 'a', ax + 30, py - ay * 0.12, C['accent-2'], 13, 'center', 'middle');
    text(c, 'circle (constant speed)', cx, h - 12, C.muted, 12, 'center');
    text(c, 'its shadow over time →', ax + 10, 20, C.muted, 12);
  },
  insights: [
    R`A point moving round a circle of radius $A$ at angular speed $\omega$ has height $A\sin(\omega t+\phi)$. That shadow <em>is</em> SHM.`,
    R`Speed is greatest at the centre ($v_{max}=A\omega$) and zero at the ends — watch the green arrow.`,
    R`Acceleration (orange) always points back to the centre and grows with distance: $a=-\omega^2x$. That restoring "pull back harder the further you go" is the definition of SHM.`,
    R`Period $T=2\pi/\omega$ doesn't depend on $A$: a bigger swing just goes faster.`,
  ],
  tryit: 'Change only A while watching the period readout. Then double ω — how do v_max and a_max change (×2 vs ×4)?',
  quiz: { q: 'Where is the speed of a particle in SHM maximum?', opts: ['At the extreme positions', 'At the mean position', 'Halfway to the extreme', 'Same everywhere'], a: 1, why: 'v = ω√(A² − x²), largest when x = 0. All the energy is kinetic there.' },
},
{

{

  ],
  readout: p => { const f = Math.abs(p.f) < 0.5 ? 0.5 : p.f, d = p.u + f;

    const v = p.u * f / d, m = v / p.u;
    return [['v', fmt(v, 1) + ' cm'], ['m', fmt(m, 2)], ['Image', (v > 0 ? 'real, ' : 'virtual, ') + (m < 0 ? 'inverted, ' : 'erect, ') + (Math.abs(m) > 1 ? 'magnified' : 'diminished')]]; },
  draw(c, w, h, p) {

    c.globalAlpha = .15; c.fillStyle = C.accent; c.fill(); c.globalAlpha = 1; c.stroke(); c.restore();

{

  ],
  live: true,
  readout: p => { const st = gasState; const pred = (p.N / 50) * (p.T / 300) / p.V;

  draw(c, w, h, p, t, dt) {
    const st = gasState, base = 110;
    const bx = 20, by = 20, fullW = w - 40, bh = h - 40, bw = fullW * p.V;
    const vmag = base * Math.sqrt(p.T / 300);
    while (st.parts.length < p.N) { const a = Math.random() * 7; st.parts.push({ x: bx + Math.random() * bw, y: by + Math.random() * bh, vx: Math.cos(a) * vmag, vy: Math.sin(a) * vmag, flash: 0 }); }
    if (st.parts.length > p.N) st.parts.length = p.N;
    if (st.T !== p.T) { const k = Math.sqrt(p.T / (st.T || p.T)); for (const q of st.parts) { q.vx *= k; q.vy *= k; } st.T = p.T; }
    dt = Math.min(dt, 0.03);
    let imp = 0;
    for (const q of st.parts) {
      q.x += q.vx * dt; q.y += q.vy * dt; q.flash = Math.max(0, q.flash - dt * 4);
      if (q.x < bx) { q.x = 2 * bx - q.x; q.vx = Math.abs(q.vx); imp += 2 * q.vx; q.flash = 1; }
      if (q.x > bx + bw) { if (q.vx > 0) { imp += 2 * q.vx; q.flash = 1; } q.vx = -Math.abs(q.vx); q.x = Math.min(q.x, bx + bw); }
      if (q.y < by) { q.y = 2 * by - q.y; q.vy = Math.abs(q.vy); imp += 2 * q.vy; q.flash = 1; }
      if (q.y > by + bh) { q.y = 2 * (by + bh) - q.y; imp += 2 * Math.abs(q.vy); q.vy = -Math.abs(q.vy); q.flash = 1; }
    }
    st.acc = (st.acc || 0) + imp; st.accT = (st.accT || 0) + dt;
    if (st.accT >= 0.75) {
      const P = st.acc / (2 * (bw + bh)) / st.accT;
      st.acc = 0; st.accT = 0;
      st.P = st.P == null ? P : st.P + (P - st.P) * 0.3;
      const kTheory = base * base / 300 / 2, Pref = kTheory * 50 * 300 / (fullW * bh);
      st.Prel = st.P / Pref;
    }

    c.save(); c.fillStyle = C.paper; c.fillRect(bx, by, bw, bh); c.restore();
    c.save(); c.strokeStyle = C.ink; c.lineWidth = 3; c.strokeRect(bx, by, bw, bh); c.restore();

    text(c, 'orange flash = a wall hit (that is pressure)', bx + 8, by + bh - 8, C.muted, 12);
  },
  insights: [

    R`More molecules → more hits → $P\propto n$. Squeeze the volume → shorter trips between walls → more hits → $P\propto 1/V$.`,

},
{

  draw(c, w, h, p, t) {

      c.stroke(); c.restore();

// ===================== BATCH 3 · CHEMISTRY =====================
{
  id: 'nernst', subject: 'Chemistry · Electrochemistry', title: 'Nernst equation',
  tex: R`E = E^\circ - \dfrac{0.0591}{n}\log Q \quad(\text{at }298\text{ K})`,
  blurb: 'A battery runs down because as products build up, Q grows and the voltage drops — until E = 0 at equilibrium.',
  controls: [
    { k: 'E0', label: 'Standard E°', min: -1, max: 1.5, step: 0.01, val: 1.1, unit: ' V' },
    { k: 'n', label: 'Electrons n', min: 1, max: 3, step: 1, val: 2, unit: '' },
    { k: 'lq', label: 'log Q', min: -6, max: 6, step: 0.1, val: 0, unit: '' },
  ],
  readout: p => { const E = p.E0 - 0.0591 / p.n * p.lq; return [['E', fmt(E, 3) + ' V'], ['ΔG = −nFE', fmt(-p.n * 96.485 * E, 1) + ' kJ/mol'], ['log K = nE°/0.0591', fmt(p.n * p.E0 / 0.0591, 1)], ['reaction', E > 0 ? 'spontaneous →' : E < 0 ? 'runs backwards ←' : 'at equilibrium']]; },
  draw(c, w, h, p) {
    gridBg(c, w, h);
    const E = p.E0 - 0.0591 / p.n * p.lq, R0 = Math.min(w * 0.16, h * 0.42), dx = w * 0.2, dy = h * 0.7;
    circ(c, dx, dy, R0, C.ink, 3, null, Math.PI, 2 * Math.PI);
    const ang = v => Math.PI + (v + 1.5) / 3.5 * Math.PI;
    for (const v of [-1, 0, 1, 2]) { const a = ang(v); line(c, dx + (R0 - 8) * Math.cos(a), dy + (R0 - 8) * Math.sin(a), dx + R0 * Math.cos(a), dy + R0 * Math.sin(a), C.ink, 2); text(c, `${v} V`, dx + (R0 + 14) * Math.cos(a), dy + (R0 + 14) * Math.sin(a), C.muted, 11, 'center', 'middle'); }
    const a = ang(Math.max(-1.5, Math.min(2, E)));
    arrow(c, dx, dy, dx + (R0 - 12) * Math.cos(a), dy + (R0 - 12) * Math.sin(a), E >= 0 ? C['accent-3'] : C['accent-4'], 3);
    dot(c, dx, dy, 6, C.ink); text(c, `${fmt(E, 3)} V`, dx, dy + 24, C.ink, 15, 'center');
    const { X, Y } = axes(c, { x: w * 0.44, y: 16, w: w * 0.53, h: h - 44 }, [-6, 6], [-1.5, 2], 'log Q →', 'E (V)');
    plot(c, x => p.E0 - 0.0591 / p.n * x, -6, 6, X, Y, C.accent, 2.5);
    dot(c, X(p.lq), Y(E), 7, C['accent-2']);
    line(c, X(0), Y(p.E0), X(0) - 8, Y(p.E0), C.ink, 2); text(c, 'E°', X(0) - 10, Y(p.E0), C.ink, 12, 'right', 'middle');
    text(c, `slope = −0.0591/${p.n} V per decade`, X(0), Y(-1.3), C.muted, 12, 'center');
  },
  insights: [
    R`$\Delta G=\Delta G^\circ+RT\ln Q$ and $\Delta G=-nFE$. Divide through by $-nF$ and convert to $\log_{10}$ at 298 K → the Nernst equation.`,
    R`At $Q=1$ (all standard), $E=E^\circ$. As products pile up $Q$ rises and $E$ falls — a cell "running down".`,
    R`Each ×10 in $Q$ costs $0.0591/n$ V: just 30 mV for a 2-electron reaction. Voltage is surprisingly insensitive to concentration.`,
    R`When $E$ hits 0 the cell is dead: equilibrium, $Q=K$, so $\log K=nE^\circ/0.0591$ — huge for a Daniell cell ($\approx 37$).`,
  ],
  tryit: 'Daniell cell: E° = 1.10, n = 2. Push log Q from 0 to +6 — the voltage only drops by ~0.18 V.',
  quiz: { q: 'For Zn|Zn²⁺(0.01 M)||Cu²⁺(1 M)|Cu, E° = 1.10 V. E = ?', opts: ['1.04 V', '1.10 V', '1.16 V', '1.13 V'], a: 2, why: 'Q = [Zn²⁺]/[Cu²⁺] = 0.01, so log Q = −2. E = 1.10 − (0.0591/2)(−2) = 1.10 + 0.059 ≈ 1.16 V.' },
},
{
  id: 'raoult', subject: 'Chemistry · Solutions', title: "Raoult's law",
  tex: R`P = x_A P_A^\circ + x_B P_B^\circ,\qquad y_A = \dfrac{x_A P_A^\circ}{P}`,
  blurb: 'Each liquid only gets to evaporate from its share of the surface, so its vapour pressure is scaled by its mole fraction.',
  controls: [
    { k: 'PA', label: 'Pure A vapour pressure P°A', min: 10, max: 120, step: 1, val: 90, unit: ' kPa' },

    const P = p.x * p.PA + (1 - p.x) * p.PB, ya = P ? p.x * p.PA / P : 0, nv = Math.round(P / 120 * 20);

    text(c, 'vapour', sx + sw / 2, sy - 6, C.muted, 11, 'center'); text(c, 'liquid', sx + sw / 2, h - 16, C.muted, 11, 'center');
    const gx = sx + sw + 50;

    plot(c, x => x * p.PA, 0, 1, X, Y, C.accent, 2, [5, 4]); plot(c, x => (1 - x) * p.PB, 0, 1, X, Y, C['accent-2'], 2, [5, 4]);
    plot(c, x => x * p.PA + (1 - x) * p.PB, 0, 1, X, Y, C.ink, 3);
    line(c, X(p.x), Y(0), X(p.x), Y(125), C.muted, 1, [3, 4]);
    dot(c, X(p.x), Y(p.x * p.PA), 5, C.accent); dot(c, X(p.x), Y((1 - p.x) * p.PB), 5, C['accent-2']); dot(c, X(p.x), Y(P), 6, C.ink);
    text(c, 'pA', X(1) - 4, Y(p.PA) - 6, C.accent, 12, 'right'); text(c, 'pB', X(0) + 6, Y(p.PB) - 6, C['accent-2'], 12); text(c, 'total', X(0.5), Y(0.5 * (p.PA + p.PB)) - 8, C.ink, 12, 'center');
  },
  insights: [
    R`Only molecules at the surface can escape. If a fraction $x_A$ of them are A, A escapes $x_A$ times as often as when pure → $p_A=x_AP_A^\circ$.`,
    R`Total pressure (Dalton) is the sum: a straight line between $P_B^\circ$ and $P_A^\circ$.`,
    R`The vapour is richer in the more volatile liquid ($y_A>x_A$ if $P_A^\circ>P_B^\circ$) — the basis of fractional distillation.`,
    R`Real solutions deviate: A–B attractions weaker than A–A/B–B → positive deviation (curve bulges up); stronger → negative.`,
  ],
  tryit: 'With P°A = 90, P°B = 30 and xA = 0.4, compare xA with yA in the readout. The vapour is much richer in A.',
  quiz: { q: 'Benzene (P° = 75 torr) and toluene (P° = 22 torr) are mixed with x(benzene) = 0.4. Total vapour pressure?', opts: ['43.2 torr', '48.5 torr', '30 torr', '97 torr'], a: 0, why: '0.4·75 + 0.6·22 = 30 + 13.2 = 43.2 torr.' },
},
{
  id: 'graham', subject: 'Chemistry · States of matter', title: "Graham's law of effusion",
  tex: R`\dfrac{r_1}{r_2} = \sqrt{\dfrac{M_2}{M_1}}`,
  blurb: 'At the same temperature every gas has the same average KE, so lighter molecules move faster and find the hole more often.',
  controls: [
    { k: 'M1', label: 'Molar mass gas 1 (top)', min: 2, max: 100, step: 1, val: 2, unit: ' g/mol' },
    { k: 'M2', label: 'Molar mass gas 2 (bottom)', min: 2, max: 100, step: 1, val: 32, unit: ' g/mol' },
  ],
  live: true,
  readout(p) { const st = this.st || {}, cn = st.cnt || [0, 0]; return [['predicted r₁/r₂', fmt(Math.sqrt(p.M2 / p.M1), 2)], ['measured r₁/r₂', cn[1] > 3 ? fmt(cn[0] / cn[1], 2) : '…'], ['escaped', `${cn[0]} vs ${cn[1]}`], ['speed ratio', fmt(Math.sqrt(p.M2 / p.M1), 2) + '×']]; },
  draw(c, w, h, p, t, dt) {
    gridBg(c, w, h);
    const st = this.st || (this.st = {}), key = p.M1 + ',' + p.M2;
    const mk = M => Array.from({ length: 30 }, () => { const a = Math.random() * 7; return { u: Math.random(), v: Math.random(), dx: Math.cos(a), dy: Math.sin(a), sp: 420 / Math.sqrt(M) }; });
    if (st.key !== key) { st.key = key; st.g = [mk(p.M1), mk(p.M2)]; st.cnt = [0, 0]; }
    dt = Math.min(dt, 0.05);
    const NAMES = { 2: 'H₂', 4: 'He', 16: 'CH₄', 28: 'N₂', 32: 'O₂', 44: 'CO₂', 71: 'Cl₂' };
    const bx = 20, bw = w * 0.56;
    [[16, h / 2 - 8, p.M1, C.accent], [h / 2 + 8, h - 16, p.M2, C['accent-2']]].forEach(([y0, y1, M, col], gi) => {
      const bh = y1 - y0;
      c.save(); c.strokeStyle = C.ink; c.lineWidth = 2.5; c.beginPath(); c.moveTo(bx + bw, y0 + bh * 0.4); c.lineTo(bx + bw, y0); c.lineTo(bx, y0); c.lineTo(bx, y1); c.lineTo(bx + bw, y1); c.lineTo(bx + bw, y0 + bh * 0.6); c.stroke(); c.restore();
      for (const q of st.g[gi]) {
        q.u += q.dx * q.sp * dt / bw; q.v += q.dy * q.sp * dt / bh;
        if (q.u < 0) { q.u = -q.u; q.dx = Math.abs(q.dx); }
        if (q.v < 0) { q.v = -q.v; q.dy = Math.abs(q.dy); } if (q.v > 1) { q.v = 2 - q.v; q.dy = -Math.abs(q.dy); }
        if (q.u > 1) { if (q.v > 0.4 && q.v < 0.6) { st.cnt[gi]++; q.u = 0.02; q.v = Math.random(); } else { q.u = 2 - q.u; q.dx = -Math.abs(q.dx); } }
        dot(c, bx + q.u * bw, y0 + q.v * bh, 4, col);
      }
      const rate = st.cnt[gi], bmax = Math.max(st.cnt[0], st.cnt[1], 1), bxx = bx + bw + 30, maxW = w - bxx - 20;
      c.save(); c.fillStyle = col; c.globalAlpha = .7; c.fillRect(bxx, y0 + bh * 0.35, maxW * rate / bmax, bh * 0.3); c.restore();
      text(c, `${NAMES[M] || 'M = ' + M} · escaped ${rate}`, bxx, y0 + bh * 0.3, C.ink, 12);
    });
  },
  insights: [
    R`Same temperature → same average KE: $\tfrac12M_1\bar v_1^2=\tfrac12M_2\bar v_2^2$ → $\bar v\propto1/\sqrt M$.`,
    R`Escape rate through a tiny hole is proportional to how often molecules hit it, i.e. to their speed. Hence $r\propto1/\sqrt M$.`,
    R`H₂ vs O₂: masses differ 16×, but rates only $\sqrt{16}=4$×.`,
    R`Used to separate U-235 from U-238 (as UF₆) — the rates differ by just 0.4%, so it takes thousands of stages.`,
  ],
  tryit: 'Leave it on H₂ vs O₂ for ~20 s and compare measured with predicted (4.0). Then set both masses equal.',
  quiz: { q: 'A gas effuses half as fast as O₂ (M = 32). Its molar mass is…', opts: ['16', '64', '128', '8'], a: 2, why: 'r ratio ½ = √(32/M) → M = 32 × 4 = 128.' },
},
{
  id: 'orders', subject: 'Chemistry · Kinetics', title: 'Zero, first & second order',
  tex: R`\text{rate} = k[A]^n:\quad t_{1/2} = \dfrac{[A]_0}{2k},\ \dfrac{0.693}{k},\ \dfrac{1}{k[A]_0}`,
  blurb: 'How fast a reaction slows down as reactant is used up depends on the order. The half-life tells you which order you have.',

  ],

  draw(c, w, h, p) {

    const F = [[t => Math.max(0, p.A0 - p.k * t), p.A0 / (2 * p.k), C['accent-2'], 'zero'], [t => p.A0 * Math.exp(-p.k * t), Math.LN2 / p.k, C.accent, 'first'], [t => p.A0 / (1 + p.k * p.A0 * t), 1 / (p.k * p.A0), C['accent-3'], 'second']];
    line(c, X(0), Y(p.A0 / 2), X(16), Y(p.A0 / 2), C.muted, 1, [3, 4]); text(c, '[A]₀/2', X(16), Y(p.A0 / 2) - 6, C.muted, 11, 'right');

},
// ===================== BATCH 3 · MATHS =====================
{
  id: 'binomial', subject: 'Maths · Binomial theorem', title: "Binomial theorem & Pascal's triangle",
  tex: R`(a+b)^{n} = \sum_{r=0}^{n} \binom{n}{r} a^{\,n-r} b^{\,r}`,
  blurb: 'Expanding (a+b)ⁿ means picking a or b from each of n brackets. ⁿCᵣ counts the ways to pick b exactly r times.',
  controls: [ { k: 'n', label: 'Power n', min: 1, max: 12, step: 1, val: 5, unit: '' } ],
  readout: p => {
    const n = p.n, sup = s => String(s).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join(''), pw = (v, e) => e === 0 ? '' : e === 1 ? v : v + sup(e);
    const term = r => { const k = nCr(n, r); return (k === 1 ? '' : k) + pw('a', n - r) + pw('b', r); };
    const terms = []; for (let r = 0; r <= Math.min(n, 2); r++) terms.push(term(r));
    return [['expansion', terms.join(' + ') + (n > 2 ? ' + …' : '')], ['number of terms', String(n + 1)], ['sum of coefficients', `2${sup(n)} = ${2 ** n}`], ['largest ⁿCᵣ', String(nCr(n, Math.floor(n / 2)))]];
  },
  draw(c, w, h, p) {
    gridBg(c, w, h);
    const n = p.n, lw = w * 0.56, rowH = Math.min(30, (h - 24) / (n + 1)), colW = Math.min(44, (lw - 10) / (n + 1.2)), fs = Math.max(8, Math.min(15, colW * 0.42)), y0 = Math.max(10, (h - (n + 1) * rowH) / 2);
    for (let i = 0; i <= n; i++) for (let j = 0; j <= i; j++) {
      const x = lw / 2 + (j - i / 2) * colW, y = y0 + i * rowH + rowH / 2;
      if (i === n) { c.save(); c.fillStyle = C['accent-2']; c.globalAlpha = .18; c.beginPath(); c.arc(x, y, Math.min(colW, rowH) * 0.48, 0, 7); c.fill(); c.restore(); }
      text(c, String(nCr(i, j)), x, y, i === n ? C.ink : C.muted, fs, 'center', 'middle');
    }
    if (n >= 2) { const i = Math.min(n, 4), j = 1, x = lw / 2 + (j - i / 2) * colW, y = y0 + i * rowH + rowH / 2; c.save(); c.strokeStyle = C['accent-3']; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - colW / 2, y - rowH); c.lineTo(x, y); c.lineTo(x + colW / 2, y - rowH); c.stroke(); c.restore(); }
    const bx = lw + 16, bw = (w - bx - 14) / (n + 1), mx = nCr(n, Math.floor(n / 2)), bh = h - 50;
    for (let r = 0; r <= n; r++) {
      const v = nCr(n, r), hh = v / mx * bh;
      c.save(); c.fillStyle = C.accent; c.globalAlpha = .7; c.fillRect(bx + r * bw + 1, h - 28 - hh, bw - 2, hh); c.restore();
      if (bw > 13) text(c, String(r), bx + r * bw + bw / 2, h - 12, C.muted, 11, 'center');
    }
    text(c, 'ⁿCᵣ for r = 0…n', bx, 16, C.muted, 12);
  },
  insights: [
    R`Write $(a+b)^n$ as $n$ brackets. Each term of the expansion picks $a$ or $b$ from every bracket; picking $b$ exactly $r$ times can happen in $\binom nr$ ways.`,
    R`Pascal's rule $\binom nr=\binom{n-1}{r-1}+\binom{n-1}{r}$: each number is the sum of the two above it (green "V").`,
    R`Put $a=b=1$: the coefficients add up to $2^n$ — every bracket independently gives one of two choices.`,
    R`Symmetry $\binom nr=\binom n{n-r}$, and the middle term is the biggest. For large $n$ the bars approach a bell curve.`,
  ],
  tryit: 'Step n from 1 to 12 and watch the bar chart turn into a bell curve. Check that each row sums to 2ⁿ.',
  quiz: { q: 'The coefficient of x³ in (1 + x)⁷ is…', opts: ['21', '35', '7', '343'], a: 1, why: '⁷C₃ = 7·6·5 / 3! = 35.' },
},

// ---------- state ----------

const params = {}; for (const tp of TOPICS) { params[tp.id] = {}; for (const ct of tp.controls) params[tp.id][ct.k] = ct.val; }
let done = new Set(); try { done = new Set(JSON.parse(localStorage.getItem('fi-done') || '[]')); } catch (e) {}

// ---------- KaTeX ----------
function tex(s, el, display = false) {
  if (window.katex) { try { katex.render(s, el, { displayMode: display, throwOnError: false }); return; } catch (e) {} }
  el.textContent = s.replace(/\\dfrac\{([^}]*)\}\{([^}]*)\}/g, '($1)/($2)').replace(/\\[a-z]+/g, ' ').replace(/[{}]/g, '');
}
function richText(s, el) {
  el.innerHTML = '';
  s.split(/(\$[^$]+\$)/).forEach(part => {
    if (part.startsWith('$') && part.endsWith('$')) { const sp = document.createElement('span'); tex(part.slice(1, -1), sp); el.appendChild(sp); }
    else { const sp = document.createElement('span'); sp.innerHTML = part; el.appendChild(sp); }
  });
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
function buildNav() {
  const nav = $('nav'); nav.innerHTML = '';
  const groups = {}, q = ($('search').value || '').trim().toLowerCase();
  TOPICS.forEach((tp, i) => { if (q && !(tp.title + ' ' + tp.subject).toLowerCase().includes(q)) return; const g = tp.subject.split(' · ')[0]; (groups[g] ||= []).push(i); });
  if (!Object.keys(groups).length) nav.innerHTML = '<div class="empty">No formula matches.</div>';
  const nd = TOPICS.filter(x => done.has(x.id)).length;
  $('progress').innerHTML = `${nd} / ${TOPICS.length} checks passed<div class="bar"><i style="width:${nd / TOPICS.length * 100}%"></i></div>`;
  for (const [g, idx] of Object.entries(groups)) {
    const d = document.createElement('div'); d.className = 'group';
    d.innerHTML = `<h3>${g}</h3><div class="list"></div>`;
    for (const i of idx) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'topic' + (done.has(TOPICS[i].id) ? ' done' : '');
      b.innerHTML = `<span class="dot"></span>${TOPICS[i].title}`;
      if (i === cur) b.setAttribute('aria-current', 'true');
      b.onclick = () => select(i);
      d.querySelector('.list').appendChild(b);
    }
    nav.appendChild(d);
  }
}
function select(i) {
  cur = (i + TOPICS.length) % TOPICS.length;

  $('title').textContent = tp.title; $('subject').textContent = tp.subject;
  tex(tp.tex, $('formula'), true); $('blurb').textContent = tp.blurb;
  const ctl = $('controls'); ctl.innerHTML = '';
  for (const ct of tp.controls) {
    const d = document.createElement('div'); d.className = 'ctl';

    d.innerHTML = `<label for="c-${ct.k}">${ct.label}<b id="v-${ct.k}">${v}${ct.unit}</b></label><input type="range" id="c-${ct.k}" min="${ct.min}" max="${ct.max}" step="${ct.step}" value="${v}">`;
    d.querySelector('input').oninput = e => { params[tp.id][ct.k] = +e.target.value; $('v-' + ct.k).textContent = e.target.value + ct.unit; updateReadout(); };
    ctl.appendChild(d);
  }
  const ul = $('insights'); ul.innerHTML = '';
  for (const s of tp.insights) { const li = document.createElement('li'); richText(s, li); ul.appendChild(li); }
  $('tryit').textContent = tp.tryit;
  $('q').textContent = tp.quiz.q; $('why').textContent = '';
  const opts = $('opts'); opts.innerHTML = '';
  tp.quiz.opts.forEach((o, j) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = o;
    b.onclick = () => {
      [...opts.children].forEach((x, k) => { x.disabled = true; if (k === tp.quiz.a) x.classList.add('right'); });
      if (j !== tp.quiz.a) b.classList.add('wrong');
      $('why').textContent = (j === tp.quiz.a ? '✓ Right. ' : '✗ Not quite. ') + tp.quiz.why;
      if (j === tp.quiz.a) { done.add(tp.id); try { localStorage.setItem('fi-done', JSON.stringify([...done])); } catch (e) {} buildNav(); }
    };
    opts.appendChild(b);
  });
  if (tp.id === 'gas') { gasState.parts = []; gasState.P = null; gasState.acc = 0; gasState.accT = 0; gasState.T = params.gas.T; }
  buildNav(); updateReadout();
}
$('search').oninput = buildNav;
$('prev').onclick = () => select(cur - 1);
$('next').onclick = () => select(cur + 1);
$('themeBtn').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

// ---------- canvas loop ----------
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, last = performance.now(), roTick = 0;
function fit() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; cv.width = Math.round(W * d); cv.height = Math.round(H * d); ctx.setTransform(d, 0, 0, d, 0, 0); }
new ResizeObserver(fit).observe($('stage'));
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  const t = now / 1000, tp = TOPICS[cur], p = params[tp.id];
  readColors();
  ctx.clearRect(0, 0, W, H);
  if (W > 0) tp.draw(ctx, W, H, p, t, dt);
  if (++roTick % 6 === 0) updateReadout();
  requestAnimationFrame(frame);
}
function updateReadout() {
  const tp = TOPICS[cur], rows = tp.readout(params[tp.id], performance.now() / 1000);
  $('readout').innerHTML = rows.map(([k, v]) => `<span class="pill"><i>${k}:</i> ${v}</span>`).join('');
}
function start() { buildNav(); select(cur); fit(); requestAnimationFrame(frame); }
if (document.readyState === 'complete') start(); else addEventListener('load', start);
</script>
</body>
