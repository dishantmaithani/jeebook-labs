<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cytoclash</title>
<style>
:root{--bg:#06191c;--panel:#0f2a2f;--panel2:#15373e;--line:#2a5a62;--text:#e6f6f3;--muted:#8fb5b0;--atp:#ffd34d;--aa:#5fe08a;--evo:#c79bff;--bad:#ff5f6d;--accent:#4fd1c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;display:flex;gap:8px;padding:10px 12px;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
#top,#bhud{top:0;align-items:center;flex-wrap:wrap}
#bottom,#tray{bottom:0;justify-content:center;flex-wrap:wrap}
.chip{background:rgba(8,28,32,.88);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
.chip small{color:var(--muted);font-weight:500}
.ico{width:20px;height:20px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.ico.atp{background:var(--atp)}.ico.aa{background:var(--aa)}.ico.evo{background:var(--evo)}.ico.pol{background:#7ec8ff}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:9px 15px;font-weight:700;color:#06201f;background:var(--accent);box-shadow:0 3px 0 #2a8f86}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a8f86}
button.sec{background:var(--panel2);color:var(--text);box-shadow:0 3px 0 #071518;border:1px solid var(--line)}
button.red{background:var(--bad);color:#fff;box-shadow:0 3px 0 #a3303b}
button:disabled{opacity:.45;cursor:not-allowed}
.big{font-size:16px;padding:12px 20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:780px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.sheet h2{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:10px}
.sheet h2 .x{margin-left:auto}
.sheet p.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;cursor:pointer;position:relative}
.card.locked{opacity:.45;cursor:not-allowed}
.card canvas{width:72px;height:72px}
.card b{font-size:14px}
.card .d{font-size:11.5px;color:var(--muted);min-height:30px}
.card .n{position:absolute;top:8px;right:10px;font-size:12px;color:var(--muted)}
.cost{display:inline-flex;gap:5px;align-items:center;font-weight:700;font-size:13px}
.cost .ico{width:14px;height:14px}
.no{color:var(--bad)!important}
.stats{font-size:11.5px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
#info{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:none;z-index:6;width:min(460px,calc(100% - 24px))}
#info h3{margin:0;font-size:16px}
#info .stats{margin:6px 0 10px;font-size:12.5px}
#info .btns{display:flex;gap:8px;flex-wrap:wrap}
.prog{height:8px;background:#0007;border-radius:4px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--accent)}
#placebar{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;z-index:6;font-weight:700;white-space:nowrap}
#bhud,#tray{display:none}
#bhud .mid{flex:1;text-align:center;font-weight:800;font-size:20px;text-shadow:0 2px 0 #000}
#bTime{display:inline-block}
#bhud .mid small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stars{color:#555;font-size:20px;letter-spacing:2px}
.stars b{color:#ffd34d}
.ucard{background:rgba(15,42,47,.92);border:2px solid var(--line);border-radius:14px;padding:6px 8px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:66px;font-weight:800;font-size:13px}
.ucard canvas{width:48px;height:48px}
.ucard.sel{border-color:#ffd34d;background:#2a4a2f}
.ucard.empty{opacity:.35}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.cnt{display:flex;align-items:center;gap:8px}
.cnt button{padding:4px 12px}
.help li{margin:6px 0;color:var(--text);font-size:14px}
.help b{color:var(--accent)}
.res{font-size:44px;text-align:center;letter-spacing:6px;margin:6px 0}
.res b{color:#ffd34d}.res span{color:#3a4a4d}
.res b{display:inline-block;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}
.res b:nth-child(2){animation-delay:.25s}.res b:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.modal.on .sheet{animation:popIn .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
button{transition:filter .15s,transform .08s}
button:hover:not(:disabled){filter:brightness(1.12)}
.card{transition:transform .15s,border-color .15s}
.card:not(.locked):hover{transform:translateY(-3px);border-color:var(--accent)}
.ucard{transition:transform .12s}.ucard.sel{transform:translateY(-6px)}
.snd{padding:8px 11px;min-width:40px}
.snd.off{opacity:.4;text-decoration:line-through}
#info,#placebar{animation:slideUp .2s ease-out}
@keyframes slideUp{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;font-weight:900;font-size:clamp(28px,6vw,56px);color:#fff;text-shadow:0 4px 0 #000,0 0 30px rgba(127,247,224,.6);opacity:0;white-space:nowrap;text-align:center}
#banner small{white-space:normal;display:block;font-size:.4em;color:var(--muted);text-shadow:0 2px 0 #000}
#banner.go{animation:bannerAnim 1.8s ease-out}
@keyframes bannerAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
#bTime.low{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.chip.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.15)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="hud">
  <div class="chip"><span class="ico atp"></span><span id="atp">0</span><small>/ <span id="atpMax"></span> ATP</small></div>
  <div class="chip"><span class="ico aa"></span><span id="aa">0</span><small>/ <span id="aaMax"></span> Amino</small></div>
  <div class="chip"><span class="ico evo"></span><span id="evo">0</span><small>Evo</small></div>
  <div class="chip"><span class="ico pol"></span><span id="pol">2/2</span><small>Polymerases</small></div>
  <div class="chip" id="raidChip" style="cursor:pointer" title="Defense log"><span class="ico" id="raidIco" style="background:#ff5f6d"></span><span id="raidT">—</span><small id="raidL">next infection</small></div>
  <div style="flex:1"></div>
  <button class="sec snd" data-snd="music" title="Music">♪</button>
  <button class="sec snd" data-snd="sfx" title="Sound effects">🔊</button>
  <button class="sec" id="helpBtn">?</button>
</div>
<div id="bottom" class="hud">
  <button class="big sec" id="btnBuild">Build</button>
  <button class="big sec" id="btnArmy">Army <span id="armyCount"></span></button>
  <button class="big red" id="btnAttack">Attack!</button>
</div>

<div id="bhud" class="hud">
  <div class="chip"><span id="eName">Colony</span></div>
  <div class="chip"><span class="ico atp"></span><span id="lAtp">0</span><small>+<span id="gAtp">0</span></small></div>
  <div class="chip"><span class="ico aa"></span><span id="lAa">0</span><small>+<span id="gAa">0</span></small></div>
  <div class="mid"><span id="bTime">2:30</span><small id="bSub">Tap outside the red zone to deploy</small></div>
  <div class="chip"><span id="bPct">0%</span><span class="stars" id="bStars"></span></div>
  <button class="sec" id="btnNext">Next</button>
  <button class="sec snd" data-snd="music" title="Music">♪</button>
  <button class="sec snd" data-snd="sfx" title="Sound effects">🔊</button>
  <button class="red" id="btnEnd">Retreat</button>
</div>
<div id="banner"></div>
<div id="tray" class="hud"></div>

<div id="info"></div>
<div id="placebar"><span id="placeName"></span><button id="placeOk">Place</button><button class="sec" id="placeCancel">Done</button></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
'use strict';
// ---------- constants & data ----------
const GRID=26, WALLCOST=10, BUILDERS=2, SAVE='cytoclash_v1', TAU=Math.PI*2, BATTLE_TIME=150;
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>{n=Math.floor(n);return n>=100000?(n/1000).toFixed(0)+'k':n>=10000?(n/1000).toFixed(1)+'k':String(n)};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'};
const costHTML=(c,check=true)=>!c?'':Object.entries(c).map(([k,v])=>`<span class="cost ${check&&state.res[k]<v?'no':''}"><span class="ico ${k}"></span>${fmt(v)}</span>`).join(' ');

const MAXLV=6; // highest Nucleus level
const B={
 nucleus:{name:'Nucleus',size:3,desc:'Holds your DNA. Upgrade it to unlock more and stronger organelles.',hp:[1800,2700,3800,4800,5800,6800],cost:[null,{atp:1500},{atp:4500},{atp:10000},{atp:20000},{atp:40000}],time:[0,40,90,150,240,360]},
 mito:{name:'Mitochondrion',size:2,desc:'Burns sugar into ATP. Tap to collect.',hp:[260,340,480,600,720,840],cost:[{aa:100},{aa:350},{aa:1000},{aa:2200},{aa:4500},{aa:8000}],time:[5,15,35,60,90,140],prod:{res:'atp',rate:[1.5,2.5,4,6,8.5,12],cap:[250,500,1000,1800,2800,4000]}},
 ribo:{name:'Ribosome',size:2,desc:'Translates mRNA into Amino Acids. Tap to collect.',hp:[260,340,480,600,720,840],cost:[{atp:100},{atp:350},{atp:1000},{atp:2200},{atp:4500},{atp:8000}],time:[5,15,35,60,90,140],prod:{res:'aa',rate:[1.5,2.5,4,6,8.5,12],cap:[250,500,1000,1800,2800,4000]}},
 atpstore:{name:'ATP Vacuole',size:2,desc:'Stores ATP.',hp:[450,650,1000,1250,1500,1750],cost:[{aa:200},{aa:600},{aa:1600},{aa:3500},{aa:7000},{aa:12000}],time:[8,20,40,70,110,160],store:{res:'atp',cap:[1500,3500,8000,15000,25000,40000]}},
 aastore:{name:'Amino Vesicle',size:2,desc:'Stores Amino Acids.',hp:[450,650,1000,1250,1500,1750],cost:[{atp:200},{atp:600},{atp:1600},{atp:3500},{atp:7000},{atp:12000}],time:[8,20,40,70,110,160],store:{res:'aa',cap:[1500,3500,8000,15000,25000,40000]}},
 lyso:{name:'Lysosome',size:2,desc:'Spits digestive enzymes at single invaders.',hp:[450,600,1000,1150,1300,1450],cost:[{atp:250},{atp:800},{atp:2200},{atp:4500},{atp:8500},{atp:14000}],time:[8,20,45,75,120,180],def:{range:5.5,dmg:[20,28,50,54,58,64],rate:.7,splash:0,speed:10}},
 burst:{name:'Cytokine Pod',size:2,desc:'Lobs signal bursts that hit whole groups.',hp:[500,680,1050,1200,1350,1500],cost:[{atp:900},{atp:2200},{atp:5000},{atp:9000},{atp:15000},{atp:24000}],time:[15,30,60,90,140,200],def:{range:4.5,dmg:[24,34,62,66,70,76],rate:2,splash:1.3,speed:6}},
 perox:{name:'Peroxisome',size:2,off:3,desc:'Locks a peroxide beam onto one invader — it burns hotter the longer it holds. Hits flyers.',hp:[950,1150,1350],cost:[{atp:6000},{atp:11000},{atp:18000}],time:[90,150,220],def:{range:5,dmg:[26,32,38],beam:true,ramp:3,rampMul:4}},
 membrane:{name:'Membrane',size:1,desc:'Lipid bilayer wall. Invaders must chew through.',hp:[300,550,900,1100,1300,1500],cost:[{atp:25},{atp:200},{atp:700},{atp:1500},{atp:3000},{atp:6000}],time:[0,0,0,0,0,0]},
 chamber:{name:'Replication Chamber',size:3,desc:'Houses the microbes you replicate for raids.',hp:[550,750,1050,1300,1550,1800],cost:[{aa:250},{aa:900},{aa:2500},{aa:5000},{aa:9000},{aa:15000}],time:[10,25,50,80,120,180],housing:[20,30,35,45,55,65]},
 lab:{name:'Gene Lab',size:3,off:1,desc:'Edits microbe DNA — research makes each microbe stronger.',hp:[500,650,850,1000,1200],cost:[{atp:500},{atp:1500},{atp:4000},{atp:8000},{atp:15000}],time:[15,40,80,130,200]},
};
const SHOP=['mito','ribo','atpstore','aastore','lyso','burst','perox','membrane','chamber','lab'];
const LIMITS={nucleus:[1,1,1,1,1,1],mito:[2,3,4,5,6,6],ribo:[2,3,4,5,6,6],atpstore:[1,2,3,3,4,4],aastore:[1,2,3,3,4,4],lyso:[2,3,4,5,5,6],burst:[0,1,2,2,3,3],perox:[0,0,0,1,1,2],membrane:[30,60,90,120,150,180],chamber:[1,1,2,2,2,2],lab:[0,1,1,1,1,1]};
const U={
 phage:{name:'Phage',desc:'Cheap, fast swarmer. Attacks the nearest organelle.',hp:48,dmg:8,rate:.9,range:.55,speed:1.7,space:1,cost:25,nuc:1},
 flag:{name:'Flagellate',desc:'Fires toxin darts from range. Fragile.',hp:28,dmg:6.5,rate:1,range:2.2,speed:1.4,space:1,cost:45,nuc:1},
 spiro:{name:'Spirochete',desc:'Corkscrews into membranes and bursts them open.',hp:45,dmg:200,rate:1,range:.5,speed:2.1,space:2,cost:70,nuc:1,pref:'wall'},
 virion:{name:'Virion',desc:'Hijacks resource organelles — double damage to storages, collectors & nucleus.',hp:36,dmg:9,rate:.8,range:.5,speed:2,space:1,cost:30,nuc:1,pref:'res',bonus:2},
 amoeba:{name:'Amoeba',desc:'Huge and tough. Engulfs defenses first.',hp:700,dmg:34,rate:1.4,range:.6,speed:.75,space:5,cost:160,nuc:2,pref:'def'},
 myxo:{name:'Myxobacteria',desc:'Wolf-pack predator swarm. Its bites splash onto nearby organelles.',hp:200,dmg:26,rate:1.2,range:.6,speed:1.2,space:3,cost:90,nuc:2,splash:1.1},
 spore:{name:'Fungal Spore',desc:'Drifts OVER membranes and rains spores on defenses. Cytokine Pods can\'t hit it.',hp:280,dmg:55,rate:2.5,range:.4,speed:.7,space:5,cost:180,nuc:2,pref:'def',fly:true,splash:1.3},
 stem:{name:'Stem Cell',desc:'Floats above the fight and regenerates nearby microbes. Doesn\'t attack.',hp:260,dmg:0,heal:28,rate:1,range:2,speed:1.1,space:6,cost:220,nuc:3,fly:true},
 plasmo:{name:'Plasmodium',desc:'Malaria parasite riding a hijacked red cell. When destroyed it bursts into 4 merozoites.',hp:520,dmg:30,rate:1.2,range:.6,speed:.9,space:8,cost:320,nuc:4,split:'mero',splitN:4},
 prion:{name:'Prion',desc:'A misfolded protein. Its touch jams a defense so it can\'t fire for 3 seconds.',hp:240,dmg:16,rate:1,range:.6,speed:1.5,space:4,cost:240,nuc:5,pref:'def',stun:3},
 mero:{name:'Merozoite',hidden:true,hp:70,dmg:12,rate:.8,range:.5,speed:1.9,space:0,cost:0,nuc:99},
};
const UTYPES=Object.keys(U).filter(k=>!U[k].hidden);
const umul=l=>1+.1*((l||1)-1); // each research level: +10% health & damage
const sv=v=>v<20?Math.round(v*10)/10:Math.round(v); // stat display: keep a decimal on small numbers
// level rules: a building can't out-level the Nucleus (minus its unlock offset)
const levelsOf=t=>B[t].hp.length;
const maxLvlAt=(t,n)=>t==='nucleus'?MAXLV:Math.max(0,Math.min(levelsOf(t),n-(B[t].off||0)));
const needNuc=(t,l)=>l+(B[t].off||0);
const TIER=['126,200,255','255,122,176','255,211,77']; // glow colours for Lv 4 / 5 / 6

// ---------- sound (all synthesized with Web Audio, no files) ----------
const SFX=(()=>{
 let ac=null,master,sfxBus,musBus,nextBar=0,bar=0;
 const pref={music:true,sfx:true};try{Object.assign(pref,JSON.parse(localStorage.getItem('cytoclash_audio')||'{}'))}catch(e){}
 const last={};
 function init(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=ac.createGain();master.gain.value=.6;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
  sfxBus=ac.createGain();sfxBus.connect(master);musBus=ac.createGain();musBus.connect(master);apply();
  // soft echo for music
  const dl=ac.createDelay();dl.delayTime.value=.33;const fb=ac.createGain();fb.gain.value=.35;const lp=ac.createBiquadFilter();lp.frequency.value=1800;
  musBus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);
  nextBar=ac.currentTime+.1;
 }
 function apply(){if(!ac)return;sfxBus.gain.value=pref.sfx?1:0;musBus.gain.value=pref.music?.32:0}
 function toggle(k){pref[k]=!pref[k];try{localStorage.setItem('cytoclash_audio',JSON.stringify(pref))}catch(e){}apply();return pref[k]}
 function tone(o){if(!ac||QUIET)return;const {f=440,f2,type='sine',d=.15,v=.3,at=0,a=.005,bus=sfxBus,q}=o;const t=ac.currentTime+at;
  const os=ac.createOscillator(),g=ac.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let out=os;if(q){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=q;os.connect(fl);out=fl}
  out.connect(g);g.connect(bus);os.start(t);os.stop(t+d+.05)}
 let nb=null;
 function noise(o){if(!ac||QUIET)return;const {d=.2,v=.3,f=1200,f2,type='lowpass',at=0,Q=1}=o;const t=ac.currentTime+at;
  if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type=type;fl.Q.value=Q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
  const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(sfxBus);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
 const thr=(k,ms)=>{const n=performance.now();if(last[k]&&n-last[k]<ms)return false;last[k]=n;return true};
 const r=(a,b)=>a+Math.random()*(b-a);
 const S={
  tap(){tone({f:520,f2:780,d:.07,v:.12,type:'triangle'})},
  pop(){tone({f:r(500,700),f2:r(1100,1400),d:.09,v:.18})},
  error(){tone({f:180,f2:120,d:.18,v:.16,type:'square',q:900})},
  collect(res){const base=res==='atp'?660:520;[0,4,7,12].forEach((s,i)=>tone({f:base*2**(s/12),d:.18,v:.12,at:i*.05,type:'triangle'}));noise({d:.25,v:.05,f:6000,type:'highpass',at:.05})},
  place(){tone({f:160,f2:70,d:.22,v:.35});noise({d:.12,v:.15,f:800})},
  build(){for(let i=0;i<3;i++){tone({f:900,f2:600,d:.05,v:.1,at:i*.09,type:'square',q:2500})}},
  levelUp(){[0,4,7,11,12].forEach((s,i)=>tone({f:523*2**(s/12),d:.35,v:.12,at:i*.07,type:'triangle'}))},
  deploy(type){if(!thr('dep',45))return;const p={phage:1,flag:1.2,spiro:1.4,virion:1.6,amoeba:.55,myxo:.8,spore:.7,stem:1.1}[type]||1;tone({f:300*p,f2:900*p,d:.1,v:.15});noise({d:.06,v:.05,f:3000*p,type:'bandpass',Q:3})},
  shoot(){if(!thr('shoot',60))return;tone({f:r(700,800),f2:300,d:.09,v:.07,type:'sawtooth',q:2000});noise({d:.06,v:.05,f:2500,type:'bandpass',Q:2})},

  for(let k=0;k<3;k++){c.save();c.rotate(k*TAU/3);c.beginPath();for(let i=0;i<=8;i++){const px=-.24+i*.06,py=i%2?.05:-.05;i?c.lineTo(px,py):c.moveTo(px,py)}c.strokeStyle=['#ff9a3c','#ffc46a','#e0662a'][k];c.lineWidth=.045;c.stroke();c.restore()}break}

// ---------- home interaction ----------
let mode='home', sel=null, ghost=null, drag=null, moving=null, lastWall=null;
const fx=[]; // floating effects for both modes
function fxText(x,y,txt,col,size=.55){fx.push({k:'text',x,y,txt,col,size,life:1.2,max:1.2})}
function sparkle(x,y,col,n=10,sp=2){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(.5,sp);fx.push({k:'frag',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(.04,.1),col,life:.7,max:.7})}}
let shake=0;const addShake=v=>{shake=Math.min(1.2,shake+v)};
const bounce=b=>{b._bt=gt};
function bounceScale(b){if(b._bt==null)return 1;const k=(gt-b._bt)/.45;if(k>=1)return 1;return 1+.16*Math.sin(k*Math.PI*2)*(1-k)}
function banner(html){const el=$('#banner');el.innerHTML=html;el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}
function chipPos(id){const el=$(id);if(!el)return null;const r=el.closest('.chip').getBoundingClientRect();return {x:(r.left+14-OX)/S,y:(r.top+r.height/2-OY)/S,el:el.closest('.chip')}}
function orbs(x,y,res,n){const tp=chipPos(mode==='battle'?(res==='atp'?'#gAtp':'#gAa'):'#'+res);if(!tp)return;
 for(let i=0;i<n;i++)fx.push({k:'orb',sx:x+rnd(-.4,.4),sy:y+rnd(-.4,.4),tx:tp.x,ty:tp.y,x,y,col:res==='atp'?'#ffd34d':'#5fe08a',life:.75+i*.04,max:.75+i*.04,chip:tp.el})}
function rectsOverlap(ax,ay,as,bx,by,bs){return ax<bx+bs&&bx<ax+as&&ay<by+bs&&by<ay+as}
function canPlace(type,x,y,exId){const s=B[type].size;if(x<0||y<0||x+s>GRID||y+s>GRID)return false;return !state.buildings.some(b=>b.id!==exId&&rectsOverlap(x,y,s,b.x,b.y,B[b.type].size))}
function buildingAt(tx,ty,list){for(let i=list.length-1;i>=0;i--){const b=list[i],s=B[b.type].size;if(!b.dead&&tx>=b.x&&ty>=b.y&&tx<b.x+s&&ty<b.y+s)return b}return null}
function findFree(type,px,py){const s=B[type].size;let best=null,bd=1e9;for(let y=0;y<=GRID-s;y++)for(let x=0;x<=GRID-s;x++){if(!canPlace(type,x,y))continue;const d=Math.hypot(x+s/2-px,y+s/2-py);if(d<bd){bd=d;best={x,y}}}return best}

function canBuildNew(type,silent){
 const d=B[type];let why='';
 if(count(type)>=limit(type))why=limit(type)===0?`Unlocks at Nucleus Lv ${LIMITS[type].findIndex(v=>v>0)+1}`:`Limit reached — upgrade the Nucleus`;
 else if(!canPay(d.cost[0]))why='Not enough resources';
 else if(d.time[0]>0&&busy()>=BUILDERS)why='All Polymerases are busy';
 if(why&&!silent)toast(why);return !why;
}
function startPlace(type,near){
 if(!canBuildNew(type))return false;
 const pos=near&&canPlace(type,near.x,near.y)?near:findFree(type,near?near.x:GRID/2,near?near.y:GRID/2);
 if(!pos){toast('No free space');return false}
 ghost={type,x:pos.x,y:pos.y};select(null);updatePlacebar();return true;
}
function confirmPlace(){
 if(!ghost)return;const {type,x,y}=ghost,d=B[type];
 if(!canPlace(type,x,y)){toast('Can\'t place there');return}
 if(!canBuildNew(type))return;
 pay(d.cost[0]);const b={id:state.nid++,type,x,y,lvl:0,stored:0,upg:null};
 if(d.time[0]>0)b.upg={to:1,end:Date.now()+d.time[0]*1000,dur:d.time[0]};else b.lvl=1;
 state.buildings.push(b);save();Snd.place();bounce(b);const s0=d.size;sparkle(x+s0/2,y+s0/2,'#bfeee8',s0>1?12:4,1.5);if(s0>1)addShake(.25);
 if(type==='membrane'){
  const dir=lastWall?{x:x-lastWall.x,y:y-lastWall.y}:{x:1,y:0};lastWall={x,y};
  const opts=[[dir.x,dir.y],[1,0],[0,1],[-1,0],[0,-1]].map(([dx,dy])=>({x:x+dx,y:y+dy})).filter(p=>Math.abs(p.x-x)+Math.abs(p.y-y)===1);
  const nx=opts.find(p=>canPlace('membrane',p.x,p.y));
  if(nx&&canBuildNew('membrane',true)){ghost={type,x:nx.x,y:nx.y};updatePlacebar();return}
 }
 ghost=null;lastWall=null;updatePlacebar();
}
function updatePlacebar(){
 const pb=$('#placebar');if(!ghost){pb.style.display='none';return}
 pb.style.display='flex';const d=B[ghost.type];
 $('#placeName').innerHTML=`${d.name} ${costHTML(d.cost[0])}`;
 $('#placeCancel').textContent=ghost.type==='membrane'?'Done':'Cancel';
}
$('#placeOk').onclick=confirmPlace;
$('#placeCancel').onclick=()=>{ghost=null;lastWall=null;updatePlacebar()};

function select(b){sel=b;renderInfo()}
function collect(b){
 const p=B[b.type].prod;if(!p||b.stored<1)return false;const amt=Math.floor(b.stored),got=addRes(p.res,amt);b.stored-=got;
 const s=B[b.type].size;fxText(b.x+s/2,b.y,got>0?'+'+got:'Storage full',p.res==='atp'?'#ffd34d':'#5fe08a');
 bounce(b);if(got>0){Snd.collect(p.res);orbs(b.x+s/2,b.y+s/2,p.res,Math.min(10,3+Math.floor(got/40)))}
 if(got<amt)toast('Storage full — build or upgrade storage');save();return true;
}
function upgrade(b){
 const d=B[b.type],to=b.lvl+1;
 if(b.upg||to>levelsOf(b.type))return;
 if(to>maxLvl(b.type)){toast(`Requires Nucleus Lv ${needNuc(b.type,to)}`);return}
 if(b.type==='lab'&&state.research){toast('Wait for the current research to finish');return}
 if(!canPay(d.cost[to-1])){toast('Not enough resources');return}
 if(d.time[to-1]>0&&busy()>=BUILDERS){toast('All Polymerases are busy');return}
 pay(d.cost[to-1]);if(d.time[to-1]>0){b.upg={to,end:Date.now()+d.time[to-1]*1000,dur:d.time[to-1]};Snd.build()}else{b.lvl=to;Snd.levelUp();sparkle(b.x+.5,b.y+.5,'#7ff7e0',6,1.2)}
 bounce(b);save();renderInfo();
}
function statLines(type,lvl){
 const d=B[type],i=lvl-1,L=[`Health ${d.hp[i]}`];
 if(d.prod)L.push(`Makes ${Math.round(d.prod.rate[i]*60)} ${d.prod.res==='atp'?'ATP':'Amino'}/min, holds ${d.prod.cap[i]}`);
 if(d.store)L.push(`Stores ${fmt(d.store.cap[i])} ${d.store.res==='atp'?'ATP':'Amino'}`);
 if(d.def)L.push(d.def.beam?`Beam ${d.def.dmg[i]}/s heating up to ${d.def.dmg[i]*d.def.rampMul}/s, range ${d.def.range}, hits flyers`:`Damage ${d.def.dmg[i]} every ${d.def.rate}s, range ${d.def.range}${d.def.splash?', splash, ground only':''}`);
 if(type==='lab')L.push(`Researches microbes up to Lv ${Math.min(MAXLV,lvl+1)}`);
 if(d.housing)L.push(`Houses ${d.housing[i]} microbe space`);
 if(type==='nucleus')L.push(`Stores 1000 of each resource`);
 return L.join(' · ');
}
function renderInfo(){
 const el=$('#info');if(!sel||mode!=='home'){el.style.display='none';return}
 const b=sel,d=B[b.type],to=b.lvl+1;
 let h=`<h3>${d.name} <span style="color:var(--muted);font-weight:500">Lv ${b.lvl}</span></h3><div class="stats">${b.lvl>0?statLines(b.type,b.lvl):d.desc}</div>`;
 let btns='';
 if(b.upg){const left=(b.upg.end-Date.now())/1000;h+=`<div class="stats">${b.lvl===0?'Building':'Upgrading to Lv '+b.upg.to}… ${fmtT(left)}</div><div class="prog"><i style="width:${clamp(100*(1-left/b.upg.dur),0,100)}%"></i></div>`}
 else if(to<=levelsOf(b.type)){
  const lock=to>maxLvl(b.type),labBusy=b.type==='lab'&&state.research;
  btns+=`<button id="iUp" ${lock||labBusy?'disabled':''}>${lock?`Needs Nucleus Lv ${needNuc(b.type,to)}`:labBusy?'Lab is researching':`Upgrade to Lv ${to} &nbsp;${costHTML(d.cost[to-1])}`}</button>`;
  if(!lock)h+=`<div class="stats" style="margin-top:-4px">Next: ${statLines(b.type,to)}${d.time[to-1]?' · '+fmtT(d.time[to-1]):''}</div>`;
  if(b.type==='nucleus')h+=`<div class="stats" style="margin-top:-4px;color:#7ff7e0">Lv ${to} unlocks: ${unlockText(to)}</div>`;
 } else btns+=`<button disabled>Max level</button>`;
 if(b.type==='lab'&&b.lvl>0){const r=state.research;if(r)h+=`<div class="stats">Researching ${U[r.unit].name} → Lv ${r.to} · ${fmtT((r.end-Date.now())/1000)}</div>`;btns=`<button id="iLab">🧬 Research</button>`+btns}
 if(d.prod&&b.lvl>0)btns+=`<button class="sec" id="iCol">Collect ${Math.floor(b.stored)}</button>`;
 if(b.type==='membrane')btns+=`<button class="sec" id="iDel">Remove</button>`;
 btns+=`<button class="sec" id="iX">Close</button>`;
 el.innerHTML=h+`<div class="btns">${btns}</div>`;el.style.display='block';
 const up=$('#iUp');if(up)up.onclick=()=>upgrade(b);
 const lb=$('#iLab');if(lb)lb.onclick=openLab;
 const co=$('#iCol');if(co)co.onclick=()=>{collect(b);renderInfo()};
 const de=$('#iDel');if(de)de.onclick=()=>{state.buildings=state.buildings.filter(x=>x!==b);select(null);save()};
 $('#iX').onclick=()=>select(null);
}

 if(mode==='battle'){if(bt&&bt.defend)fireStrike(p.x,p.y);else{deployHold=0;tryDeploy(p.x,p.y,true)}return}
 const tx=Math.floor(p.x),ty=Math.floor(p.y);
 if(ghost){const s=B[ghost.type].size;drag={k:'ghost',ox:p.x-ghost.x,oy:p.y-ghost.y};if(!(p.x>=ghost.x&&p.y>=ghost.y&&p.x<ghost.x+s&&p.y<ghost.y+s)){drag.ox=s/2;drag.oy=s/2;moveGhost(p)}return}
 const b=buildingAt(tx,ty,state.buildings);
 drag=b?{k:'maybe',b,sx:p.x,sy:p.y,ox:p.x-b.x,oy:p.y-b.y}:{k:'none'};
});
function moveGhost(p){const s=B[ghost.type].size;ghost.x=clamp(Math.round(p.x-drag.ox),0,GRID-s);ghost.y=clamp(Math.round(p.y-drag.oy),0,GRID-s)}
cv.addEventListener('pointermove',e=>{
 const p=toWorld(e);if(ptr){ptr.x=p.x;ptr.y=p.y}
 if(mode!=='home'||!drag)return;
 if(drag.k==='ghost')moveGhost(p);
 else if(drag.k==='maybe'&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>.45){drag.k='move';moving={b:drag.b,x:drag.b.x,y:drag.b.y};select(drag.b)}
 if(drag.k==='move'){const s=B[moving.b.type].size;moving.x=clamp(Math.round(p.x-drag.ox),0,GRID-s);moving.y=clamp(Math.round(p.y-drag.oy),0,GRID-s)}
});
function endPtr(){
 ptr=null;if(mode!=='home'||!drag){drag=null;return}
 if(drag.k==='move'){if(canPlace(moving.b.type,moving.x,moving.y,moving.b.id)){moving.b.x=moving.x;moving.b.y=moving.y;save();Snd.place();bounce(moving.b)}else toast('Can\'t place there');moving=null}
 else if(drag.k==='maybe'){const b=drag.b;if(!collect(b)||sel===b){if(sel!==b){Snd.tap();bounce(b)}select(b)}else renderInfo()}
 else if(drag.k==='none'&&sel){select(null)}
 drag=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);

// ---------- gene lab: research makes each microbe type stronger ----------
const labB=()=>state.buildings.find(b=>b.type==='lab');
const ulvl=k=>(state.unitLvl&&state.unitLvl[k])||1;
const maxUnitLvl=()=>{const l=labB();return l&&l.lvl>0?Math.min(MAXLV,l.lvl+1):1};
const resCost=(k,n)=>({aa:Math.round((200+U[k].cost*6)*Math.pow(n-1,1.4)/50)*50});
const resTime=n=>Math.round(20*Math.pow(n-1,1.5));
const labOpen=()=>$('#modal').classList.contains('on')&&$('#labSheet');
function startResearch(k){
 const l=labB(),to=ulvl(k)+1;
 if(!l||l.lvl<1)return toast('Build a Gene Lab first');
 if(l.upg)return toast('The Gene Lab is being upgraded');
 if(state.research)return toast('The lab is already researching');
 if(U[k].nuc>nucLvl())return toast(`${U[k].name} unlocks at Nucleus Lv ${U[k].nuc}`);
 if(to>maxUnitLvl())return toast('Upgrade the Gene Lab to research further');
 const c=resCost(k,to);if(!canPay(c))return toast('Not enough Amino Acids');
 pay(c);state.research={unit:k,to,end:Date.now()+resTime(to)*1000,dur:resTime(to)};save();Snd.build();openLab();
}
function checkResearch(){
 const r=state.research;if(!r||Date.now()<r.end)return;
 state.unitLvl=state.unitLvl||{};state.unitLvl[r.unit]=r.to;state.research=null;save();
 toast(`${U[r.unit].name} evolved to Lv ${r.to}!`,true);Snd.levelUp();
 const l=labB();if(l){bounce(l);const s=B.lab.size;sparkle(l.x+s/2,l.y+s/2,'#7ff7e0',16);fxText(l.x+s/2,l.y,`${U[r.unit].name} Lv ${r.to}`,'#7ff7e0',.5)}
 if(labOpen())openLab();
}
function openLab(){
 const l=labB(),r=state.research,mx=maxUnitLvl();
 let h=`<div id="labSheet"></div><h2>🧬 Gene Lab <button class="sec x" onclick="closeModal()">✕</button></h2><p class="sub">Edit microbe DNA: each level gives <b>+10% health and damage</b>. Gene Lab Lv ${l?l.lvl:0} can research up to Lv ${mx}.</p>`;
 if(r)h+=`<div class="card" style="flex-direction:row;gap:12px;cursor:default;margin-bottom:12px;text-align:left"><span data-tu="${r.unit}"></span><div style="flex:1"><b>Researching ${U[r.unit].name} → Lv ${r.to}</b><div class="prog"><i id="labProg" style="width:0%"></i></div><div class="stats" id="labLeft"></div></div></div>`;
 h+='<div class="grid">';
 for(const k of UTYPES){const u=U[k],cur=ulvl(k),to=cur+1,lockN=u.nuc>nucLvl(),maxed=to>MAXLV,capped=to>mx,m1=umul(cur),m2=umul(to),base=u.heal||u.dmg;
  const btn=lockN?`<button disabled>Nucleus Lv ${u.nuc}</button>`:maxed?`<button disabled>Max level</button>`:capped?`<button disabled>Needs Gene Lab Lv ${to-1}</button>`:r?`<button disabled>Lab busy</button>`:`<button data-r="${k}">${costHTML(resCost(k,to))} · ${fmtT(resTime(to))}</button>`;
  h+=`<div class="card ${lockN?'locked':''}" style="cursor:default"><span class="n">Lv ${cur}</span><span data-tu="${k}"></span><b>${u.name}</b>
   <div class="stats">${maxed?'Fully evolved':`HP ${sv(u.hp*m1)} → <b style="color:#7ff7e0">${sv(u.hp*m2)}</b><br>${u.heal?'Heal':'Dmg'} ${sv(base*m1)} → <b style="color:#7ff7e0">${sv(base*m2)}</b>`}</div>${btn}</div>`}
 openModal(h+'</div>');
 document.querySelectorAll('[data-tu]').forEach(el=>el.replaceWith(thumb('u',el.dataset.tu)));
 document.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>startResearch(el.dataset.r));

function unlockText(n){ // what reaching Nucleus Lv n adds
 const out=[];
 for(const t of SHOP){const a=n>1?LIMITS[t][n-2]:0,b2=LIMITS[t][n-1];if(b2>a&&t!=='membrane')out.push(a===0?`<b>${B[t].name}</b>`:`+${b2-a} ${B[t].name}`)}
 for(const k of UTYPES)if(U[k].nuc===n)out.push(`<b>${U[k].name}</b>`);
 out.push(`Lv ${n} upgrades`);return out.join(', ');
}

let toastT=0;function toast(m,ok){if(!ok)Snd.error();const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,2200)}

// ---------- battle ----------
let bt=null, selUnit=null, deployHold=0;
const matchCost=()=>30*nucLvl();
const NAMES1=['Strepto','Myco','Lacto','Bacillo','Vibrio','Clostri','Entero','Halo','Thermo','Rhizo','Cyano','Proteo'];
const NAMES2=['coccus','bacter','phila','monas','spora','plasma','vorax','genia'];
function genEnemy(L){
 const bs=[],occ=new Uint8Array(GRID*GRID),c=12,cc=c+1;
 const put=(type,x,y,lvl,pad=0)=>{const s=B[type].size;if(x<1||y<1||x+s>GRID-1||y+s>GRID-1)return false;
  for(let yy=y-pad;yy<y+s+pad;yy++)for(let xx=x-pad;xx<x+s+pad;xx++){if(xx<0||yy<0||xx>=GRID||yy>=GRID)continue;if(occ[yy*GRID+xx])return false}
  for(let yy=y;yy<y+s;yy++)for(let xx=x;xx<x+s;xx++)occ[yy*GRID+xx]=1;bs.push({type,x,y,lvl});return true};
 const lv=t=>Math.max(1,maxLvlAt(t,L)-(Math.random()<.4?1:0));
 put('nucleus',c,c,L);
 // inner compound: storages + some defenses packed around the nucleus, ringed by membrane
 const R=L>=4?5:4,inner=['atpstore','aastore','lyso',L>=2?'burst':'lyso'];if(L>=4)inner.push('perox');if(L>=5)inner.push('lyso');
 const corner=(x,y,s)=>Math.min(...[[cc-R+1,cc-R+1],[cc+R-s,cc-R+1],[cc-R+1,cc+R-s],[cc+R-s,cc+R-s]].map(([a,b2])=>Math.max(Math.abs(x-a),Math.abs(y-b2))));
 for(const t of inner){const s=B[t].size,slots=[];
  for(let y=cc-R+1;y<=cc+R-s;y++)for(let x=cc-R+1;x<=cc+R-s;x++)slots.push({x,y,k:corner(x,y,s)+Math.random()*.9});
  slots.sort((a,b2)=>a.k-b2.k);slots.some(p=>put(t,p.x,p.y,lv(t)))}
 for(let i=-R;i<=R;i++){const w=lv('membrane');put('membrane',cc+i,cc-R,w);put('membrane',cc+i,cc+R,w);put('membrane',cc-R,cc+i,w);put('membrane',cc+R,cc+i,w)}
 // everything else the Nucleus level allows goes in the outer ring
 const have={};for(const b of bs)have[b.type]=(have[b.type]||0)+1;
 const outer=[];for(const t of ['chamber','lab','lyso','burst','perox','atpstore','aastore','mito','ribo'])for(let k=have[t]||0;k<LIMITS[t][L-1];k++)outer.push(t);
 for(const t of outer){const s=B[t].size;let done=false;
  for(let pass=0;pass<2&&!done;pass++)for(let tries=0;tries<220&&!done;tries++){const a=Math.random()*TAU,r=rnd(R+2.2,11.8);done=put(t,Math.round(cc+Math.cos(a)*r-s/2),Math.round(cc+Math.sin(a)*r-s/2),lv(t),pass?0:1)}}
 const walled=L>=4?['lyso','burst','perox']:['lyso'];
 if(L>=2)for(const b of bs.filter(b=>walled.includes(b.type)&&Math.max(Math.abs(b.x-cc),Math.abs(b.y-cc))>R)){const w=lv('membrane');for(let i=-1;i<=2;i++){put('membrane',b.x+i,b.y-1,w);put('membrane',b.x+i,b.y+2,w)}put('membrane',b.x-1,b.y,w);put('membrane',b.x-1,b.y+1,w);put('membrane',b.x+2,b.y,w);put('membrane',b.x+2,b.y+1,w)}
 // loot grows faster than linearly so higher-level raids stay worth it
 const sc=L*(1+(L-1)*.35),pool={atp:Math.round(rnd(500,1000)*sc),aa:Math.round(rnd(500,1000)*sc)};
 const W={atpstore:{atp:3},aastore:{aa:3},nucleus:{atp:1.5,aa:1.5},mito:{atp:.4},ribo:{aa:.4}};
 const tot={atp:0,aa:0};for(const b of bs){const w=W[b.type];if(w)for(const r in w)tot[r]+=w[r]}
 for(const b of bs){const w=W[b.type];b.loot={atp:0,aa:0};if(w)for(const r in w)b.loot[r]=pool[r]*w[r]/tot[r]}
 return bs;
}
function findMatch(){
 const cost=matchCost();if(state.res.atp<cost)return toast(`Need ${cost} ATP to search for a colony`);
 state.res.atp-=cost;save();
 const L=clamp(nucLvl()+(Math.random()<.25?1:0)-(Math.random()<.25?1:0),1,MAXLV);
 const bs=genEnemy(L).map((b,i)=>{const hp=B[b.type].hp[b.lvl-1];return {...b,id:i,hp,max:hp,dead:false,cool:rnd(0,1),aim:rnd(0,TAU),tgt:null,lootStart:{...b.loot}}});
 const {occ,nod}=buildOcc(bs);
 const avail={},used={};for(const k of UTYPES){avail[k]=state.army[k]||0;used[k]=0}
 bt={L,name:NAMES1[Math.random()*NAMES1.length|0]+NAMES2[Math.random()*NAMES2.length|0],bs,occ,nod,units:[],proj:[],avail,used,time:BATTLE_TIME,started:false,ended:false,
  total:bs.filter(b=>b.type!=='membrane').length,destroyed:0,nucDead:false,gain:{atp:0,aa:0},flash:0};
 bt.lastStars=0;fx.length=0;selUnit=UTYPES.find(k=>avail[k]>0);setMode('battle');
 Snd.whoosh();banner(`${bt.name}<small>Level ${L} colony · scout, then deploy</small>`);
}
function buildOcc(bs){
 const occ=new Array(GRID*GRID).fill(null),nod=new Uint8Array(GRID*GRID);
 for(const b of bs){const s=B[b.type].size;for(let y=b.y;y<b.y+s;y++)for(let x=b.x;x<b.x+s;x++)occ[y*GRID+x]=b;
  for(let y=b.y-1;y<=b.y+s;y++)for(let x=b.x-1;x<=b.x+s;x++)if(x>=0&&y>=0&&x<GRID&&y<GRID)nod[y*GRID+x]=1}
 return {occ,nod};
}
function spawnUnit(type,x,y,lvl=1){
 const u=U[type],m=umul(lvl);bt.units.push({type,lvl,mul:m,x:x+rnd(-.1,.1),y:y+rnd(-.1,.1),hp:u.hp*m,max:u.hp*m,cool:0,target:null,path:null,pi:0,block:null,ox:rnd(-.22,.22),oy:rnd(-.22,.22),dir:0,anim:rnd(0,9),enemy:!!bt.defend});
}

// ---------- defending: pathogens raid YOUR cell ----------
let QUIET=false; // true while simulating an offline raid (no sound / banners)
const RAID_GAP=()=>rnd(5,9)*60e3;
const strikeDmg=()=>50+25*nucLvl();
function enemyArmy(L){
 const budget=Math.round(Math.min(160,[14,26,42,72,100,128][L-1]+Math.floor(state.evo/25))*((state.log||[]).length?1:.5)),hasWalls=state.buildings.some(b=>b.type==='membrane');
 const W={phage:3,flag:2,virion:2,spiro:hasWalls?1.2:0,amoeba:1.5,myxo:1.5,spore:1,stem:.5,plasmo:1,prion:1};
 const pool=UTYPES.filter(k=>U[k].nuc<=L&&W[k]>0),army=[];let used=0,stems=0;
 for(let guard=0;guard<300&&used<budget;guard++){
  const tot=pool.reduce((a,k)=>a+W[k],0);let r=Math.random()*tot,k=pool[0];for(const p of pool){r-=W[p];if(r<=0){k=p;break}}
  if(k==='stem'&&stems)continue;if(used+U[k].space>budget){if(budget-used<1)break;continue}
  army.push(k);used+=U[k].space;if(k==='stem')stems++}
 return army;
}
function startDefense(quiet){
 const L=clamp(nucLvl()-(Math.random()<.3?1:0),1,MAXLV);
 // only finished organelles take part; storages put a share of your resources at risk
 const live=state.buildings.filter(b=>b.lvl>0);
 const W={atpstore:{atp:3},aastore:{aa:3},nucleus:{atp:1.5,aa:1.5}},tot={atp:0,aa:0};
 for(const b of live){const w=W[b.type];if(w)for(const r in w)tot[r]+=w[r]}
 const bs=live.map((b,i)=>{const hp=B[b.type].hp[b.lvl-1],w=W[b.type],loot={atp:0,aa:0},p=B[b.type].prod;
  if(w)for(const r in w)loot[r]=state.res[r]*.25*w[r]/tot[r];
  if(p)loot[p.res]=(b.stored||0)*.5;
  return {type:b.type,x:b.x,y:b.y,lvl:b.lvl,ref:b,id:i,hp,max:hp,dead:false,cool:rnd(0,1),aim:rnd(0,TAU),tgt:null,loot,lootStart:{...loot}}});
 const {occ,nod}=buildOcc(bs);
 // entry points on the rim, away from organelles
 const rim=[];for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)if((x<2||y<2||x>GRID-3||y>GRID-3)&&!nod[y*GRID+x])rim.push({x,y});
 const anchors=Array.from({length:1+(Math.random()*3|0)},()=>rim[Math.random()*rim.length|0]);
 const order={amoeba:0,plasmo:.5,spiro:1,prion:1.5,spore:2,myxo:2.5,phage:3,flag:3.5,virion:4,stem:5};
 const queue=enemyArmy(L).map(type=>{const a=anchors[Math.random()*anchors.length|0];const near=rim.filter(p=>Math.abs(p.x-a.x)+Math.abs(p.y-a.y)<=3);const p=near[Math.random()*near.length|0]||a;
  return {type,x:p.x+.5,y:p.y+.5,t:order[type]*1.2+rnd(0,2.5),lvl:clamp(L-(Math.random()<.5?1:0),1,MAXLV)}}).sort((a,b)=>a.t-b.t);
 bt={defend:true,L,name:NAMES1[Math.random()*NAMES1.length|0]+NAMES2[Math.random()*NAMES2.length|0],bs,occ,nod,units:[],proj:[],avail:{},used:{},queue,strikes:[],charges:1+nucLvl(),
  time:BATTLE_TIME,elapsed:0,started:true,ended:false,total:bs.filter(b=>b.type!=='membrane').length,destroyed:0,nucDead:false,gain:{atp:0,aa:0},flash:0,lastStars:0,army:queue.length};
 for(const k of UTYPES){bt.avail[k]=0;bt.used[k]=0}
 state.nextRaid=Date.now()+RAID_GAP();save();
 if(quiet){QUIET=true;let n=0;while(!bt.ended&&n++<BATTLE_TIME*20+100)updBattle(.05);QUIET=false;fx.length=0;shake=0;return bt.result}

  const dx=tx-p.x,dy=ty-p.y,dd=Math.hypot(dx,dy),st=p.sp*dt;
  if(dd<=st+.05){p.done=true;
   if(p.tb)dmgB(p.tb,p.dmg);
   else if(p.splash){Snd.splat();addShake(.12);for(const u of bt.units)if(!U[u.type].fly&&Math.hypot(u.x-tx,u.y-ty)<=p.splash)u.hp-=p.dmg;sparkle(tx,ty,'#ff7cf0',8,2);fx.push({k:'ring',x:tx,y:ty,r:p.splash,life:.45,max:.45,col:'#ff7cf0'})}
   else{if(p.tu.hp>0)p.tu.hp-=p.dmg;Snd.zap();fx.push({k:'ring',x:tx,y:ty,r:.2,life:.2,max:.2,col:'#ff8aa2'})}}
  else{p.x+=dx/dd*st;p.y+=dy/dd*st}}
 bt.proj=bt.proj.filter(p=>!p.done);
 for(const u of bt.units)if(u.hp<=0&&!u.gone){u.gone=true;const sd=U[u.type];
  if(sd.split){for(let i=0;i<sd.splitN;i++){const a=i/sd.splitN*TAU+rnd(0,.5);spawnUnit(sd.split,u.x+Math.cos(a)*.35,u.y+Math.sin(a)*.35,u.lvl)}Snd.split();if(!QUIET)fxText(u.x,u.y-.4,'burst!','#b06aff',.42)}
  if(u.type!=='spiro')Snd.die();for(let i=0;i<5;i++){const a=rnd(0,TAU);fx.push({k:'frag',x:u.x,y:u.y,vx:Math.cos(a),vy:Math.sin(a),r:.05,col:'#b0c8ff',life:.5,max:.5})}}
 bt.units=bt.units.filter(u=>u.hp>0);
 const stNow=stars();if(stNow>bt.lastStars){bt.lastStars=stNow;if(!QUIET){const why=stNow===1&&!bt.nucDead?'50% destroyed':bt.nucDead&&stNow<3?'Nucleus destroyed':'Total wipeout!';
  if(bt.defend){Snd.error();banner(`<span style="color:#ff5f6d">Breach! ${'★'.repeat(stNow)}</span><small>${why}</small>`)}else{Snd.star();banner(`<span style="color:#ffd34d">${'★'.repeat(stNow)}</span><small>${why}</small>`)}}}
 const left=bt.defend?bt.queue.filter(q=>!U[q.type].heal).length:UTYPES.reduce((a,k)=>a+(U[k].heal?0:bt.avail[k]),0),fighters=bt.units.filter(u=>!U[u.type].heal).length;
 if(bt.destroyed>=bt.total||(bt.started&&bt.time<=0)||(bt.started&&!fighters&&!left))endBattle();
}
const pct=()=>bt.destroyed>=bt.total?100:Math.floor(100*bt.destroyed/bt.total);
const stars=()=>(pct()>=50)+(bt.nucDead?1:0)+(pct()===100);
function endBattle(){
 if(bt.ended)return;bt.ended=true;
 if(bt.defend)return endDefense();
 if(!bt.started){setMode('home');return}
 const st=stars(),got={atp:addRes('atp',Math.floor(bt.gain.atp)),aa:addRes('aa',Math.floor(bt.gain.aa))};
 for(const k of UTYPES)state.army[k]=Math.max(0,(state.army[k]||0)-bt.used[k]);
 const de=st?st*9+bt.L*2:-Math.min(state.evo,6);state.evo+=de;save();
 setTimeout(()=>st?Snd.win():Snd.lose(),250);
 $('#modal').dataset.lock='1';
 openModal(`<h2 style="justify-content:center">${st?'Victory!':'Defeat'}</h2><div class="res">${'<b>★</b>'.repeat(st)}${'<span>★</span>'.repeat(3-st)}</div>
 <p class="sub" style="text-align:center">${pct()}% of ${bt.name} destroyed</p>
 <div class="row" style="gap:16px;margin:10px 0 16px"><span class="cost"><span class="ico atp"></span>+${fmt(got.atp)}</span><span class="cost"><span class="ico aa"></span>+${fmt(got.aa)}</span><span class="cost"><span class="ico evo"></span>${de>=0?'+':''}${de}</span></div>
 ${got.atp<Math.floor(bt.gain.atp)||got.aa<Math.floor(bt.gain.aa)?'<p class="sub" style="text-align:center">Some loot was lost — your storages were full.</p>':''}

 $('#goHome').onclick=()=>{delete $('#modal').dataset.lock;closeModal();setMode('home')};
}
$('#btnEnd').onclick=()=>{if(!bt.started){bt.ended=true;setMode('home')}else endBattle()};
$('#btnNext').onclick=()=>{if(state.res.atp<matchCost())return toast('Not enough ATP');findMatch()};

// ---------- main loop ----------
let lastTs=performance.now(),saveT=0,uiT=0,gt=0;
function frame(ts){
 const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;gt+=dt;
 if(mode==='home'){produce(dt);const now=Date.now();
  for(const b of state.buildings)if(b.upg&&now>=b.upg.end){b.lvl=b.upg.to;b.upg=null;toast(`${B[b.type].name} reached Lv ${b.lvl}`,true);Snd.levelUp();bounce(b);const s=B[b.type].size;fxText(b.x+s/2,b.y,'Lv '+b.lvl,'#7ff7e0');sparkle(b.x+s/2,b.y+s/2,'#7ff7e0',14);save();if(b.type==='nucleus')banner(`Nucleus Lv ${b.lvl}!<small>Unlocked: ${unlockText(b.lvl)}</small>`)}
  checkResearch();
  saveT+=dt;if(saveT>5){saveT=0;save()}
  if(now>=state.nextRaid&&!shielded()&&!ghost&&!moving&&!drag&&!$('#modal').classList.contains('on')&&document.visibilityState==='visible')raidAlert();}
 else updBattle(dt);
 SFX.music(mode==='battle'&&bt&&!bt.ended);shake=Math.max(0,shake-dt*2.5);
 for(const f of fx){f.life-=dt;if(f.k==='orb'&&f.life<=0&&f.chip&&!f.bumped){f.bumped=1;f.chip.classList.remove('bump');void f.chip.offsetWidth;f.chip.classList.add('bump')}if(f.k==='frag'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}if(f.k==='text')f.y-=dt*.8}
 for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1);
 uiT+=dt;if(uiT>.25){uiT=0;updUI()}
 render();requestAnimationFrame(frame);
}
function updUI(){
 if(mode==='home'){
  $('#atp').textContent=fmt(state.res.atp);$('#atpMax').textContent=fmt(maxRes('atp'));
  $('#aa').textContent=fmt(state.res.aa);$('#aaMax').textContent=fmt(maxRes('aa'));
  $('#evo').textContent=state.evo;{const sh=shielded();$('#raidT').textContent=sh?fmtT(shieldLeft()/1000):isFinite(state.nextRaid)?fmtT((state.nextRaid-Date.now())/1000):'now!';
   $('#raidL').textContent=sh?'shield':'next infection';$('#raidIco').style.background=sh?'#7ec8ff':'#ff5f6d';$('#raidChip').style.borderColor=sh?'#7ec8ff':''}$('#pol').textContent=`${BUILDERS-busy()}/${BUILDERS}`;
  $('#armyCount').textContent=`${armyUsed()}/${housing()}`;$('#btnAttack').innerHTML=`Attack! <small style="opacity:.8">${matchCost()} ATP${shielded()?` · 🛡−${SHIELD_CUT/60e3}m`:''}</small>`;
  if(sel&&(sel.upg||B[sel.type].prod||(sel.type==='lab'&&state.research)))renderInfo();
  updLabProg();
 }else if(bt){
  const lootLeft=r=>bt.bs.reduce((a,b)=>a+(b.loot?b.loot[r]:0),0);
  $('#eName').textContent=bt.defend?`Defending vs ${bt.name} · Lv ${bt.L}`:`${bt.name} · Lv ${bt.L}`;
  for(const id of ['#gAtp','#gAa'])$(id).parentElement.firstChild.textContent=bt.defend?'−':'+';
  $('#lAtp').textContent=fmt(lootLeft('atp'));$('#lAa').textContent=fmt(lootLeft('aa'));
  $('#gAtp').textContent=fmt(bt.gain.atp);$('#gAa').textContent=fmt(bt.gain.aa);
  const t=Math.max(0,Math.ceil(bt.time));$('#bTime').classList.toggle('low',bt.started&&t<=30&&!bt.ended);$('#bTime').textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  $('#bSub').textContent=bt.defend?(bt.queue.length?`${bt.queue.length} more pathogens incoming`:'Hold the line!')+' · tap to fire antibodies':bt.started?'Battle in progress':'Scouting — tap outside the red zone to deploy';
  $('#btnEnd').style.display=bt.defend?'none':'';if(bt.defend)$('#btnNext').style.display='none';
  $('#bPct').textContent=pct()+'%';const s=stars();$('#bStars').innerHTML='<b>★</b>'.repeat(s)+'★'.repeat(3-s);
  if(!bt.started&&!bt.defend){$('#btnNext').style.display='';$('#btnNext').textContent=`Next (${matchCost()} ATP)`;$('#btnEnd').textContent='Go home'}
 }
}
function withScale(b,k,fn){if(k===1)return fn();const s=B[b.type].size,cx=b.x+s/2,cy=b.y+s/2;ctx.save();ctx.translate(cx,cy);ctx.scale(k,2-k);ctx.translate(-cx,-cy);fn();ctx.restore()}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#06191c';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(OX+(Math.random()-.5)*shake*14,OY+(Math.random()-.5)*shake*14);ctx.scale(S,S);
 const battle=mode==='battle'&&bt;drawDish(ctx,battle&&!bt.defend,gt);
 if(!battle&&shielded()){ // shimmering protective bubble around the whole dish
  const p=.5+.5*Math.sin(gt*2),left=shieldLeft();ctx.save();
  ctx.beginPath();ctx.roundRect(.15,.15,GRID-.3,GRID-.3,1.1);ctx.fillStyle=`rgba(126,200,255,${.03+.02*p})`;ctx.fill();
  ctx.lineWidth=.18+.06*p;ctx.strokeStyle=`rgba(126,200,255,${left<60e3?.25+.5*Math.abs(Math.sin(gt*6)):.45+.25*p})`;ctx.shadowColor='#7ec8ff';ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(126,200,255,.07)';ctx.lineWidth=.04;ctx.beginPath();
  for(let y=0;y<GRID;y+=1.5)for(let x=(y/1.5)%2?.75:0;x<GRID;x+=1.5){for(let i=0;i<6;i++){const a=i/6*TAU+Math.PI/6,px=x+Math.cos(a)*.5,py=y+Math.sin(a)*.5;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
  ctx.stroke();
  const sy=(gt*3)%(GRID+4)-2,g=ctx.createLinearGradient(0,sy-1.5,0,sy+1.5);g.addColorStop(0,'rgba(126,200,255,0)');g.addColorStop(.5,'rgba(126,200,255,.10)');g.addColorStop(1,'rgba(126,200,255,0)');
  ctx.beginPath();ctx.roundRect(.15,.15,GRID-.3,GRID-.3,1.1);ctx.clip();ctx.fillStyle=g;ctx.fillRect(0,sy-1.5,GRID,3);ctx.restore();
 }
 if(battle){
  if(!bt.defend){const a=.07+bt.flash*.25;ctx.fillStyle=`rgba(255,60,90,${a})`;
   for(let i=0;i<GRID*GRID;i++)if(bt.nod[i])ctx.fillRect(i%GRID,(i/GRID)|0,1,1)}
  else{const pulse=.06+.04*Math.sin(gt*4);ctx.strokeStyle=`rgba(255,60,90,${pulse*4})`;ctx.lineWidth=.25;ctx.beginPath();ctx.roundRect(.1,.1,GRID-.2,GRID-.2,1.1);ctx.stroke()}
  const wall=(x,y)=>{const o=x>=0&&y>=0&&x<GRID&&y<GRID&&bt.occ[y*GRID+x];return o&&o.type==='membrane'};
  for(const b of bt.bs)if(b.dead)drawB(ctx,b,gt,{dead:true});
  for(const b of bt.bs)if(!b.dead&&b.type==='membrane')drawB(ctx,b,gt,{hasWall:wall});
  const others=bt.bs.filter(b=>!b.dead&&b.type!=='membrane').sort((a,b)=>a.y-b.y);
  for(const b of others)withScale(b,b._hit!=null&&gt-b._hit<.15?1-.06*Math.sin((gt-b._hit)/.15*Math.PI):1,()=>drawB(ctx,b,gt,{aim:b.aim,beam:!!(b.tgt&&b.ramp>0&&!(b.stun>0)),fill:b.lootStart&&(b.lootStart.atp+b.lootStart.aa)>0?(b.loot.atp+b.loot.aa)/(b.lootStart.atp+b.lootStart.aa):.3}));
  for(const b of others)if(b._fire!=null&&gt-b._fire<.12){const c=ctr(b);circ(ctx,c.x+Math.cos(b.aim)*.85,c.y+Math.sin(b.aim)*.85,.18*(1-(gt-b._fire)/.12));ctx.fillStyle=b.type==='burst'?'#ffc4fb':'#fff3c4';ctx.fill()}
  for(const b of bt.bs){if(b.dead||b.hp>=b.max)continue;const s=B[b.type].size,w=Math.max(.7,s*.7),x=b.x+s/2-w/2,y=b.y-.15;ctx.fillStyle='#000b';ctx.fillRect(x,y,w,.12);ctx.fillStyle=b.hp/b.max>.5?'#6dff94':b.hp/b.max>.25?'#ffd34d':'#ff5f6d';ctx.fillRect(x,y,w*b.hp/b.max,.12)}
  for(const u of bt.units)drawU(ctx,u,gt);
  for(const b of others){
   if(b.stun>0){const c=ctr(b);ctx.save();ctx.translate(c.x,c.y-.75);ctx.rotate(gt*5);ctx.strokeStyle='#ff9a3c';ctx.lineWidth=.05;ctx.beginPath();for(let i=0;i<=24;i++){const a=i/24*TAU*1.6,r=.04+i*.011;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.stroke();ctx.restore()}
   const D=B[b.type].def;if(!D||!D.beam||!b.tgt||b.tgt.hp<=0||b.stun>0)continue;
   const c=ctr(b),k=Math.min(1,(b.ramp||0)/D.ramp),tx=b.tgt.x,ty=b.tgt.y-(U[b.tgt.type].fly?.4:0);
   ctx.save();ctx.lineCap='round';ctx.strokeStyle=`rgba(220,255,140,${.25+.35*k})`;ctx.lineWidth=.1+.22*k;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(tx,ty);ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=.035+.04*k;ctx.stroke();ctx.restore();
   if(Math.random()<.4)fx.push({k:'frag',x:tx,y:ty,vx:rnd(-1.2,1.2),vy:rnd(-1.2,1.2),r:.04,col:'#e8ff9a',life:.3,max:.3})}
  if(bt.defend)for(const s of bt.strikes){if(s.done)continue;const k=1-s.t/s.max;
   circ(ctx,s.x,s.y,1.9);ctx.strokeStyle=`rgba(126,200,255,${.3+.5*k})`;ctx.lineWidth=.06;ctx.setLineDash([.3,.2]);ctx.stroke();ctx.setLineDash([]);
   for(let i=0;i<6;i++){const a=i/6*TAU+gt,r=1.6*(1-k);drawAntibody(ctx,s.x+Math.cos(a)*r,s.y+Math.sin(a)*r-(1-k)*2,.22,a+Math.PI/2)}}
  for(const p of bt.proj){ctx.fillStyle=p.k==='burst'?'#ff7cf0':p.k==='dart'?'#9dffb4':'#ffb0c4';circ(ctx,p.x,p.y,p.k==='burst'?.16:p.k==='dart'?.06:.1);ctx.fill()}
 }else{
  const wset=new Set(state.buildings.filter(b=>b.type==='membrane'&&(!moving||moving.b!==b)).map(b=>b.x+','+b.y));
  const wall=(x,y)=>wset.has(x+','+y);
  const fillOf=b=>{const st=B[b.type].store;return st?state.res[st.res]/maxRes(st.res):.5};
  const list=state.buildings.filter(b=>!moving||moving.b!==b);
  for(const b of list)if(b.type==='membrane')withScale(b,bounceScale(b),()=>drawB(ctx,b,gt,{hasWall:wall,alpha:b===sel?1:.97}));
  for(const b of list.filter(b=>b.type!=='membrane').sort((a,b)=>a.y-b.y)){
   const s=B[b.type].size;
   if(b===sel){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=.07;ctx.setLineDash([.25,.15]);ctx.strokeRect(b.x+.05,b.y+.05,s-.1,s-.1);ctx.setLineDash([])}
   withScale(b,bounceScale(b),()=>drawB(ctx,b,gt,{alpha:b.lvl===0?.5:1,fill:fillOf(b),research:b.type==='lab'&&!!state.research}));
   if(b.upg){const pr=clamp(1-(b.upg.end-Date.now())/1000/b.upg.dur,0,1);ctx.fillStyle='#000b';ctx.fillRect(b.x+.2,b.y-.1,s-.4,.16);ctx.fillStyle='#4fd1c5';ctx.fillRect(b.x+.2,b.y-.1,(s-.4)*pr,.16);
    ctx.save();ctx.translate(b.x+s-.3,b.y+.3);ctx.rotate(gt*2);ctx.strokeStyle='#7ff7e0';ctx.lineWidth=.06;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(i/6*TAU)*.2,Math.sin(i/6*TAU)*.2);ctx.stroke()}ctx.restore()}
   const p=B[b.type].prod;
   if(p&&b.lvl>0&&b.stored>=Math.max(5,p.cap[b.lvl-1]*.08)){const bx=b.x+s/2,by=b.y-.05+Math.sin(gt*3+b.x)*.1;circ(ctx,bx,by,.3);ctx.fillStyle='#0a2427';ctx.fill();ctx.lineWidth=.05;ctx.strokeStyle='#fff';ctx.stroke();circ(ctx,bx,by,.19);ctx.fillStyle=p.res==='atp'?'#ffd34d':'#5fe08a';ctx.fill()}
  }
  if(sel&&sel.type==='membrane'){ctx.strokeStyle='#fff';ctx.lineWidth=.06;ctx.strokeRect(sel.x+.05,sel.y+.05,.9,.9)}
  const g=moving?{type:moving.b.type,x:moving.x,y:moving.y,lvl:moving.b.lvl,ex:moving.b.id}:ghost?{type:ghost.type,x:ghost.x,y:ghost.y,lvl:1}:null;
  if(g){const s=B[g.type].size,ok=canPlace(g.type,g.x,g.y,g.ex);ctx.fillStyle=ok?'rgba(80,255,160,.25)':'rgba(255,60,90,.35)';ctx.fillRect(g.x,g.y,s,s);drawB(ctx,g,gt,{alpha:.8,fill:.5,hasWall:wall})}
  // defense range for selected defense
  if(sel&&B[sel.type].def&&sel.lvl>0){const c=ctr(sel);circ(ctx,c.x,c.y,B[sel.type].def.range);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=.05;ctx.stroke()}
 }
 for(const f of fx){const a=f.life/f.max;
  if(f.k==='frag'){ctx.globalAlpha=a;circ(ctx,f.x,f.y,f.r);ctx.fillStyle=f.col;ctx.fill()}
  else if(f.k==='ring'){ctx.globalAlpha=a;circ(ctx,f.x,f.y,f.r*(1.2-a*.6));ctx.strokeStyle=f.col;ctx.lineWidth=.06;ctx.stroke()}
  else if(f.k==='orb'){const k=1-a,e=k*k*(3-2*k),x=f.sx+(f.tx-f.sx)*e,y=f.sy+(f.ty-f.sy)*e-Math.sin(k*Math.PI)*2.5;if(k<1){ctx.globalAlpha=1;circ(ctx,x,y,.2);ctx.fillStyle=f.col;ctx.fill();ctx.lineWidth=.05;ctx.strokeStyle='#fff';ctx.stroke()}}
  else if(f.k==='text'){ctx.globalAlpha=Math.min(1,a*2);ctx.font=`bold ${f.size||.55}px system-ui,sans-serif`;ctx.textAlign='center';ctx.lineWidth=.12;ctx.strokeStyle='#000';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y)}
  ctx.globalAlpha=1}
 ctx.restore();
 const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

load();setMode('home');updUI();requestAnimationFrame(frame);
if(!state.seenHelp)openHelp();else offlineRaid();
addEventListener('beforeunload',save);
